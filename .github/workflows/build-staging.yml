name: "Build Staging"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "Kernel source type"
        type: choice
        default: "gki"
        options:
          - gki
          - seiran
      seiran_branch:
        description: "seiran kernel branch (seiran source only)"
        type: string
        default: "seiran"
      ksu_variants:
        description: "KSU variant(s) to build"
        type: choice
        default: "both"
        options:
          - both
          - ksun
          - sksu
          - none
      notify:
        description: "Send Telegram notifications"
        type: boolean
        default: false
      use_ccache:
        description: "Enable ccache compiler acceleration (experimental / test only)"
        type: boolean
        default: false

permissions:
  contents: read
  actions:  read

jobs:

  matrix:
    name: "Resolve matrix"
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set.outputs.variants }}
    steps:
      - name: "Compute variant list"
        id: set
        env:
          SOURCE_TYPE:  ${{ inputs.source_type }}
          KSU_VARIANTS: ${{ inputs.ksu_variants }}
        run: |
          python3 <<'EOF'
          import json, os
          src = os.environ["SOURCE_TYPE"]
          ksu = os.environ["KSU_VARIANTS"]
          all_variants = [
              {"name": "GKI-KSU-Next",        "source": "gki",    "ksu": "ksun", "artifact": "staging-ksun"},
              {"name": "GKI-SukiSU-Ultra",    "source": "gki",    "ksu": "sksu", "artifact": "staging-sksu"},
              {"name": "Seiran-KSU-Next",     "source": "seiran", "ksu": "ksun", "artifact": "seiran-ksun"},
              {"name": "Seiran-SukiSU-Ultra", "source": "seiran", "ksu": "sksu", "artifact": "seiran-sksu"},
          ]
          chosen = [v for v in all_variants if v["source"] == src]
          if ksu != "both":
              chosen = [v for v in chosen if v["ksu"] == ksu]
          out = f"variants={json.dumps(chosen)}\n"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(out)
          EOF

  staging:
    name: "${{ matrix.variant.name }}"
    needs: [matrix]
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.matrix.outputs.variants) }}
    uses: ./.github/workflows/build-kernel.yml
    with:
      variant_name:  ${{ matrix.variant.name }}
      source_type:   ${{ matrix.variant.source }}
      ksu_type:      ${{ matrix.variant.ksu }}
      zip_prefix:    ${{ matrix.variant.source == 'seiran' && 'seiran' || 'Staging' }}
      artifact_name: ${{ matrix.variant.artifact }}
      defconfig:     "gki_defconfig"
      build_type:    "testing"
      notify:        ${{ inputs.notify == true }}
      use_ccache:    ${{ inputs.use_ccache == true }}
      seiran_branch: ${{ inputs.seiran_branch }}
    secrets: inherit

  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs: [staging]
    if: always() && inputs.notify == true
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
      - name: "Telegram"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID:  ${{ secrets.TELEGRAM_TOPIC_ID }}
          RUN_URL:    "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_NUMBER: "${{ github.run_number }}"
          CHECK_RESULT: ${{ needs.staging.result }}
        run: bash scripts/notify.sh staging
