name: "📋 Collect Build Logs"

on:
  workflow_run:
    workflows: ["🔨 Build Kernels — AIO"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  collect-logs:
    name: "📋 Collect Logs"
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'cancelled'

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: "📥 Download release tag"
        uses: actions/download-artifact@v4.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: release-tag
          path: ./release-tag/

      - name: "📋 Build logs"
        env:
          GH_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          BUILD_TYPE:        testing
          TARGET_RUN_ID:     ${{ github.event.workflow_run.id }}
          TARGET_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          TARGET_SHA:        ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/build-logs.sh

      - name: "⬆️ Attach log to release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG=$(cat ./release-tag/tag.txt)
          echo "[..] Attaching $LOG_ZIP to release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "$LOG_ZIP" --clobber
