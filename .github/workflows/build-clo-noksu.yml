name: "Build CLO Kernel (NoKSU)"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernels:
    name: "Build CLO Kernel (NoKSU)"
    runs-on: ubuntu-latest
    outputs:
      build_start_time: ${{ steps.set_time.outputs.start_time }}
    
    env:
      KERNEL_LOC_DIR: "common_clo"
      KERNEL_NAME: "clo"
      KERNEL_REPO: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
      KERNEL_BRANCH: "kernel.lnx.5.15.r1-rel"
      DEFCONFIG_NAME: "gki_defconfig"
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "Set build start time"
        id: set_time
        run: |
          START_TIME=$(date +%s)
          echo "start_time=$START_TIME" >> $GITHUB_OUTPUT
          echo "BUILD_START_TIME=$START_TIME" >> $GITHUB_ENV

      - name: "Send Telegram build started"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_NUMBER="${{ github.run_number }}"
          BRANCH="${{ env.KERNEL_BRANCH }}"
          
          MESSAGE="<b>🚀 Kernel Build Started</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>📦 Variant:</b> clo-noksu%0A"
          MESSAGE="${MESSAGE}<b>📁 Repository:</b> ${{ github.repository }}%0A"
          MESSAGE="${MESSAGE}<b>📍 Branch:</b> ${BRANCH}%0A"
          MESSAGE="${MESSAGE}<b>🔄 Trigger:</b> ${{ github.event_name }}%0A"
          MESSAGE="${MESSAGE}<b>🆔 Run:</b> #${RUN_NUMBER}%0A"
          MESSAGE="${MESSAGE}<b>⏰ Started:</b> $(TZ='UTC' date +'%Y-%m-%d %H:%M UTC')%0A"
          MESSAGE="${MESSAGE}<b>⏳ Status:</b> Initializing..."
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" || true

      - name: "Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 bc bison build-essential flex git libelf-dev libssl-dev curl jq

      - name: "Free disk space"
        run: |
          echo "📦 Disk before cleanup:"
          df -h /
          
          # Remove large unused packages
          sudo apt-get remove -y \
            '^dotnet-.*' '^llvm-.*' '^php.*' '^mongodb.*' \
            azure-cli google-cloud-cli google-chrome-stable \
            firefox powershell mono-devel snapd \
            libgl1-mesa-dri 2>/dev/null || true
          
          sudo apt-get autoremove -y
          sudo apt-get clean
          
          # Remove large preinstalled directories
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          
          echo "✅ Disk after cleanup:"
          df -h /

      - name: "Setup SWAP 8GB"
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8
          
      - name: "Tune Swap"
        run: |
          echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: "Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)
          
          rm -rf .repo
          rm -rf common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "Setup Baseband-guard (BBG)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard
          
          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          
          grep -q "baseband-guard/Kconfig" security/Kconfig || \
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' security/Kconfig

      - name: "Add kernel configurations"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KALLSYMS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_OVERLAY_FS_REDIRECT_ALWAYS_FOLLOW=y
          CONFIG_OVERLAY_FS_INDEX=y
          CONFIG_OVERLAY_FS_XINO_AUTO=y
          CONFIG_OVERLAY_FS_METACOPY=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          EOF
          
          echo "✅ Kernel configurations added successfully"
          
      - name: "Configure kernel name and remove dirty"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          export TZ="Asia/Jakarta"
          CURRENT_TIME=$(date -u +"%a %b %d %H:%M:%S UTC %Y")
          
          # Generate random hash-like suffix (looks like stock kernel)
          RANDOM_HASH=$(openssl rand -hex 6)
          KERNEL_SUFFIX="-ab${RANDOM_HASH}"
          
          echo "CURRENT_TIME=$CURRENT_TIME"
          echo "KERNEL_SUFFIX=$KERNEL_SUFFIX"
          
          sed -i "\$s|echo \"\\\$res\"|echo \"\\\$res${KERNEL_SUFFIX}\"|" ./scripts/setlocalversion
          
          perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $CURRENT_TIME\"}" ./scripts/mkcompile_h
          
          sed -i 's/-dirty//' ./scripts/setlocalversion
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Wild: Clean Dirty Flag" || true

      - name: "Fix ABI and build configs"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if [ -f "build/abi/compare_to_symbol_list" ]; then
            mv build/abi/compare_to_symbol_list build/abi/compare_to_symbol_list.disabled
          fi
          
          cat > build/abi/compare_to_symbol_list << 'EOF'
          #!/bin/bash
          echo "ABI checking disabled for custom kernel build"
          exit 0
          EOF
          chmod +x build/abi/compare_to_symbol_list
          
          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64

      - name: "Build kernel"
        id: build
        working-directory: ${{ env.WORK_DIR }}
        timeout-minutes: 45
        run: |
          set -e
          echo "🚀 Starting kernel build with $(nproc) cores..."
          
          export LTO=thin
          export SKIP_ABI_CHECKS=1
          export SKIP_KMI_CHECK=1
          
          START_BUILD=$(date +%s)
          
          if ! BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
            build/build.sh -j$(nproc); then
            echo "BUILD_FAILED=1" >> $GITHUB_ENV
            exit 1
          fi
          
          END_BUILD=$(date +%s)
          DURATION=$((END_BUILD - START_BUILD))
          echo "✅ Build completed in $((DURATION / 60))m $((DURATION % 60))s"
          
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: "Verify kernel version"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          echo "🔍 VERIFYING KERNEL VERSION"
          
          VERSION_FULL=$(strings Image | grep "Linux version 5" | head -1)
          echo "Full version string: $VERSION_FULL"
          
          if echo "$VERSION_FULL" | grep -q "dirty"; then
            echo "❌ ERROR: Kernel contains -dirty!"
            exit 1
          fi
          
          VERSION_CLEAN=$(echo "$VERSION_FULL" | sed 's/Linux version //' | sed 's/ (.*//')
          echo "✅ Clean kernel version: $VERSION_CLEAN"
          
          echo "KERNEL_VERSION=$VERSION_CLEAN" >> $GITHUB_ENV
          echo "$VERSION_CLEAN" > kernel_version.txt

      - name: "Copy kernel image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "Image.noksu"
          echo "📦 Kernel image:"
          ls -lh Image.noksu

      - name: "Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: clo-noksu-kernel
          path: |
            ${{ env.WORK_DIR }}/out/dist/Image.noksu
            ${{ env.WORK_DIR }}/out/dist/kernel_version.txt
          retention-days: 1

  package-kernel:
    name: "Package Kernel"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: success()
    
    steps:
      - name: "Download kernel artifact"
        uses: actions/download-artifact@v4
        with:
          name: clo-noksu-kernel
          path: ./artifacts/

      - name: "Read kernel version"
        run: |
          if [ -f "./artifacts/kernel_version.txt" ]; then
            KERNEL_VERSION=$(cat ./artifacts/kernel_version.txt)
            echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
            echo "📋 Detected kernel version: $KERNEL_VERSION"
          else
            echo "⚠️ kernel_version.txt not found, using placeholder"
            echo "KERNEL_VERSION=5.15.x-unknown" >> $GITHUB_ENV
          fi

      - name: "Create ZIP package"
        run: |
          set -e
          echo "📦 Creating AnyKernel3 package..."
         
          git clone --depth=1 https://github.com/superuseryu/AnyKernel3
         
          if [ ! -f "./artifacts/Image.noksu" ]; then
            echo "ERROR: Image.noksu not found in artifacts!"
            ls -la ./artifacts/
            exit 1
          fi
         
          cp ./artifacts/Image.noksu AnyKernel3/
         
          DATE_TAG=$(date +'%Y%m%d')
          ZIP_NAME="Anykernel3_NoKSU_CLO_${DATE_TAG}.zip"
         
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
         
          ZIP_SIZE=$(stat -c%s "$ZIP_NAME")
          ZIP_SIZE_MB=$(echo "scale=2; $ZIP_SIZE / 1024 / 1024" | bc)
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)
          ZIP_SHA256_SHORT=$(echo "$ZIP_SHA256" | cut -c1-16)
         
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_SIZE_MB=$ZIP_SIZE_MB" >> $GITHUB_ENV
          echo "ZIP_SHA256=$ZIP_SHA256" >> $GITHUB_ENV
          echo "ZIP_SHA256_SHORT=$ZIP_SHA256_SHORT" >> $GITHUB_ENV
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV
         
          echo "✅ Package created: $ZIP_NAME ($ZIP_SIZE_MB MB)"
          echo "📊 Size: $ZIP_SIZE_MB MB"
          echo "🔐 SHA256: $ZIP_SHA256"
          
          # Verify ZIP integrity
          unzip -t "$ZIP_NAME"
          file "$ZIP_NAME"
          ls -la "$ZIP_NAME"

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: "NoKSU_CLO"

      - name: "Send Telegram success notification"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/NoKSU_CLO"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          BUILD_END_TIME=$(date +%s)
          BUILD_START_TIME="${{ needs.build-kernels.outputs.build_start_time }}"
          DURATION=$((BUILD_END_TIME - BUILD_START_TIME))
          DURATION_MIN=$((DURATION / 60))
          DURATION_SEC=$((DURATION % 60))
          
          SHORT_SHA=$(echo "${{ env.ZIP_SHA256 }}" | cut -c1-20)
          
          MESSAGE="<b>🎉 Build Success!</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>📦 File:</b> <code>${{ env.ZIP_NAME }}</code>%0A"
          MESSAGE="${MESSAGE}<b>📊 Size:</b> ${{ env.ZIP_SIZE_MB }} MB%0A"
          MESSAGE="${MESSAGE}<b>🔐 SHA256:</b> <code>${SHORT_SHA}...</code>%0A"
          MESSAGE="${MESSAGE}<b>🪧 Kernel:</b> <code>${{ env.KERNEL_VERSION }}</code>%0A"
          MESSAGE="${MESSAGE}<b>🔗 Release:</b> <a href='${RELEASE_URL}'>click-here</a>%0A"
          MESSAGE="${MESSAGE}<b>📝 Logs:</b> <a href='${RUN_URL}'>View</a>%0A"
          MESSAGE="${MESSAGE}<b>🗓️ Build Time:</b> ${DURATION_MIN}m ${DURATION_SEC}s%0A"
          MESSAGE="${MESSAGE}<b>📌 Variant:</b> CLO-NoKSU%0A"
          MESSAGE="${MESSAGE}   - BBG%0A"
          MESSAGE="${MESSAGE}   - BBRv1 Westwood TCP%0A%0A"
          MESSAGE="${MESSAGE}<b>📣 Author/Maintainer:</b> @superuseryu%0A%0A"
          MESSAGE="${MESSAGE}#kernel #clo #sapphire #sapphiren"
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true
          
          if (( $(echo "${{ env.ZIP_SIZE_MB }} < 50" | bc -l) )); then
            echo "📤 Sending ZIP file to Telegram..."
            CAPTION=$'📦 ${{ env.ZIP_NAME }} (${{ env.ZIP_SIZE_MB }} MB)\n🔐 SHA256: ${{ env.ZIP_SHA256 }}'
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@"${{ env.ZIP_NAME }}" \
              -F caption="$CAPTION"
          else
            echo "ℹ️ File size (${{ env.ZIP_SIZE_MB }} MB) too large, sending download link only."
          fi

  notify-failure:
    name: "Notify Failure"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: always() && needs.build-kernels.result != 'success'
    steps:
      - name: "Send Telegram failure notification"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          JOB_STATUS="${{ needs.build-kernels.result }}"
          
          if [ "$JOB_STATUS" = "cancelled" ]; then
            STATUS_ICON="⚠️"
            STATUS_TEXT="Workflow Cancelled"
          elif [ "$JOB_STATUS" = "failure" ]; then
            STATUS_ICON="❌"
            STATUS_TEXT="Build Failed"
          else
            STATUS_ICON="❓"
            STATUS_TEXT="Unknown Status ($JOB_STATUS)"
          fi
          
          MESSAGE="<b>${STATUS_ICON} ${STATUS_TEXT}!</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>📦 Variant:</b> clo-noksu%0A"
          MESSAGE="${MESSAGE}<b>🕐 Time:</b> $(TZ='Asia/Jakarta' date +'%H:%M:%S WIB')%0A"
          MESSAGE="${MESSAGE}<b>🔗 Logs:</b> <a href='${RUN_URL}'>View Logs</a>%0A"
          MESSAGE="${MESSAGE}<b>📌 Status:</b> ${JOB_STATUS}%0A"
          
          if [ "$JOB_STATUS" = "cancelled" ]; then
            MESSAGE="${MESSAGE}<b>⚠️ Possible causes:</b> Manual cancel, OOM killer, or infrastructure issue.%0A"
          fi
          
          MESSAGE="${MESSAGE}<b>⚠️ Check the logs for details.</b>"
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" || true
