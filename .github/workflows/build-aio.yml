name: "Build Kernel AIO"

env:
  OUT_DIR: "out"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      is_testing:
        description: "Mark as Testing Build?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  # -- setup job: record global start time --
  setup:
    name: "⏱️ Setup"
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.ts.outputs.start_time }}
    steps:
      - name: "Record start time"
        id: ts
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: "📣 Send Telegram — Build started"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ inputs.is_testing }}" = "true" ]; then
            BUILD_TYPE="🧪 Testing Build"
          else
            BUILD_TYPE="🧩 Stable Build"
          fi
          MESSAGE="<b>🔨 Kernel Build Started</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>📦 Type:</b> ${BUILD_TYPE}%0A"
          MESSAGE="${MESSAGE}<b>📁 Repository:</b> ${{ github.repository }}%0A"
          MESSAGE="${MESSAGE}<b>🔄 Trigger:</b> ${{ github.event_name }}%0A"
          MESSAGE="${MESSAGE}<b>🆔 Run:</b> #${{ github.run_number }}%0A"
          MESSAGE="${MESSAGE}<b>⏰ Started:</b> $(TZ='UTC' date +'%Y-%m-%d %H:%M UTC')%0A"
          MESSAGE="${MESSAGE}<b>📝 Logs:</b> <a href='${RUN_URL}'>View</a>"
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true || true

  # -- matrix build job --
  build-kernels:
    name: "🔨 Build ${{ matrix.kernel.name }}"
    runs-on: ubuntu-latest
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        kernel:
          # -- GKI (AOSP android13-5.15-lts) + Wild-KSU + SUSFS + BBG --
          - name: "GKI-KSU"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            output_name: "Image.gki.ksu"
            artifact_name: "gki-ksu-kernel"
            ksu_type: "wild"
            tg_variant: "GKI + Wild-KSU + SUSFS + BBG"

          # -- CLO (CodeLinaro msm-5.15) + Wild-KSU + SUSFS + BBG --
          - name: "CLO-KSU"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r59-rel"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            output_name: "Image.clo.ksu"
            artifact_name: "clo-ksu-kernel"
            ksu_type: "wild"
            tg_variant: "CLO + Wild-KSU + SUSFS + BBG"

          # -- GKI (AOSP android13-5.15-lts) + SukiSU Ultra + SUSFS + BBG --
          - name: "GKI-SukiSU"
            dir: "common_gki_suki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            output_name: "Image.gki.suki"
            artifact_name: "gki-suki-kernel"
            ksu_type: "suki"
            tg_variant: "GKI + SukiSU Ultra + SUSFS + BBG"

          # -- CLO (CodeLinaro msm-5.15) + SukiSU Ultra + SUSFS + BBG --
          - name: "CLO-SukiSU"
            dir: "common_clo_suki"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r59-rel"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            output_name: "Image.clo.suki"
            artifact_name: "clo-suki-kernel"
            ksu_type: "suki"
            tg_variant: "CLO + SukiSU Ultra + SUSFS + BBG"

          # -- GKI Vanilla (AOSP android13-5.15-lts) + BBG only --
          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            output_name: "Image.gki.noksu"
            artifact_name: "gki-noksu-kernel"
            ksu_type: "none"
            tg_variant: "GKI Vanilla + BBG"

          # -- CLO Vanilla (CodeLinaro msm-5.15) + BBG only --
          - name: "CLO-NoKSU"
            dir: "common_clo_noksu"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r59-rel"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            output_name: "Image.clo.noksu"
            artifact_name: "clo-noksu-kernel"
            ksu_type: "none"
            tg_variant: "CLO Vanilla + BBG"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      WORK_DIR: ${{ github.workspace }}

    steps:

      - name: "🛠️ Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 bc bison build-essential flex git libelf-dev libssl-dev curl jq

      - name: "🧹 Free disk space"
        run: |
          echo "📦 Disk before cleanup:"
          df -h /
          sudo apt-get remove -y \
            '^dotnet-.*' '^llvm-.*' '^php.*' '^mongodb.*' \
            azure-cli google-cloud-cli google-chrome-stable \
            firefox powershell mono-devel snapd \
            libgl1-mesa-dri 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          echo "✅ Disk after cleanup:"
          df -h /

      - name: "📐 Setup SWAP 8GB"
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: "📐 Tune Swap"
        run: |
          echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "📥 Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)

          rm -rf .repo
          rm -rf common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz \
            "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz \
            -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable

          sed -i \
            -e 's/^BRANCH=.*/BRANCH=${{ matrix.kernel.config_branch }}/' \
            -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants

          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "🛡️ Setup Baseband-guard (BBG)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard

          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile

          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' \
            security/Kconfig

          grep -q "baseband-guard/Kconfig" security/Kconfig || \
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' \
            security/Kconfig

      # -- Wild-KSU stable + SUSFS — directory-wide copy [IMPROVE #1] --
      - name: "😋 Setup Wild-KSU with SUSFS"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e

          rm -rf ./KernelSU ./drivers/kernelsu ./Wild_KSU

          echo "Installing Wild-KSU (stable)..."
          
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s stable

          if [ ! -d "Wild_KSU" ]; then
            echo "ERROR: Wild_KSU directory not found!"
            exit 1
          fi

          echo "Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          if [ ! -d "susfs4ksu" ]; then
            echo "ERROR: SUSFS4KSU clone failed!"
            exit 1
          fi

          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if [ -f "$SUSFS_PATCH" ]; then
            if patch -p1 --forward < "$SUSFS_PATCH"; then
              echo "✅ SUSFS kernel patch applied"
            else
              echo "⚠️ Patch had some issues, continuing..."
            fi
          fi

          # [IMPROVE #1] directory-wide copy — picks up any new/renamed files automatically
          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/* fs/
          cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/

          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* Wild_KSU/kernel/ || true
          fi

          KSU_C_FILE="Wild_KSU/kernel/ksu.c"
          if [ ! -f "$KSU_C_FILE" ]; then
            echo "ERROR: $KSU_C_FILE not found!"
            exit 1
          fi

          if ! grep -q "susfs_init" "$KSU_C_FILE" 2>/dev/null; then
            if ! grep -q "#include <linux/susfs.h>" "$KSU_C_FILE"; then
              sed -i '/#include <linux\/fs\.h>/a #include <linux/susfs.h>' "$KSU_C_FILE"
            fi
            if ! grep -q "susfs_init()" "$KSU_C_FILE"; then
              sed -i '/ksu_core_init();/a \\tsusfs_init();' "$KSU_C_FILE" || \
              sed -i '/int __init ksu_init(/,/^}/{ /return 0;/i \\tsusfs_init(); }' "$KSU_C_FILE"
            fi
          fi

          if [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ]; then
            ln -sf ../Wild_KSU drivers/kernelsu
          fi

          rm -rf susfs4ksu

      # -- [IMPROVE #3] SukiSU Ultra + SUSFS manual setup --
      - name: "🌸 Setup SukiSU Ultra with SUSFS"
        if: matrix.kernel.ksu_type == 'suki'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e

          rm -rf ./KernelSU ./drivers/kernelsu

          echo "Installing SukiSU Ultra (main)..."
          # setup.sh clones into 'KernelSU' directory
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

          if [ ! -d "KernelSU" ]; then
            echo "ERROR: KernelSU directory not found!"
            exit 1
          fi

          echo "Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          if [ ! -d "susfs4ksu" ]; then
            echo "ERROR: SUSFS4KSU clone failed!"
            exit 1
          fi

          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if [ -f "$SUSFS_PATCH" ]; then
            if patch -p1 --forward < "$SUSFS_PATCH"; then
              echo "✅ SUSFS kernel patch applied"
            else
              echo "⚠️ Patch had some issues, continuing..."
            fi
          fi

          # [IMPROVE #1] directory-wide copy
          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/* fs/
          cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/

          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* KernelSU/kernel/ || true
          fi

          if [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ]; then
            ln -sf ../KernelSU drivers/kernelsu
          fi

          rm -rf susfs4ksu
          echo "✅ SukiSU Ultra installed with SUSFS"

      # -- Wild-KSU only: Fix SUSFS symbol mismatches --
      - name: "🔧 Fix SUSFS compatibility stubs"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e
          SUSFS_C="fs/susfs.c"
          SUSFS_H="include/linux/susfs.h"
          SETUID_HOOK="drivers/kernelsu/setuid_hook.c"
          SUPERCALLS="drivers/kernelsu/supercalls.c"

          add_stub_c() {
            local func="$1"
            local signature="$2"
            local body="$3"
            if ! grep -q "$func" "$SUSFS_C" 2>/dev/null; then
              echo "⚠️  $func missing from susfs.c — adding stub..."
              printf "\n/* Compatibility stub: $func not in this SUSFS version */\n" >> "$SUSFS_C"
              printf "%s\n" "$signature" >> "$SUSFS_C"
              printf "{\n\t$body\n}\n" >> "$SUSFS_C"
              echo "✅ $func stub added to susfs.c"
            else
              echo "✅ $func already defined — skip"
            fi
          }

          add_stub_h() {
            local func="$1"
            local decl="$2"
            if ! grep -q "$func" "$SUSFS_H" 2>/dev/null; then
              sed -i "/^#endif/i $decl" "$SUSFS_H"
              echo "✅ $func declaration added to susfs.h"
            fi
          }

          # -- Fix 1: susfs_reorder_mnt_id (setuid_hook.c) --
          if grep -q "susfs_reorder_mnt_id" "$SETUID_HOOK" 2>/dev/null; then
            add_stub_c "susfs_reorder_mnt_id" \
              "void susfs_reorder_mnt_id(struct task_struct *task)" \
              "return;"
            add_stub_h "susfs_reorder_mnt_id" \
              "void susfs_reorder_mnt_id(struct task_struct *task);"
          else
            echo "✅ susfs_reorder_mnt_id not referenced — skip"
          fi

          # -- Fix 2: susfs_set_i_state_on_external_dir (supercalls.c) --
          if grep -q "susfs_set_i_state_on_external_dir" "$SUPERCALLS" 2>/dev/null; then
            add_stub_c "susfs_set_i_state_on_external_dir" \
              "void susfs_set_i_state_on_external_dir(struct inode *inode)" \
              "return;"
            add_stub_h "susfs_set_i_state_on_external_dir" \
              "void susfs_set_i_state_on_external_dir(struct inode *inode);"
            if ! grep -q "#include <linux/susfs.h>" "$SUPERCALLS" 2>/dev/null; then
              sed -i '/#include <linux\/fs\.h>/a #include <linux/susfs.h>' "$SUPERCALLS"
              echo "✅ Added susfs.h include to supercalls.c"
            else
              echo "✅ susfs.h already included in supercalls.c"
            fi
            sed -i 's/susfs_set_i_state_on_external_dir(arg)/susfs_set_i_state_on_external_dir((struct inode \*)arg)/g' "$SUPERCALLS"
            echo "✅ Patched susfs_set_i_state_on_external_dir call sites with cast"
          else
            echo "✅ susfs_set_i_state_on_external_dir not referenced — skip"
          fi

      # -- GKI fixup patches (all variants) --
      - name: "🩹 Apply GKI fixup patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          # Patch 1: drivers/of/property.c — fix io-channel DT property typo
          OF_PROP="drivers/of/property.c"
          if [ -f "$OF_PROP" ]; then
            sed -i 's/DEFINE_SIMPLE_PROP(io_channels, "io-channels",/DEFINE_SIMPLE_PROP(io_channels, "io-channel",/' "$OF_PROP"
            echo "✅ io-channel DT property fix applied"
          else
            echo "⚠️  $OF_PROP not found, skip"
          fi

          # Patch 2: drivers/usb/dwc3 — fix USB reconnect bug
          DWC3_CORE="drivers/usb/dwc3/core.c"
          DWC3_GADGET="drivers/usb/dwc3/gadget.c"
          DWC3_HEADER="drivers/usb/dwc3/core.h"

          if [ -f "$DWC3_GADGET" ]; then
            sed -i '/dwc3_core_soft_reset(dwc);/{
              N; /dwc3_event_buffers_setup(dwc);/{
                d
              }
            }' "$DWC3_GADGET"
            sed -i '/^\s*dwc3_core_soft_reset(dwc);\s*$/d' "$DWC3_GADGET"
            echo "✅ dwc3 gadget soft_connect fix applied"
          else
            echo "⚠️  $DWC3_GADGET not found, skip"
          fi

          if [ -f "$DWC3_CORE" ]; then
            if ! grep -q "static int dwc3_core_soft_reset(struct dwc3 \*dwc);" "$DWC3_CORE"; then
              sed -i '/^static void __dwc3_set_mode/i static int dwc3_core_soft_reset(struct dwc3 *dwc);' "$DWC3_CORE"
            fi
            sed -i 's/^int dwc3_core_soft_reset(struct dwc3 \*dwc)$/static int dwc3_core_soft_reset(struct dwc3 *dwc)/' "$DWC3_CORE"
            echo "✅ dwc3 core_soft_reset static fix applied"
          else
            echo "⚠️  $DWC3_CORE not found, skip"
          fi

          if [ -f "$DWC3_HEADER" ]; then
            sed -i '/^int dwc3_core_soft_reset(struct dwc3 \*dwc);$/d' "$DWC3_HEADER"
            echo "✅ dwc3 header declaration removed"
          else
            echo "⚠️  $DWC3_HEADER not found, skip"
          fi

      # -- [IMPROVE #4] Base kernel configs — all variants --
      - name: "⚙️ Add base kernel configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "⚙️ Adding base configs..."
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KALLSYMS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_OVERLAY_FS_REDIRECT_ALWAYS_FOLLOW=y
          CONFIG_OVERLAY_FS_INDEX=y
          CONFIG_OVERLAY_FS_XINO_AUTO=y
          CONFIG_OVERLAY_FS_METACOPY=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          CONFIG_ZRAM_WRITEBACK=y
          CONFIG_ZRAM_MEMORY_TRACKING=y
          EOF
          echo "✅ Base configs added"

      # -- [IMPROVE #4] Wild-KSU configs — conditional, KPROBES only for Wild --
      - name: "⚙️ Add Wild-KSU + SUSFS kernel configs"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "⚙️ Adding Wild-KSU + SUSFS configs..."
          cat >> "$CONFIG_FILE" << 'EOF'
          # -- KSU Base --
          CONFIG_KSU=y
          CONFIG_KPM=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          # -- SUSFS --
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          echo "✅ Wild-KSU + SUSFS configs added"

      # -- [IMPROVE #4] SukiSU Ultra configs — KPM enabled, no KPROBES needed --
      - name: "⚙️ Add SukiSU Ultra + SUSFS kernel configs"
        if: matrix.kernel.ksu_type == 'suki'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "⚙️ Adding SukiSU Ultra + SUSFS configs..."
          cat >> "$CONFIG_FILE" << 'EOF'
          # -- KSU Base --
          CONFIG_KSU=y
          CONFIG_KPM=y
          # -- SUSFS (bundled via susfs-main) --
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          echo "✅ SukiSU Ultra + SUSFS configs added"

      - name: "🏷️ Configure kernel name and remove dirty"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          export TZ="Asia/Jakarta"
          CURRENT_TIME=$(date -u +"%a %b %d %H:%M:%S UTC %Y")
          RANDOM_HASH=$(openssl rand -hex 6)
          KERNEL_SUFFIX="-ab${RANDOM_HASH}"

          sed -i "\$s|echo \"\\\$res\"|echo \"\\\$res${KERNEL_SUFFIX}\"|" ./scripts/setlocalversion

          perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $CURRENT_TIME\"}" \
            ./scripts/mkcompile_h

          sed -i 's/-dirty//' ./scripts/setlocalversion

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Wild: Clean Dirty Flag" || true

      - name: "🔩 Fix ABI and build configs"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if [ -f "build/abi/compare_to_symbol_list" ]; then
            mv build/abi/compare_to_symbol_list build/abi/compare_to_symbol_list.disabled
          fi
          cat > build/abi/compare_to_symbol_list << 'EOF'
          #!/bin/bash
          echo "ABI checking disabled for custom kernel build"
          exit 0
          EOF
          chmod +x build/abi/compare_to_symbol_list

          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64

      - name: "🚀 Build kernel"
        id: build
        working-directory: ${{ env.WORK_DIR }}
        timeout-minutes: 45
        run: |
          set -e
          echo "🚀 Starting kernel build with $(nproc) cores..."
          export LTO=thin
          export SKIP_ABI_CHECKS=1
          export SKIP_KMI_CHECK=1

          START_BUILD=$(date +%s)

          if ! BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
            build/build.sh -j$(nproc); then
            echo "BUILD_FAILED=1" >> $GITHUB_ENV
            exit 1
          fi

          END_BUILD=$(date +%s)
          DURATION=$((END_BUILD - START_BUILD))
          echo "✅ Build completed in $((DURATION / 60))m $((DURATION % 60))s"
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: "🔍 Verify kernel version"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          VERSION_FULL=$(strings Image | grep "Linux version 5" | head -1)
          echo "Full version string: $VERSION_FULL"
          if echo "$VERSION_FULL" | grep -q "dirty"; then
            echo "❌ ERROR: Kernel contains -dirty!"
            exit 1
          fi
          VERSION_CLEAN=$(echo "$VERSION_FULL" | sed 's/Linux version //' | sed 's/ (.*//')
          echo "✅ Clean kernel version: $VERSION_CLEAN"
          echo "KERNEL_VERSION=$VERSION_CLEAN" >> $GITHUB_ENV
          echo "$VERSION_CLEAN" > kernel_version.txt

      - name: "📁 Copy kernel image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "${{ matrix.kernel.output_name }}"
          echo "📦 Kernel image:"
          ls -lh "${{ matrix.kernel.output_name }}"

      - name: "📤 Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.artifact_name }}
          path: |
            ${{ env.WORK_DIR }}/out/dist/${{ matrix.kernel.output_name }}
            ${{ env.WORK_DIR }}/out/dist/kernel_version.txt
          retention-days: 1

  # -- package all 6 kernels into one AIO ZIP --
  package-kernels:
    name: "📦 Package AIO"
    runs-on: ubuntu-latest
    needs: [setup, build-kernels]
    if: success()

    steps:
      - name: "📥 Download all kernel artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "📋 Read kernel version"
        run: |
          VERSION_FILE=$(find ./artifacts -name "kernel_version.txt" | head -1)
          if [ -f "$VERSION_FILE" ]; then
            KERNEL_VERSION=$(cat "$VERSION_FILE")
            echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
            echo "📋 Kernel version: $KERNEL_VERSION"
          else
            echo "KERNEL_VERSION=5.15.x" >> $GITHUB_ENV
          fi

      - name: "📦 Create AIO ZIP package"
        run: |
          set -e
          echo "📦 Creating AnyKernel3 AIO package..."

          git clone --depth=1 https://github.com/superuseryu/AnyKernel3

          # Copy all kernel images from all artifacts
          find ./artifacts -name "Image.*" -exec cp {} AnyKernel3/ \;

          echo "📋 Images included:"
          ls -lh AnyKernel3/Image.* 2>/dev/null || echo "No images found!"

          DATE_TAG=$(date +'%Y%m%d')
          ZIP_NAME="Anykernel3_AIO_${DATE_TAG}.zip"

          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..

          ZIP_SIZE=$(stat -c%s "$ZIP_NAME")
          ZIP_SIZE_MB=$(echo "scale=2; $ZIP_SIZE / 1024 / 1024" | bc)
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_SIZE_MB=$ZIP_SIZE_MB" >> $GITHUB_ENV
          echo "ZIP_SHA256=$ZIP_SHA256" >> $GITHUB_ENV
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV

          echo "✅ Package: $ZIP_NAME ($ZIP_SIZE_MB MB)"
          echo "🔐 SHA256: $ZIP_SHA256"

          unzip -t "$ZIP_NAME"
          ls -la "$ZIP_NAME"

      - name: "⬆️ Create GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: "AIO_Kernel"
          name: "AIO Kernel Pack"
          body: |
            ### Features:
            - Wild-KSU (stable) + SUSFS ඞ v2.0.0
            - SukiSU Ultra + SUSFS ඞ v2.0.0
            - Baseband Guard (BBG)
            - BBRv1 + Westwood TCP Congestion Control
            - KPM (Kernel Plugin Module)

            ### Variants included:
            - `Image.gki.ksu` — GKI + Wild-KSU + SUSFS
            - `Image.clo.ksu` — CLO + Wild-KSU + SUSFS
            - `Image.gki.suki` — GKI + SukiSU Ultra + SUSFS
            - `Image.clo.suki` — CLO + SukiSU Ultra + SUSFS
            - `Image.gki.noksu` — GKI Vanilla (no root)
            - `Image.clo.noksu` — CLO Vanilla (no root)

            ### Installation:
            1. Flash via OrangeFox / TWRP
            2. Select kernel source (GKI / CLO) and variant when prompted
            3. Reboot

      - name: "🎉 Send Telegram — Package success"
        if: success()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/AIO_Kernel"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BUILD_END=$(date +%s)
          BUILD_START="${{ needs.setup.outputs.start_time }}"
          DURATION=$((BUILD_END - BUILD_START))
          DURATION_MIN=$((DURATION / 60))
          DURATION_SEC=$((DURATION % 60))

          SHORT_SHA=$(echo "${{ env.ZIP_SHA256 }}" | cut -c1-20)

          if [ "${{ inputs.is_testing }}" = "true" ]; then
            BUILD_TYPE="🧪 Testing Build"
          else
            BUILD_TYPE="🧩 Stable Build"
          fi

          MESSAGE="<b>🎉 Build Success!</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>✏️ Type:</b> ${BUILD_TYPE}%0A"
          MESSAGE="${MESSAGE}<b>📦 File:</b> <code>${{ env.ZIP_NAME }}</code>%0A"
          MESSAGE="${MESSAGE}<b>📊 Size:</b> ${{ env.ZIP_SIZE_MB }} MB%0A"
          MESSAGE="${MESSAGE}<b>🔐 SHA256:</b> <code>${SHORT_SHA}...</code>%0A"
          MESSAGE="${MESSAGE}<b>⏱️ Build Time:</b> ${DURATION_MIN}m ${DURATION_SEC}s%0A"
          MESSAGE="${MESSAGE}<b>🔗 Release:</b> <a href='${RELEASE_URL}'>click-here</a>%0A"
          MESSAGE="${MESSAGE}<b>📝 Logs:</b> <a href='${RUN_URL}'>View</a>%0A%0A"
          MESSAGE="${MESSAGE}<b>⚡ Features:</b>%0A"
          MESSAGE="${MESSAGE}   • Wild-KSU (stable) + SUSFS ඞ%0A"
          MESSAGE="${MESSAGE}   • SukiSU Ultra + SUSFS ඞ%0A"
          MESSAGE="${MESSAGE}   • BBRv1 + Westwood TCP%0A"
          MESSAGE="${MESSAGE}   • BBG%0A"
          MESSAGE="${MESSAGE}   • KPM%0A%0A"
          MESSAGE="${MESSAGE}<b>📣 Author/Maintainer:</b> @superuseryu%0A%0A"
          MESSAGE="${MESSAGE}#kernel #gki #clo #sapphire #sapphiren"

          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true

          if (( $(echo "${{ env.ZIP_SIZE_MB }} < 50" | bc -l) )); then
            echo "📤 Sending ZIP to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@"${{ env.ZIP_NAME }}" \
              -F caption="📦 ${{ env.ZIP_NAME }} (${{ env.ZIP_SIZE_MB }} MB)"
          fi

  # -- notify if build-kernels matrix fails --
  notify-failure:
    name: "❌ Notify Failure"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: always() && needs.build-kernels.result != 'success'
    steps:
      - name: "📣 Send Telegram — Build failed"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          JOB_STATUS="${{ needs.build-kernels.result }}"

          if [ "$JOB_STATUS" = "cancelled" ]; then
            STATUS_ICON="⚠️"
            STATUS_TEXT="Workflow Cancelled"
          elif [ "$JOB_STATUS" = "failure" ]; then
            STATUS_ICON="❌"
            STATUS_TEXT="Build Failed"
          else
            STATUS_ICON="❓"
            STATUS_TEXT="Unknown Status ($JOB_STATUS)"
          fi

          MESSAGE="<b>${STATUS_ICON} ${STATUS_TEXT}!</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>📦 Workflow:</b> Build Kernel AIO%0A"
          MESSAGE="${MESSAGE}<b>🕐 Time:</b> $(TZ='Asia/Jakarta' date +'%H:%M:%S WIB')%0A"
          MESSAGE="${MESSAGE}<b>🔗 Logs:</b> <a href='${RUN_URL}'>View Logs</a>"

          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" || true
