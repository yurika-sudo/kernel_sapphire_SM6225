name: "Build GKI-Legacy (5.15.123 — Legacy)"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [stable, testing]
        default: testing
      notify:
        description: "Send Telegram notifications"
        type: boolean
        default: false
      nuke_release:
        description: "Nuke ALL existing assets on this release before uploading (opt-in)"
        type: boolean
        default: true
      use_ccache:
        description: "Enable ccache compiler acceleration (experimental / test only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  setup:
    name: "Setup"
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.ts.outputs.start_time }}
    steps:
      - id: ts
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

  build:
    name: "${{ matrix.variant.name }}"
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name:      "GKI-Legacy-KSU-Next"
            source:    "gki-legacy"
            ksu:       "ksun"
            prefix:    "GKIL_KSU-Next"
            artifact:  "gkilegacy-ksun"
            defconfig: "gki_defconfig"

          - name:      "GKI-Legacy-ReSukiSU"
            source:    "gki-legacy"
            ksu:       "rsku"
            prefix:    "GKIL_ReSukiSU"
            artifact:  "gkilegacy-rsku"
            defconfig: "gki_defconfig"

          - name:      "GKI-Legacy-NoKSU"
            source:    "gki-legacy"
            ksu:       "none"
            prefix:    "GKIL_NoKSU"
            artifact:  "gkilegacy-nksu"
            defconfig: "gki_defconfig"

    uses: ./.github/workflows/build-kernel.yml
    with:
      variant_name:  ${{ matrix.variant.name }}
      source_type:   ${{ matrix.variant.source }}
      ksu_type:      ${{ matrix.variant.ksu }}
      zip_prefix:    ${{ matrix.variant.prefix }}
      artifact_name: ${{ matrix.variant.artifact }}
      defconfig:     ${{ matrix.variant.defconfig }}
      build_type:    ${{ inputs.build_type || 'stable' }}
      notify:        ${{ inputs.notify == true }}
      use_ccache:    ${{ inputs.use_ccache == true }}
    secrets: inherit

  release:
    name: "Package & Release"
    needs: [setup, build]
    if: success()
    uses: ./.github/workflows/release.yml
    with:
      zip_mode:   per-variant
      build_type: ${{ inputs.build_type || 'stable' }}
      start_time: ${{ needs.setup.outputs.start_time }}
      workflow_type: legacy
      nuke_release: ${{ inputs.nuke_release }}
      notify: ${{ inputs.notify == true }}
      use_ccache: ${{ inputs.use_ccache == true }}
    secrets: inherit

  notify-failure:
    name: "Notify Failure"
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && needs.build.result == 'cancelled' && inputs.notify == true
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
      - name: "Telegram"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID:  ${{ secrets.TELEGRAM_TOPIC_ID }}
          RUN_URL:    "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_NUMBER: "${{ github.run_number }}"
          BUILD_STATUS: "${{ needs.build.result }}"
        run: bash scripts/notify.sh failure
