name: "Build Kernel - Sapphire/n"

env:
  OUT_DIR: "out"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      is_testing:
        description: "Testing Build?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  setup:
    name: "⏱️ Setup"
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.ts.outputs.start_time }}
    steps:
      - id: ts
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

  build-kernels:
    name: "🔨 Build ${{ matrix.kernel.name }}"
    runs-on: ubuntu-latest
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI-Wild"
            dir: "common_gki_wild"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            artifact_name: "gki-wild-kernel"
            zip_prefix: "GKI_Wild"
            ksu_type: "wild"

          - name: "GKI-SukiSU"
            dir: "common_gki_suki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            artifact_name: "gki-sukisu-kernel"
            zip_prefix: "GKI_SukiSU"
            ksu_type: "suki"

          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            artifact_name: "gki-noksu-kernel"
            zip_prefix: "GKI_NoKSU"
            ksu_type: "none"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🛠️ Setup workspace"
        uses: ./.github/actions/setup-env

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "📥 AOSP repo + toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)
          rm -rf .repo common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz \
            "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz \
            -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz \
            prebuilts/clang/host/linux-x86/clang-3289846 \
            prebuilts/clang/host/linux-x86/clang-r450784e \
            prebuilts/clang/host/linux-x86/clang-stable

          sed -i \
            -e 's/^BRANCH=.*/BRANCH=${{ matrix.kernel.config_branch }}/' \
            -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "📂 Download kernel_patches"
        run: |
          git clone --depth=1 https://github.com/WildKernels/kernel_patches \
            "${{ github.workspace }}/kernel_patches-main"

      - name: "🛡️ Setup BBG"
        if: matrix.kernel.ksu_type != 'suki'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard
          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' \
            security/Kconfig
          grep -q "baseband-guard/Kconfig" security/Kconfig || \
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' \
            security/Kconfig

      - name: "🔑 Setup KSU + SUSFS"
        uses: ./.github/actions/setup-ksu
        with:
          ksu_type: ${{ matrix.kernel.ksu_type }}
          kernel_dir: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
          work_dir: ${{ env.WORK_DIR }}

      - name: "⚡ Apply optimization patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set +e
          source /tmp/apply_patch.sh
          BASE="https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/common"
          KP="${{ github.workspace }}/kernel_patches-main/common"
          apply_patch "$BASE/silence_irq_cpu_logspam.patch"          "silence_irq_cpu_logspam"
          apply_patch "$BASE/silence_system_logspam.patch"           "silence_system_logspam"
          apply_patch "$BASE/reduce_cache_pressure.patch"            "reduce_cache_pressure"
          apply_patch "$BASE/minimise_wakeup_time.patch"             "minimise_wakeup_time"
          apply_patch "$BASE/reduce_freeze_timeout.patch"            "reduce_freeze_timeout"
          apply_patch "$BASE/avoid_extra_s2idle_wake_attempts.patch" "avoid_extra_s2idle_wake_attempts"
          apply_patch "$BASE/adjust_cpu_scan_order.patch"            "adjust_cpu_scan_order"
          apply_patch "$KP/disable_cache_hot_buddy.patch"            "disable_cache_hot_buddy"
          apply_patch "$BASE/increase_ext4_default_commit_age.patch" "increase_ext4_default_commit_age"

      - name: "🐳 Droidspaces support"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set +e
          source /tmp/apply_patch.sh
          bash ${{ github.workspace }}/scripts/droidspaces.sh \
            "arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

      - name: "⚙️ Kernel configs"
        uses: ./.github/actions/setup-configs
        with:
          ksu_type: ${{ matrix.kernel.ksu_type }}
          defconfig: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          kernel_dir: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}

      - name: "🏷️ Kernel name + dirty"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:9}"
          sed -i "\$s|echo \"\\\$res\"|echo \"\\\$res-ab${SHORT_SHA}\"|" ./scripts/setlocalversion
          sed -i 's/-dirty//' ./scripts/setlocalversion
          KERNEL_TIMESTAMP=$(git log -1 --format=%ct)
          echo "KBUILD_BUILD_TIMESTAMP=$(date -u -d @${KERNEL_TIMESTAMP} +'%a %b %d %T UTC %Y')" >> $GITHUB_ENV
          echo "SOURCE_DATE_EPOCH=${KERNEL_TIMESTAMP}" >> $GITHUB_ENV
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add . && git commit -m "clean dirty flag" || true

      - name: "🔩 Fix ABI + build configs"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          ABI_SCRIPT="build/kernel/abi/compare_to_symbol_list"
          if [ -f "$ABI_SCRIPT" ]; then
            sed -i 's/^\s*exit 1$/    echo "ABI check bypassed"/' "$ABI_SCRIPT"
          elif [ -f "build/abi/compare_to_symbol_list" ]; then
            mv build/abi/compare_to_symbol_list build/abi/compare_to_symbol_list.disabled
            printf '#!/bin/bash\necho "ABI checking disabled"\nexit 0\n' > build/abi/compare_to_symbol_list
            chmod +x build/abi/compare_to_symbol_list
          fi

          KN="${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}"
          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' "$KN/build.config.gki.aarch64"
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' "$KN/build.config.gki.aarch64"
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' "$KN/build.config.gki.aarch64"

          GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
          if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
            sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' \
              "$KN/tools/bpf/resolve_btfids/Makefile" 2>/dev/null || true
            echo "[OK] glibc 2.38 compat (host: $GLIBC_VERSION)"
          fi

          SETUP_ENV="build/_setup_env.sh"
          if [ -f "$SETUP_ENV" ]; then
            sed -i \
              -e 's/export KBUILD_BUILD_USER=build-user/export KBUILD_BUILD_USER=superuseryu/g' \
              -e 's/${KBUILD_BUILD_USER:-build-user}/${KBUILD_BUILD_USER:-superuseryu}/g' \
              -e 's/export KBUILD_BUILD_HOST=build-host/export KBUILD_BUILD_HOST=github/g' \
              -e 's/${KBUILD_BUILD_HOST:-build-host}/${KBUILD_BUILD_HOST:-github}/g' \
              "$SETUP_ENV"
          fi

      - name: "🚀 Build kernel"
        id: build
        working-directory: ${{ env.WORK_DIR }}
        timeout-minutes: 45
        run: |
          set -e
          export LTO=thin KCFLAGS="-pipe -fno-strict-aliasing -Wno-error"
          export SKIP_ABI_CHECKS=1 SKIP_KMI_CHECK=1
          export KBUILD_BUILD_TIMESTAMP="${{ env.KBUILD_BUILD_TIMESTAMP }}"
          export SOURCE_DATE_EPOCH="${{ env.SOURCE_DATE_EPOCH }}"
          export KBUILD_BUILD_USER="superuseryu" KBUILD_BUILD_HOST="github"

          START=$(date +%s)
          if ! KCFLAGS="$KCFLAGS" LLVM_PARALLEL_LINK_JOBS=1 \
            BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
            build/build.sh -j$(nproc) 2>&1 | tee /tmp/build_${{ matrix.kernel.name }}.log; then
            grep -E "undefined symbol|error:|ld.lld" /tmp/build_${{ matrix.kernel.name }}.log | tail -30
            exit 1
          fi
          DURATION=$(( $(date +%s) - START ))
          echo "✅ done in $((DURATION/60))m $((DURATION%60))s"
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: "🔍 Verify kernel version"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          VERSION_FULL=$(strings Image | grep "Linux version 5" | head -1)
          echo "$VERSION_FULL"
          echo "$VERSION_FULL" | grep -q "dirty" && { echo "❌ dirty!"; exit 1; } || true
          VERSION_CLEAN=$(echo "$VERSION_FULL" | sed 's/Linux version //' | sed 's/ (.*//')
          echo "✅ $VERSION_CLEAN"
          echo "KERNEL_VERSION=$VERSION_CLEAN" >> $GITHUB_ENV
          echo "$VERSION_CLEAN" > kernel_version.txt

      - name: "💉 KPM patch"
        if: matrix.kernel.ksu_type == 'suki'
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch_linux
          chmod +x patch_linux && ./patch_linux
          rm -f Image && mv oImage Image

      - name: "📋 Build summary"
        if: always()
        run: |
          KSU_TYPE="${{ matrix.kernel.ksu_type }}"
          case "$KSU_TYPE" in
            wild) KSU_LABEL="Wild-KSU"; KSU_VER="${{ env.WILD_KSU_TAG }}"
                  SUSFS_VER="pinned d8358055"; BBG="✅"; KPM="❌" ;;
            suki) KSU_LABEL="SukiSU"; KSU_VER="${{ env.SUKI_TAG }}"
                  SUSFS_VER="pinned d835805"; BBG="❌"; KPM="✅ (CONFIG_KPM + binary)" ;;
            *)    KSU_LABEL="None"; KSU_VER="—"; SUSFS_VER="—"; BBG="❌"; KPM="❌" ;;
          esac
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Build Summary — ${{ matrix.kernel.name }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Kernel : ${{ env.KERNEL_VERSION }}"
          echo "  Branch : ${{ env.KERNEL_BRANCH }}"
          echo "  SHA    : ${{ github.sha }}"
          echo "────────────────────────────────────────"
          echo "  KSU    : ${KSU_LABEL} ${KSU_VER}"
          echo "  SUSFS  : ${SUSFS_VER} (gki-android13-5.15)"
          echo "  BBG    : ${BBG}"
          echo "  KPM    : ${KPM}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: "📦 Create ZIP"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -e
          DATE_TAG=$(date +'%Y%m%d')
          ZIP_NAME="AnyKernel3_${{ matrix.kernel.zip_prefix }}_${DATE_TAG}.zip"
          git clone --depth=1 https://github.com/superuseryu/AnyKernel3 ak3_tmp
          cp out/dist/Image ak3_tmp/Image
          cd ak3_tmp && zip -r9 "../$ZIP_NAME" * -x .git/* && cd ..
          ZIP_SIZE_MB=$(echo "scale=2; $(stat -c%s "$ZIP_NAME") / 1024 / 1024" | bc | sed 's/^\./0./')
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_SIZE_MB=$ZIP_SIZE_MB" >> $GITHUB_ENV
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "✅ $ZIP_NAME ($ZIP_SIZE_MB MB)"

      - name: "📤 Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.artifact_name }}
          path: |
            ${{ env.WORK_DIR }}/${{ env.ZIP_NAME }}
            ${{ env.WORK_DIR }}/out/dist/kernel_version.txt
            ${{ env.WORK_DIR }}/wild_ksu_tag.txt
            ${{ env.WORK_DIR }}/suki_ksu_tag.txt
          retention-days: 1

  package-kernels:
    name: "📦 Package & Release"
    runs-on: ubuntu-latest
    needs: [setup, build-kernels]
    if: success()
    steps:
      - name: "📥 Download artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "🔖 Resolve versions"
        run: |
          VERSION_FILE=$(find ./artifacts -name "kernel_version.txt" | head -1)
          echo "KERNEL_VERSION=$([ -f "$VERSION_FILE" ] && cat "$VERSION_FILE" || echo "5.15.x")" >> $GITHUB_ENV
          SUSFS_VERSION=$(curl -sf https://api.github.com/repos/sidex15/susfs4ksu-module/tags \
            | jq -r '.[0].name' || echo "v1.5.2+_R26")
          echo "SUSFS_VERSION=$SUSFS_VERSION" >> $GITHUB_ENV
          echo "SUSFS_MODULE_URL=https://github.com/sidex15/susfs4ksu-module/releases/latest" >> $GITHUB_ENV
          echo "WILD_TAG=$(find ./artifacts -name "wild_ksu_tag.txt" | head -1 | xargs cat 2>/dev/null || echo "unknown")" >> $GITHUB_ENV
          echo "SUKI_TAG=$(find ./artifacts -name "suki_ksu_tag.txt" | head -1 | xargs cat 2>/dev/null || echo "unknown")" >> $GITHUB_ENV
          DATE_TAG=$(date +'%Y%m%d')
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV
          if [ "${{ inputs.is_testing }}" = "true" ]; then
            echo "RELEASE_TAG=${SUSFS_VERSION}-testing" >> $GITHUB_ENV
            echo "RELEASE_NAME=Sapphire Kernel ${SUSFS_VERSION} — Testing" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${SUSFS_VERSION}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Sapphire Kernel ${SUSFS_VERSION}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: "🗂️ Collect ZIPs"
        run: |
          mkdir -p ./zips
          find ./artifacts -name "AnyKernel3_*.zip" -exec cp {} ./zips/ \;
          ls -lh ./zips/

      - name: "📋 Audit logs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./audit_logs
          gh api /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '.jobs[] | select(.name | test("Build ")) | [.id, .name] | @tsv' > /tmp/build_jobs.tsv
          while IFS=$'\t' read -r JOB_ID JOB_NAME; do
            SAFE=$(echo "$JOB_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g' | sed 's/__*/_/g')
            gh api /repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs \
              > "./audit_logs/${SAFE}.log" 2>/dev/null || echo "[WARN] $JOB_NAME" > "./audit_logs/${SAFE}.log"
          done < /tmp/build_jobs.tsv
          cat > ./audit_logs/00_run_info.txt << EOF
          Run    : #${{ github.run_number }}
          Repo   : ${{ github.repository }}
          SHA    : ${{ github.sha }}
          Date   : $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          URL    : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          LOG_ZIP="build-audit-logs-${{ env.DATE_TAG }}.zip"
          zip -r9 "$LOG_ZIP" audit_logs/
          LOG_SIZE_MB=$(echo "scale=2; $(stat -c%s "$LOG_ZIP") / 1024 / 1024" | bc | sed 's/^\./0./')
          echo "LOG_AUDIT_ZIP=$LOG_ZIP" >> $GITHUB_ENV
          echo "LOG_AUDIT_SIZE_MB=$LOG_SIZE_MB" >> $GITHUB_ENV

      - name: "🧹 Cleanup old release assets"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ env.RELEASE_TAG }}" --repo ${{ github.repository }} --json assets \
            | jq -r '.assets[].name' \
            | while read asset; do
                gh release delete-asset "${{ env.RELEASE_TAG }}" "$asset" \
                  --repo ${{ github.repository }} --yes 2>/dev/null || true
              done

      - name: "📝 Release body"
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:9}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          BODY=""
          [ "${{ inputs.is_testing }}" = "true" ] && BODY="> ⚠️ **Testing build** — use at your own risk."$'\n\n'
          BODY="${BODY}**Wild-KSU:** [${{ env.WILD_TAG }}](https://github.com/WildKernels/Wild_KSU/releases/tag/${{ env.WILD_TAG }})"$'\n'
          BODY="${BODY}**SukiSU-Ultra:** [${{ env.SUKI_TAG }}](https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases/tag/${{ env.SUKI_TAG }})"$'\n'
          BODY="${BODY}**SUSFS:** [${{ env.SUSFS_VERSION }}](${{ env.SUSFS_MODULE_URL }})"$'\n\n'
          BODY="${BODY}**Variants:** Wild-KSU · SukiSU · NoKSU"$'\n'
          BODY="${BODY}**Features:** SUSFS ඞ · BBG (Wild) · KPM (SukiSU) · Thin LTO · Droidspaces · TCP BBR+Westwood"$'\n\n'
          BODY="${BODY}**Commit:** [\`${SHORT_SHA}\`](${COMMIT_URL})"$'\n'
          BODY="${BODY}**Flash via OrangeFox / TWRP** · [t.me/home_yu_chat](https://t.me/home_yu_chat)"$'\n\n'
          BODY="${BODY}> 📋 \`build-audit-logs-*.zip\` — full build log for transparency."
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: "⬆️ Create release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ./zips/*.zip
            ${{ env.LOG_AUDIT_ZIP }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          body: ${{ env.RELEASE_BODY }}

      - name: "🎉 Telegram — success"
        if: success()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          ENCODED_TAG=$(echo "${{ env.RELEASE_TAG }}" | sed 's/+/%2B/g')
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${ENCODED_TAG}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA="${{ github.sha }}"; SHORT_SHA="${SHORT_SHA:0:9}"
          DURATION=$(( $(date +%s) - ${{ needs.setup.outputs.start_time }} ))
          [ "${{ inputs.is_testing }}" = "true" ] && ICON="🧪" || ICON="✅"
          [ "${{ inputs.is_testing }}" = "true" ] && TEXT="Testing Build" || TEXT="Build Success"
          MSG="<b>${ICON} ${TEXT}</b>%0A%0A"
          MSG="${MSG}<b>🔄</b> Run #${{ github.run_number }} · sapphire%0A"
          MSG="${MSG}<b>🏷️</b> <code>${{ env.RELEASE_TAG }}</code>%0A"
          MSG="${MSG}<b>📌</b> Wild <code>${{ env.WILD_TAG }}</code> · SukiSU <code>${{ env.SUKI_TAG }}</code>%0A"
          MSG="${MSG}<b>📦</b> Wild · SukiSU · NoKSU%0A"
          MSG="${MSG}<b>⏱️</b> $((DURATION/60))m $((DURATION%60))s%0A"
          MSG="${MSG}<b>🔨</b> <a href='https://github.com/${{ github.repository }}/commit/${{ github.sha }}'>${SHORT_SHA}</a>%0A"
          MSG="${MSG}<b>🔗</b> <a href='${RELEASE_URL}'>Release</a> · <a href='${RUN_URL}'>Logs</a>"
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" -d text="$MSG" -d parse_mode="HTML" \
            -d disable_web_page_preview=true
          for ZIP in ./zips/*.zip; do
            [ -f "$ZIP" ] || continue
            SIZE_MB=$(echo "scale=2; $(stat -c%s "$ZIP") / 1024 / 1024" | bc | sed 's/^\./0./')
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
              -F chat_id="$CHAT_ID" -F document=@"$ZIP" \
              -F caption="📦 $(basename $ZIP) — ${SIZE_MB} MB" || true
          done
          LOG_ZIP="${{ env.LOG_AUDIT_ZIP }}"
          LOG_SIZE_MB="${{ env.LOG_AUDIT_SIZE_MB }}"
          if [ -f "$LOG_ZIP" ]; then
            if (( $(echo "$LOG_SIZE_MB < 45" | bc -l) )); then
              curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
                -F chat_id="$CHAT_ID" -F document=@"$LOG_ZIP" \
                -F caption="📋 Build audit log — ${LOG_SIZE_MB} MB" || true
            else
              curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
                -d chat_id="$CHAT_ID" \
                -d text="📋 Log too large (${LOG_SIZE_MB} MB) — grab it from <a href='${RELEASE_URL}'>release</a>." \
                -d parse_mode="HTML" -d disable_web_page_preview=true || true
            fi
          fi

  notify-failure:
    name: "❌ Notify Failure"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: always() && needs.build-kernels.result != 'success'
    steps:
      - name: "📣 Telegram — failed"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STATUS="${{ needs.build-kernels.result }}"
          [ "$STATUS" = "cancelled" ] && ICON="⚠️" && TEXT="Cancelled" || ICON="❌" && TEXT="Build Failed"
          MSG="<b>${ICON} ${TEXT}</b>%0A%0A"
          MSG="${MSG}<b>🔄</b> Run #${{ github.run_number }} · sapphire%0A"
          MSG="${MSG}<b>🕐</b> $(date -u +'%Y-%m-%d %H:%M UTC')%0A"
          MSG="${MSG}<b>🔗</b> <a href='${RUN_URL}'>Logs</a>"
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" -d text="$MSG" -d parse_mode="HTML" || true
