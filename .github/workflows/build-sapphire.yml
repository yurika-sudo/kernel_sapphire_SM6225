name: "Build Kernel - Sapphire/n"

env:
  OUT_DIR: "out"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      is_testing:
        description: "Testing Build?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  setup:
    name: "⏱️ Setup"
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.ts.outputs.start_time }}
    steps:
      - name: "Record start time"
        id: ts
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

  build-kernels:
    name: "🔨 Build ${{ matrix.kernel.name }}"
    runs-on: ubuntu-latest
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        kernel:
          # GKI + Wild-KSU
          - name: "GKI-Wild"
            dir: "common_gki_wild"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            artifact_name: "gki-wild-kernel"
            zip_prefix: "GKI_Wild"
            ksu_type: "wild"


          # GKI + SukiSU-Ultra
          - name: "GKI-Suki"
            dir: "common_gki_suki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            artifact_name: "gki-suki-kernel"
            zip_prefix: "GKI_Suki"
            ksu_type: "suki"

          # GKI vanilla
          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            artifact_name: "gki-noksu-kernel"
            zip_prefix: "GKI_NoKSU"
            ksu_type: "none"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      WORK_DIR: ${{ github.workspace }}

    steps:

      - name: "📦 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🛠️ Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 bc bison build-essential flex git libelf-dev libssl-dev curl jq

          # Shared patch helper — sourced by every patch step
          cat > /tmp/apply_patch.sh << 'APHELPER'
          apply_patch() {
            local SRC="$1"
            local NAME="$2"
            local STRICT="${3:-0}"
            local TMP="/tmp/p_${NAME//[^a-zA-Z0-9]/_}"

            if [[ "$SRC" == http* ]]; then
              if ! curl -LSs --fail "$SRC" -o "$TMP" 2>/dev/null; then
                echo "[SKIP] $NAME — download failed"
                return 0
              fi
            else
              if [ ! -f "$SRC" ]; then
                echo "[SKIP] $NAME — file not found: $SRC"
                return 0
              fi
              cp "$SRC" "$TMP"
            fi

            # Sanity check 1: verify target files exist in source tree
            local missing=""
            while IFS= read -r line; do
              [[ "$line" =~ ^---\ a/(.+)$ ]] || continue
              local t="${BASH_REMATCH[1]}"
              [[ "$t" == "/dev/null" ]] && continue
              [ -f "$t" ] || missing="$missing $t"
            done < "$TMP"

            if [ -n "$missing" ]; then
              echo "[SKIP] $NAME — missing targets:$missing"
              rm -f "$TMP"
              return 0
            fi

            # Sanity check 2: dry-run
            if ! patch -p1 --dry-run --forward --quiet < "$TMP" 2>/dev/null; then
              echo "[SKIP] $NAME — dry-run failed (already applied or conflict)"
              rm -f "$TMP"
              return 0
            fi

            if patch -p1 --forward < "$TMP"; then
              echo "[OK]  $NAME"
            else
              if [ "$STRICT" = "1" ]; then
                echo "[FAIL] $NAME — strict mode"
                rm -f "$TMP"
                return 1
              fi
              echo "[WARN] $NAME — apply failed, skipped"
            fi

            rm -f "$TMP"
          }
          APHELPER

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "📥 Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)

          rm -rf .repo
          rm -rf common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz \
            "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz \
            -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable

          sed -i \
            -e 's/^BRANCH=.*/BRANCH=${{ matrix.kernel.config_branch }}/' \
            -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants

          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "📂 Download kernel_patches"
        run: |
          git clone --depth=1 https://github.com/WildKernels/kernel_patches \
            "${{ github.workspace }}/kernel_patches-main"

      - name: "🛡️ Setup Baseband-guard (BBG)"
        if: matrix.kernel.ksu_type != 'suki'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard

          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile

          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' \
            security/Kconfig

          grep -q "baseband-guard/Kconfig" security/Kconfig || \
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' \
            security/Kconfig

      # KSU SETUP — Wild
      - name: "😋 Setup Wild-KSU with SUSFS"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e

          rm -rf ./KernelSU ./drivers/kernelsu ./Wild_KSU

          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s canary

          if [ ! -d "Wild_KSU" ]; then
            echo "ERROR: Wild_KSU directory not found!"
            exit 1
          fi

          cd Wild_KSU
          git fetch --tags 2>/dev/null || true
          KSU_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "unknown")
          echo "WILD_KSU_TAG=$KSU_TAG" >> $GITHUB_ENV
          echo "$KSU_TAG" > ${{ env.WORK_DIR }}/ksu_tag.txt
          echo "-- Wild KSU tag: $KSU_TAG"
          cd ..

          # Pin to d8358055 (Apr 12) — pre-static_key, compatible with Wild KSU dev
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          cd susfs4ksu && git checkout d8358055 && cd ..

          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if [ -f "$SUSFS_PATCH" ]; then
            patch -p1 --forward < "$SUSFS_PATCH" || echo "[WARN] susfs base patch had issues, continuing..."
          fi

          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/* fs/
          cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/

          # NOTE: intentionally NOT copying susfs4ksu/kernel_patches/KernelSU/kernel/* here.
          # Wild_KSU/dev has its own modified sucompat.c/hooks — overwriting with SUSFS's
          # upstream KernelSU version causes type errors (bool, u64, KSU_FEATURE_SU_COMPAT).

          KSU_C_FILE="Wild_KSU/kernel/ksu.c"
          if ! grep -q "susfs_init" "$KSU_C_FILE" 2>/dev/null; then
            grep -q "#include <linux/susfs.h>" "$KSU_C_FILE" || \
              sed -i '/#include <linux\/fs\.h>/a #include <linux/susfs.h>' "$KSU_C_FILE"
            grep -q "susfs_init()" "$KSU_C_FILE" || \
              sed -i '/ksu_core_init();/a \\tsusfs_init();' "$KSU_C_FILE" || \
              sed -i '/int __init ksu_init(/,/^}/{ /return 0;/i \\tsusfs_init(); }' "$KSU_C_FILE"
          fi

          [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ] && \
            ln -sf ../Wild_KSU drivers/kernelsu

          rm -rf susfs4ksu


      - name: "🔧 Enforce KSU driver Makefile entry (Wild)"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          grep -q "obj-.*kernelsu" drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu/Kconfig" drivers/Kconfig || \
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo "[verify] drivers/Makefile KSU entry:"
          grep kernelsu drivers/Makefile || echo "STILL MISSING - bail out"

      - name: "🩺 KSU debug pre-flight (Wild)"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "=== drivers/kernelsu symlink ==="
          ls -la drivers/kernelsu || echo "❌ MISSING"
          echo "=== drivers/Makefile KSU entry ==="
          grep -n kernelsu drivers/Makefile || echo "❌ NOT IN MAKEFILE"
          echo "=== KSU .c files ==="
          find drivers/kernelsu -name "*.c" 2>/dev/null | sort || echo "❌ NO .c FILES FOUND"
          echo "=== Static key DEFINE locations ==="
          grep -r "DEFINE_STATIC_KEY" drivers/kernelsu/ 2>/dev/null || echo "⚠️  NO DEFINE_STATIC_KEY IN KSU DRIVER"
          echo "=== Static key references in kernel (non-KSU) ==="
          grep -r "ksu_is_init_rc_hook_enabled\|ksu_is_input_hook_enabled\|ksu_vfs_read_hook_key\|ksu_input_hook_key" \
            --include="*.c" . --exclude-dir=drivers/kernelsu 2>/dev/null | head -20 || echo "(none)"
          echo "=== CONFIG_KSU in defconfig ==="
          grep "CONFIG_KSU" arch/arm64/configs/${{ env.DEFCONFIG_NAME }} || echo "❌ CONFIG_KSU NOT SET"

      - name: "🌸 Setup SukiSU-Ultra with SUSFS + KPM"
        if: matrix.kernel.ksu_type == 'suki'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e

          rm -rf ./KernelSU ./drivers/kernelsu

          # builtin branch — GKI support with optional SUSFS, creates KernelSU/ dir
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s builtin

          if [ ! -d "KernelSU" ]; then
            echo "ERROR: KernelSU directory not found!"
            exit 1
          fi

          cd KernelSU
          git fetch --tags 2>/dev/null || true
          SUKI_TAG=$(git describe --tags --abbrev=0 2>/dev/null || \
            curl -sf "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest" \
            | jq -r '.tag_name' 2>/dev/null || echo "unknown")
          echo "SUKI_TAG=$SUKI_TAG" >> $GITHUB_ENV
          echo "$SUKI_TAG" > ${{ env.WORK_DIR }}/ksu_tag.txt
          echo "-- SukiSU tag: $SUKI_TAG"
          cd ..

          # Apply kernel-side SUSFS base patch (fs/ and include/linux/)
          # Pin to cc7763b9 (Apr 18) — introduced static_key, same sync point as SukiSU builtin Apr 19
          # pre-variable-rename (befaffc7 Apr 24), so variable names match SukiSU
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          cd susfs4ksu && git checkout cc7763b9 && cd ..

          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if [ -f "$SUSFS_PATCH" ]; then
            patch -p1 --forward < "$SUSFS_PATCH" || echo "[WARN] susfs base patch had issues, continuing..."
          fi

          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/* fs/
          cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/

          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* KernelSU/kernel/ || true
          fi

          # Inject susfs_init if ksu.c exists and susfs_init not already there
          KSU_C_FILE="KernelSU/kernel/ksu.c"
          if [ -f "$KSU_C_FILE" ] && ! grep -q "susfs_init" "$KSU_C_FILE" 2>/dev/null; then
            grep -q "#include <linux/susfs.h>" "$KSU_C_FILE" ||               sed -i '/#include <linux\/fs\.h>/a #include <linux\/susfs.h>/' "$KSU_C_FILE" || true
            grep -q "susfs_init()" "$KSU_C_FILE" ||               sed -i '/ksu_core_init();/a \tsusfs_init();' "$KSU_C_FILE" ||               sed -i '/int __init ksu_init(/,/^}/{ /return 0;/i \tsusfs_init(); }' "$KSU_C_FILE" || true
            echo "[OK]  susfs_init injected into ksu.c"
          else
            echo "[SKIP] ksu.c not found or susfs already integrated — skipping injection"
          fi

          [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ] && \
            ln -sf ../KernelSU drivers/kernelsu

          rm -rf susfs4ksu

      - name: "🔧 Enforce KSU driver Makefile entry (Suki)"
        if: matrix.kernel.ksu_type == 'suki'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          grep -q "obj-.*kernelsu" drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu/Kconfig" drivers/Kconfig || \
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo "[verify] drivers/Makefile KSU entry:"
          grep kernelsu drivers/Makefile || echo "STILL MISSING - bail out"

      - name: "🩺 KSU debug pre-flight (Suki)"
        if: matrix.kernel.ksu_type == 'suki'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "=== drivers/kernelsu symlink ==="
          ls -la drivers/kernelsu || echo "❌ MISSING"
          echo "=== drivers/Makefile KSU entry ==="
          grep -n kernelsu drivers/Makefile || echo "❌ NOT IN MAKEFILE"
          echo "=== KSU .c files ==="
          find drivers/kernelsu -name "*.c" 2>/dev/null | sort || echo "❌ NO .c FILES FOUND"
          echo "=== Static key DEFINE locations ==="
          grep -r "DEFINE_STATIC_KEY" drivers/kernelsu/ 2>/dev/null || echo "⚠️  NO DEFINE_STATIC_KEY IN KSU DRIVER"
          echo "=== Static key references in kernel (non-KSU) ==="
          grep -r "ksu_is_init_rc_hook_enabled\|ksu_is_input_hook_enabled\|ksu_vfs_read_hook_key\|ksu_input_hook_key" \
            --include="*.c" . --exclude-dir=drivers/kernelsu 2>/dev/null | head -20 || echo "(none)"
          echo "=== CONFIG_KSU in defconfig ==="
          grep "CONFIG_KSU" arch/arm64/configs/${{ env.DEFCONFIG_NAME }} || echo "❌ CONFIG_KSU NOT SET"

      # PATCHES
      - name: "⚡ Apply common optimization patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set +e
          source /tmp/apply_patch.sh

          BASE_URL="https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/common"
          KP="${{ github.workspace }}/kernel_patches-main/common"

          # Logging - safe, no functional change
          apply_patch "${BASE_URL}/silence_irq_cpu_logspam.patch"        "silence_irq_cpu_logspam"
          apply_patch "${BASE_URL}/silence_system_logspam.patch"         "silence_system_logspam"

          # Memory pressure - stable mm/ tweak
          apply_patch "${BASE_URL}/reduce_cache_pressure.patch"          "reduce_cache_pressure"

          # Power / wakeup - battery focused
          apply_patch "${BASE_URL}/minimise_wakeup_time.patch"           "minimise_wakeup_time"
          apply_patch "${BASE_URL}/reduce_freeze_timeout.patch"          "reduce_freeze_timeout"
          apply_patch "${BASE_URL}/avoid_extra_s2idle_wake_attempts.patch" "avoid_extra_s2idle_wake_attempts"

          # Scheduler
          apply_patch "${BASE_URL}/adjust_cpu_scan_order.patch"          "adjust_cpu_scan_order"
          apply_patch "$KP/disable_cache_hot_buddy.patch"                "disable_cache_hot_buddy"

          # Storage
          apply_patch "${BASE_URL}/increase_ext4_default_commit_age.patch" "increase_ext4_default_commit_age"

          echo "--- common patches done ---"

      - name: "⚙️ Add base kernel configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          sed -i 's/ cgroup_disable=pressure//' "$CONFIG_FILE"
          sed -i 's/CONFIG_CMDLINE="/&slub_debug=- page_owner=off /' "$CONFIG_FILE"
          sed 's/^[[:space:]]*//' >> "$CONFIG_FILE" << 'EOF'
          CONFIG_OVERLAY_FS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_OVERLAY_FS_REDIRECT_ALWAYS_FOLLOW=y
          CONFIG_OVERLAY_FS_INDEX=y
          CONFIG_OVERLAY_FS_XINO_AUTO=y
          CONFIG_OVERLAY_FS_METACOPY=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_ZRAM_WRITEBACK=y
          # CONFIG_ZRAM_MEMORY_TRACKING is not set
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_TCP_CONG_VEGAS=y
          CONFIG_TCP_CONG_YEAH=y
          CONFIG_TCP_CONG_VENO=y
          # CONFIG_SLUB_DEBUG_ON is not set
          # CONFIG_SLUB_STATS is not set
          # CONFIG_DEBUG_LIST is not set
          # CONFIG_DEBUG_MEMORY_INIT is not set
          # CONFIG_RCU_TRACE is not set
          # CONFIG_PRINTK_CALLER is not set
          # CONFIG_DEBUG_FS is not set
          # CONFIG_F2FS_IOSTAT is not set
          # CONFIG_NTSYNC is not set
          CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y
          EOF

      - name: "⚙️ Add Wild-KSU + SUSFS configs"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          sed 's/^[[:space:]]*//' >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_BBG=y
          EOF

      - name: "⚙️ Add SukiSU-Ultra + SUSFS + KPM configs"
        if: matrix.kernel.ksu_type == 'suki'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          sed 's/^[[:space:]]*//' >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KPM=y
          EOF

      - name: "🏷️ Configure kernel name and remove dirty"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          REPO_SHA="${{ github.sha }}"
          SHORT_SHA="${REPO_SHA:0:9}"
          sed -i "\$s|echo \"\\\$res\"|echo \"\\\$res-ab${SHORT_SHA}\"|" ./scripts/setlocalversion
          sed -i 's/-dirty//' ./scripts/setlocalversion

          # Use kernel source last commit timestamp instead of CI run time.
          # This prevents DuckDetector buildTime flags from a "too fresh" build.
          KERNEL_TIMESTAMP=$(git log -1 --format=%ct)
          echo "KBUILD_BUILD_TIMESTAMP=$(date -u -d @${KERNEL_TIMESTAMP} +'%a %b %d %T UTC %Y')" >> $GITHUB_ENV
          echo "SOURCE_DATE_EPOCH=${KERNEL_TIMESTAMP}" >> $GITHUB_ENV

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add . && git commit -m "clean dirty flag" || true

      - name: "🔩 Fix ABI and build configs"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          ABI_SCRIPT="build/kernel/abi/compare_to_symbol_list"
          if [ -f "$ABI_SCRIPT" ]; then
            sed -i 's/^\s*exit 1$/    echo "ABI check bypassed"/' "$ABI_SCRIPT"
          elif [ -f "build/abi/compare_to_symbol_list" ]; then
            mv build/abi/compare_to_symbol_list build/abi/compare_to_symbol_list.disabled
            printf '#!/bin/bash\necho "ABI checking disabled"\nexit 0\n' \
              > build/abi/compare_to_symbol_list
            chmod +x build/abi/compare_to_symbol_list
          fi

          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64

          GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
          if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
            cd ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
            sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' \
              tools/bpf/resolve_btfids/Makefile 2>/dev/null || true
            cd ${{ env.WORK_DIR }}
            echo "[OK]  glibc 2.38 compat fix (host: $GLIBC_VERSION)"
          fi

          # Patch AOSP build/_setup_env.sh — this is what actually overrides
          # KBUILD_BUILD_USER/HOST at build time, not scripts/mkcompile_h.
          # Covers both syntax variants across AOSP versions.
          SETUP_ENV="build/_setup_env.sh"
          if [ -f "$SETUP_ENV" ]; then
            sed -i 's/export KBUILD_BUILD_USER=build-user/export KBUILD_BUILD_USER=superuseryu/g' "$SETUP_ENV" || true
            sed -i 's/${KBUILD_BUILD_USER:-build-user}/${KBUILD_BUILD_USER:-superuseryu}/g' "$SETUP_ENV" || true
            sed -i 's/export KBUILD_BUILD_HOST=build-host/export KBUILD_BUILD_HOST=github/g' "$SETUP_ENV" || true
            sed -i 's/${KBUILD_BUILD_HOST:-build-host}/${KBUILD_BUILD_HOST:-github}/g' "$SETUP_ENV" || true
            echo "[OK]  Patched build/_setup_env.sh — KBUILD_BUILD_USER=superuseryu HOST=github"
          else
            echo "[WARN] build/_setup_env.sh not found — skipping"
          fi

      - name: "🚀 Build kernel"
        id: build
        working-directory: ${{ env.WORK_DIR }}
        timeout-minutes: 45
        run: |
          set -e
          echo "🚀 Starting kernel build with $(nproc) cores..."

          export LTO=thin
          export KCFLAGS="-pipe -fno-strict-aliasing -Wno-error"
          export SKIP_ABI_CHECKS=1
          export SKIP_KMI_CHECK=1
          export KBUILD_BUILD_TIMESTAMP="${{ env.KBUILD_BUILD_TIMESTAMP }}"
          export SOURCE_DATE_EPOCH="${{ env.SOURCE_DATE_EPOCH }}"
          export KBUILD_BUILD_USER="superuseryu"
          export KBUILD_BUILD_HOST="github"

          START_BUILD=$(date +%s)

          if ! KCFLAGS="$KCFLAGS" LLVM_PARALLEL_LINK_JOBS=1 \
            BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
            build/build.sh -j$(nproc) 2>&1 | tee /tmp/build_${{ matrix.kernel.name }}.log; then
            echo "=== LINKER ERRORS ==="
            grep -E "undefined symbol|error:|ld.lld" /tmp/build_${{ matrix.kernel.name }}.log | tail -30
            exit 1
          fi

          END_BUILD=$(date +%s)
          DURATION=$((END_BUILD - START_BUILD))
          echo "✅ Build completed in $((DURATION / 60))m $((DURATION % 60))s"
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: "📤 Upload build log (on failure)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.kernel.name }}
          path: /tmp/build_${{ matrix.kernel.name }}.log
          retention-days: 7

      - name: "🔍 Verify kernel version"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          VERSION_FULL=$(strings Image | grep "Linux version 5" | head -1)
          echo "$VERSION_FULL"
          echo "$VERSION_FULL" | grep -q "dirty" && { echo "❌ dirty!"; exit 1; } || true
          VERSION_CLEAN=$(echo "$VERSION_FULL" | sed 's/Linux version //' | sed 's/ (.*//')
          echo "✅ $VERSION_CLEAN"
          echo "KERNEL_VERSION=$VERSION_CLEAN" >> $GITHUB_ENV
          echo "$VERSION_CLEAN" > kernel_version.txt

      - name: "💉 Patch Image for KPM"
        if: matrix.kernel.ksu_type == 'suki'
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          # CONFIG_KPM=y alone is not enough - Image needs a binary patch
          # to embed the KPM loader so the manager can detect it.
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" \
            -o patch_linux
          chmod +x patch_linux
          ./patch_linux
          rm -f Image
          mv oImage Image
          echo "[OK] KPM patch applied"

      - name: "🔎 Scan patch rejects"
        if: always()
        working-directory: ${{ env.WORK_DIR }}
        run: |
          REJECTS_DIR="${{ env.WORK_DIR }}/patch-rejects"
          mkdir -p "$REJECTS_DIR"
          mapfile -t REJS < <(find "${{ env.KERNEL_LOC_DIR }}" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej file(s)"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV
          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#${{ env.WORK_DIR }}/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"
              echo "⚠️ $REL"
            done
          fi

      - name: "📋 Build summary"
        if: always()
        run: |
          echo "Kernel  : ${{ env.KERNEL_VERSION }}"
          echo "Variant : ${{ matrix.kernel.name }}"
          echo "Repo    : ${{ env.KERNEL_REPO }}"
          echo "Branch  : ${{ env.KERNEL_BRANCH }}"
          echo "KSU     : ${{ matrix.kernel.ksu_type }}"
          echo "SHA     : ${{ github.sha }}"
          echo "Rejects : ${REJ_COUNT:-0}"

      - name: "📦 Create variant ZIP"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -e
          DATE_TAG=$(date +'%Y%m%d')
          ZIP_NAME="AnyKernel3_${{ matrix.kernel.zip_prefix }}_${DATE_TAG}.zip"

          git clone --depth=1 https://github.com/superuseryu/AnyKernel3 ak3_tmp

          cp out/dist/Image ak3_tmp/Image

          cd ak3_tmp
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..

          ZIP_SIZE_MB=$(echo "scale=2; $(stat -c%s "$ZIP_NAME") / 1024 / 1024" | bc)
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_SIZE_MB=$ZIP_SIZE_MB" >> $GITHUB_ENV
          echo "ZIP_SHA256=$ZIP_SHA256" >> $GITHUB_ENV
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV

          echo "✅ $ZIP_NAME ($ZIP_SIZE_MB MB)"

      - name: "📤 Upload variant artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.artifact_name }}
          path: |
            ${{ env.WORK_DIR }}/${{ env.ZIP_NAME }}
            ${{ env.WORK_DIR }}/out/dist/kernel_version.txt
            ${{ env.WORK_DIR }}/ksu_tag.txt
          retention-days: 1

  package-kernels:
    name: "📦 Package & Release"
    runs-on: ubuntu-latest
    needs: [setup, build-kernels]
    if: success()

    steps:
      - name: "📥 Download all kernel artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "🔖 Get versions"
        run: |
          VERSION_FILE=$(find ./artifacts -name "kernel_version.txt" | head -1)
          KERNEL_VERSION=$([ -f "$VERSION_FILE" ] && cat "$VERSION_FILE" || echo "5.15.x")
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV

          SUSFS_VERSION=$(curl -sf https://api.github.com/repos/sidex15/susfs4ksu-module/tags \
            | jq -r '.[0].name' || echo "v1.5.2+_R26")
          echo "SUSFS_VERSION=$SUSFS_VERSION" >> $GITHUB_ENV
          echo "SUSFS_MODULE_URL=https://github.com/sidex15/susfs4ksu-module/releases/latest" >> $GITHUB_ENV

          KSU_VERSION=$(find ./artifacts -name "ksu_tag.txt" | head -1 | xargs cat 2>/dev/null || echo "unknown")
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          DATE_TAG=$(date +'%Y%m%d')
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV
          if [ "${{ inputs.is_testing }}" = "true" ]; then
            echo "RELEASE_TAG=${SUSFS_VERSION}-testing" >> $GITHUB_ENV
            echo "RELEASE_NAME=Sapphire Kernel ${SUSFS_VERSION} — Testing" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${SUSFS_VERSION}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Sapphire Kernel ${SUSFS_VERSION}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

          echo "Kernel: $KERNEL_VERSION | SUSFS: $SUSFS_VERSION | KSU: $KSU_VERSION"

      - name: "🗂️ Collect ZIP files"
        run: |
          mkdir -p ./zips
          find ./artifacts -name "AnyKernel3_*.zip" -exec cp {} ./zips/ \;
          echo "📋 ZIPs:"
          ls -lh ./zips/

      - name: "🧹 Cleanup old release assets"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          gh release view "$TAG" --repo ${{ github.repository }} --json assets \
            | jq -r '.assets[].name' \
            | while read asset; do
                gh release delete-asset "$TAG" "$asset" --repo ${{ github.repository }} --yes 2>/dev/null || true
              done
          echo "✅ Old assets cleaned"

      - name: "📝 Generate release body"
        run: |
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:9}"

          BODY=""
          if [ "${{ inputs.is_testing }}" = "true" ]; then
            BODY="> ⚠️ **Testing build** — use at your own risk."$'\n\n'
          fi
          BODY="${BODY}**KSU Version:** \`${{ env.KSU_VERSION }}\`"$'\n'
          BODY="${BODY}**SUSFS:** [${{ env.SUSFS_VERSION }}](${{ env.SUSFS_MODULE_URL }})"$'\n\n'
          BODY="${BODY}**Variants:** Wild-KSU · SukiSU-Ultra · NoKSU"$'\n'
          BODY="${BODY}**Features:** SUSFS ඞ · BBG (Wild) · KPM (Suki) · Thin LTO · TCP (BBR, Westwood default)"$'\n\n'
          BODY="${BODY}**Commit:** [\`${SHORT_SHA}\`](${COMMIT_URL})"$'\n'
          BODY="${BODY}**Flash via OrangeFox / TWRP** · [t.me/home_yu_chat](https://t.me/home_yu_chat)"
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: "⬆️ Create GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./zips/*.zip
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          body: ${{ env.RELEASE_BODY }}

      - name: "🎉 Send Telegram — Build success"
        if: success()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          ENCODED_TAG=$(echo "${{ env.RELEASE_TAG }}" | sed 's/+/%2B/g')
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${ENCODED_TAG}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:9}"

          BUILD_END=$(date +%s)
          DURATION=$(( BUILD_END - ${{ needs.setup.outputs.start_time }} ))

          if [ "${{ inputs.is_testing }}" = "true" ]; then
            STATUS_ICON="🧪"
            STATUS_TEXT="Testing Build"
          else
            STATUS_ICON="✅"
            STATUS_TEXT="Build Success"
          fi

          MESSAGE="<b>${STATUS_ICON} ${STATUS_TEXT}</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>🔄</b> Run #${{ github.run_number }} · sapphire%0A"
          MESSAGE="${MESSAGE}<b>🏷️</b> <code>${{ env.RELEASE_TAG }}</code>%0A"
          MESSAGE="${MESSAGE}<b>📦</b> Wild · SukiSU · NoKSU%0A"
          MESSAGE="${MESSAGE}<b>⏱️</b> $((DURATION / 60))m $((DURATION % 60))s%0A"
          MESSAGE="${MESSAGE}<b>🔨</b> <a href='${COMMIT_URL}'>${SHORT_SHA}</a>%0A"
          MESSAGE="${MESSAGE}<b>🔗</b> <a href='${RELEASE_URL}'>Release</a> · <a href='${RUN_URL}'>Logs</a>"

          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true

          for ZIP in ./zips/*.zip; do
            [ -f "$ZIP" ] || continue
            SIZE_MB=$(echo "scale=2; $(stat -c%s "$ZIP") / 1024 / 1024" | bc)
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@"$ZIP" \
              -F caption="📦 $(basename $ZIP) — ${SIZE_MB} MB" || true
          done

  notify-failure:
    name: "❌ Notify Failure"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: always() && needs.build-kernels.result != 'success'
    steps:
      - name: "📣 Send Telegram — Build failed"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          JOB_STATUS="${{ needs.build-kernels.result }}"

          [ "$JOB_STATUS" = "cancelled" ] && ICON="⚠️" && TEXT="Workflow Cancelled" || \
          [ "$JOB_STATUS" = "failure" ] && ICON="❌" && TEXT="Build Failed" || \
          ICON="❓" && TEXT="Unknown ($JOB_STATUS)"

          MESSAGE="<b>${ICON} ${TEXT}!</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>🔄</b> Run #${{ github.run_number }} · sapphire%0A"
          MESSAGE="${MESSAGE}<b>🕐</b> $(date -u +'%Y-%m-%d %H:%M UTC')%0A"
          MESSAGE="${MESSAGE}<b>🔗</b> <a href='${RUN_URL}'>Logs</a>"

          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" || true
