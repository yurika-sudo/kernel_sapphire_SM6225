name: "Build Kernel - Sapphire/n"

env:
  OUT_DIR: "out"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      is_testing:
        description: "Testing Build?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  setup:
    name: "⏱️ Setup"
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.ts.outputs.start_time }}
    steps:
      - name: "Record start time"
        id: ts
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

  build-kernels:
    name: "🔨 Build ${{ matrix.kernel.name }}"
    runs-on: ubuntu-latest
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        kernel:
          # GKI + Wild-KSU
          - name: "GKI-KSU"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            output_name: "Image.gki.ksu"
            artifact_name: "gki-ksu-kernel"
            zip_prefix: "GKI_KSU"
            ksu_type: "wild"

          # GKI vanilla
          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            output_name: "Image.gki.noksu"
            artifact_name: "gki-noksu-kernel"
            zip_prefix: "GKI_NoKSU"
            ksu_type: "none"


    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      WORK_DIR: ${{ github.workspace }}

    steps:

      - name: "📦 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🛠️ Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 bc bison build-essential flex git libelf-dev libssl-dev curl jq

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "📥 Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)

          rm -rf .repo
          rm -rf common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz \
            "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz \
            -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable

          sed -i \
            -e 's/^BRANCH=.*/BRANCH=${{ matrix.kernel.config_branch }}/' \
            -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants

          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "🛡️ Setup Baseband-guard (BBG)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard

          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile

          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' \
            security/Kconfig

          grep -q "baseband-guard/Kconfig" security/Kconfig || \
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' \
            security/Kconfig

      - name: "😋 Setup Wild-KSU with SUSFS"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e

          rm -rf ./KernelSU ./drivers/kernelsu ./Wild_KSU

          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s canary

          if [ ! -d "Wild_KSU" ]; then
            echo "ERROR: Wild_KSU directory not found!"
            exit 1
          fi

          cd Wild_KSU
          KSU_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "unknown")
          echo "WILD_KSU_TAG=$KSU_TAG" >> $GITHUB_ENV
          echo "$KSU_TAG" > ${{ env.WORK_DIR }}/wild_ksu_tag.txt
          echo "-- Wild KSU tag: $KSU_TAG"
          cd ..

          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if [ -f "$SUSFS_PATCH" ]; then
            patch -p1 --forward < "$SUSFS_PATCH" || echo "⚠️ patch had issues, continuing..."
          fi

          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/* fs/
          cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/

          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* Wild_KSU/kernel/ || true
          fi

          KSU_C_FILE="Wild_KSU/kernel/ksu.c"
          if ! grep -q "susfs_init" "$KSU_C_FILE" 2>/dev/null; then
            grep -q "#include <linux/susfs.h>" "$KSU_C_FILE" || \
              sed -i '/#include <linux\/fs\.h>/a #include <linux/susfs.h>' "$KSU_C_FILE"
            grep -q "susfs_init()" "$KSU_C_FILE" || \
              sed -i '/ksu_core_init();/a \\tsusfs_init();' "$KSU_C_FILE" || \
              sed -i '/int __init ksu_init(/,/^}/{ /return 0;/i \\tsusfs_init(); }' "$KSU_C_FILE"
          fi

          [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ] && \
            ln -sf ../Wild_KSU drivers/kernelsu

          rm -rf susfs4ksu

      - name: "⚡ Apply common optimization patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          BASE_URL="https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/common"

          for patch_name in \
            "unicode_bypass_fix_6.1-.patch" \
            "silence_irq_cpu_logspam.patch" \
            "silence_system_logspam.patch" \
            "reduce_cache_pressure.patch" \
            "mem_opt_prefetch.patch" \
            "minimise_wakeup_time.patch" \
            "reduce_freeze_timeout.patch" \
            "int_sqrt.patch" \
            "increase_sk_mem_packets.patch" \
            "file_struct_8bytes_align.patch" \
            "clear_page_16bytes_align.patch" \
            "avoid_extra_s2idle_wake_attempts.patch" \
            "adjust_cpu_scan_order.patch" \
            "increase_ext4_default_commit_age.patch"; do
            echo "--- Applying $patch_name ---"
            curl -LSs "${BASE_URL}/${patch_name}" -o "/tmp/${patch_name}"
            if patch -p1 --forward < "/tmp/${patch_name}"; then
              echo "✅ $patch_name applied"
            else
              echo "⚠️ $patch_name had issues (may already be applied), continuing..."
            fi
          done

      - name: "⚙️ Add base kernel configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          sed -i 's/ cgroup_disable=pressure//' "$CONFIG_FILE"
          sed -i 's/CONFIG_CMDLINE="/&slub_debug=- page_owner=off /' "$CONFIG_FILE"
          sed 's/^[[:space:]]*//' >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KALLSYMS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_OVERLAY_FS_REDIRECT_ALWAYS_FOLLOW=y
          CONFIG_OVERLAY_FS_INDEX=y
          CONFIG_OVERLAY_FS_XINO_AUTO=y
          CONFIG_OVERLAY_FS_METACOPY=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_ZRAM_WRITEBACK=y
          # CONFIG_ZRAM_MEMORY_TRACKING is not set
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_TCP_CONG_VEGAS=y
          CONFIG_TCP_CONG_YEAH=y
          CONFIG_TCP_CONG_VENO=y
          # CONFIG_SLUB_DEBUG_ON is not set
          # CONFIG_SLUB_STATS is not set
          # CONFIG_DEBUG_LIST is not set
          # CONFIG_DEBUG_MEMORY_INIT is not set
          # CONFIG_RCU_TRACE is not set
          # CONFIG_PRINTK_CALLER is not set
          # CONFIG_DEBUG_FS is not set
          # CONFIG_F2FS_IOSTAT is not set
          CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y
          EOF

      - name: "⚙️ Add Wild-KSU + SUSFS kernel configs"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          sed 's/^[[:space:]]*//' >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

      - name: "🏷️ Configure kernel name and remove dirty"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          REPO_SHA="${{ github.sha }}"
          SHORT_SHA="${REPO_SHA:0:9}"
          sed -i "\$s|echo \"\\\$res\"|echo \"\\\$res-ab${SHORT_SHA}\"|" ./scripts/setlocalversion
          sed -i 's/-dirty//' ./scripts/setlocalversion
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add . && git commit -m "clean dirty flag" || true

      - name: "🔩 Fix ABI and build configs"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # ABI compare bypass
          ABI_SCRIPT="build/kernel/abi/compare_to_symbol_list"
          if [ -f "$ABI_SCRIPT" ]; then
            sed -i 's/^\s*exit 1$/    echo "ABI check bypassed"/' "$ABI_SCRIPT"
          elif [ -f "build/abi/compare_to_symbol_list" ]; then
            mv build/abi/compare_to_symbol_list build/abi/compare_to_symbol_list.disabled
            printf '#!/bin/bash\necho "ABI checking disabled"\nexit 0\n' \
              > build/abi/compare_to_symbol_list
            chmod +x build/abi/compare_to_symbol_list
          fi

          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64

          # glibc 2.38 compat fix for newer Ubuntu runners
          GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
          if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
            cd ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
            sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' \
              tools/bpf/resolve_btfids/Makefile 2>/dev/null || true
            cd ${{ env.WORK_DIR }}
            echo "✅ glibc 2.38 compat fix applied (host: $GLIBC_VERSION)"
          fi

      - name: "🚀 Build kernel"
        id: build
        working-directory: ${{ env.WORK_DIR }}
        timeout-minutes: 45
        run: |
          set -e
          echo "🚀 Starting kernel build with $(nproc) cores..."

          export LTO=thin
          export KCFLAGS="-pipe -fno-strict-aliasing -Wno-error"
          echo "KCFLAGS: $KCFLAGS"
          export SKIP_ABI_CHECKS=1
          export SKIP_KMI_CHECK=1

          START_BUILD=$(date +%s)

          if ! KCFLAGS="$KCFLAGS" LLVM_PARALLEL_LINK_JOBS=1 BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
            build/build.sh -j$(nproc); then
            exit 1
          fi

          END_BUILD=$(date +%s)
          DURATION=$((END_BUILD - START_BUILD))
          echo "✅ Build completed in $((DURATION / 60))m $((DURATION % 60))s"
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: "🔍 Verify kernel version"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          VERSION_FULL=$(strings Image | grep "Linux version 5" | head -1)
          echo "$VERSION_FULL"
          echo "$VERSION_FULL" | grep -q "dirty" && { echo "❌ dirty!"; exit 1; } || true
          VERSION_CLEAN=$(echo "$VERSION_FULL" | sed 's/Linux version //' | sed 's/ (.*//')
          echo "✅ $VERSION_CLEAN"
          echo "KERNEL_VERSION=$VERSION_CLEAN" >> $GITHUB_ENV
          echo "$VERSION_CLEAN" > kernel_version.txt

      - name: "🔎 Scan patch rejects"
        if: always()
        working-directory: ${{ env.WORK_DIR }}
        run: |
          REJECTS_DIR="${{ env.WORK_DIR }}/patch-rejects"
          mkdir -p "$REJECTS_DIR"
          mapfile -t REJS < <(find "${{ env.KERNEL_LOC_DIR }}" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej file(s)"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV
          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#${{ env.WORK_DIR }}/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"
              echo "⚠️ $REL"
            done
          fi

      - name: "📋 Build summary"
        if: always()
        run: |
          echo "Kernel  : ${{ env.KERNEL_VERSION }}"
          echo "Variant : ${{ matrix.kernel.name }}"
          echo "Repo    : ${{ env.KERNEL_REPO }}"
          echo "Branch  : ${{ env.KERNEL_BRANCH }}"
          echo "KSU     : ${{ matrix.kernel.ksu_type }}"
          echo "SHA     : ${{ github.sha }}"
          echo "Rejects : ${REJ_COUNT:-0}"

      - name: "📦 Create variant ZIP"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -e
          DATE_TAG=$(date +'%Y%m%d')
          ZIP_NAME="AnyKernel3_${{ matrix.kernel.zip_prefix }}_${DATE_TAG}.zip"

          git clone --depth=1 https://github.com/superuseryu/AnyKernel3 ak3_tmp

          cp out/dist/Image ak3_tmp/Image

          cd ak3_tmp
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..

          ZIP_SIZE_MB=$(echo "scale=2; $(stat -c%s "$ZIP_NAME") / 1024 / 1024" | bc)
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_SIZE_MB=$ZIP_SIZE_MB" >> $GITHUB_ENV
          echo "ZIP_SHA256=$ZIP_SHA256" >> $GITHUB_ENV
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV

          echo "✅ $ZIP_NAME ($ZIP_SIZE_MB MB) | modules: $MODULE_COUNT | FW: $(stat -c%s ak3_tmp/vendor/firmware/htc_9271.fw 2>/dev/null || echo 'missing') bytes"

      - name: "📤 Upload variant artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.artifact_name }}
          path: |
            ${{ env.WORK_DIR }}/${{ env.ZIP_NAME }}
            ${{ env.WORK_DIR }}/out/dist/kernel_version.txt
            ${{ env.WORK_DIR }}/wild_ksu_tag.txt
          retention-days: 1

  package-kernels:
    name: "📦 Package & Release"
    runs-on: ubuntu-latest
    needs: [setup, build-kernels]
    if: success()

    steps:
      - name: "📥 Download all kernel artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "🔖 Get versions"
        run: |
          VERSION_FILE=$(find ./artifacts -name "kernel_version.txt" | head -1)
          KERNEL_VERSION=$([ -f "$VERSION_FILE" ] && cat "$VERSION_FILE" || echo "5.15.x")
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV

          # SUSFS module version from sidex15/susfs4ksu-module latest tag
          SUSFS_VERSION=$(curl -sf https://api.github.com/repos/sidex15/susfs4ksu-module/tags \
            | jq -r '.[0].name' || echo "v1.5.2+_R26")
          echo "SUSFS_VERSION=$SUSFS_VERSION" >> $GITHUB_ENV
          echo "SUSFS_MODULE_URL=https://github.com/sidex15/susfs4ksu-module/releases/latest" >> $GITHUB_ENV

          WILD_VERSION=$(find ./artifacts -name "wild_ksu_tag.txt" | head -1 | xargs cat 2>/dev/null || \
            curl -sf https://api.github.com/repos/WildKernels/Wild_KSU/releases/latest \
            | jq -r '.tag_name' || echo "v3.1.1")
          echo "WILD_VERSION=$WILD_VERSION" >> $GITHUB_ENV

          DATE_TAG=$(date +'%Y%m%d')
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV
          if [ "${{ inputs.is_testing }}" = "true" ]; then
            echo "RELEASE_TAG=${SUSFS_VERSION}-testing" >> $GITHUB_ENV
            echo "RELEASE_NAME=Wild KSU Kernel ${SUSFS_VERSION} — Testing" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${SUSFS_VERSION}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Wild KSU Kernel ${SUSFS_VERSION}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

          echo "Kernel: $KERNEL_VERSION | SUSFS: $SUSFS_VERSION | Wild-KSU: $WILD_VERSION"

      - name: "🗂️ Collect ZIP files"
        run: |
          mkdir -p ./zips
          find ./artifacts -name "AnyKernel3_*.zip" -exec cp {} ./zips/ \;
          echo "📋 ZIPs:"
          ls -lh ./zips/

          ZIP_LIST=$(ls ./zips/*.zip | tr '\n' ' ')
          echo "ZIP_LIST=$ZIP_LIST" >> $GITHUB_ENV

      - name: "🧹 Cleanup old release assets"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          gh release view "$TAG" --repo ${{ github.repository }} --json assets \
            | jq -r '.assets[].name' \
            | while read asset; do
                gh release delete-asset "$TAG" "$asset" --repo ${{ github.repository }} --yes 2>/dev/null || true
              done
          echo "✅ Old assets cleaned"

      - name: "📝 Generate release body"
        run: |
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:9}"

          BODY=""
          if [ "${{ inputs.is_testing }}" = "true" ]; then
            BODY="> ⚠️ **Testing build** — use at your own risk."$'\n\n'
          fi
          BODY="${BODY}**Wild-KSU:** [${{ env.WILD_VERSION }}](https://github.com/WildKernels/Wild_KSU/releases/tag/${{ env.WILD_VERSION }})"$'\n'
          BODY="${BODY}**SUSFS:** [${{ env.SUSFS_VERSION }}](${{ env.SUSFS_MODULE_URL }})"$'\n\n'
          BODY="${BODY}**Features:** Wild-KSU ${{ env.WILD_VERSION }} (canary) · SUSFS ඞ · BBG · Thin LTO · TCP (BBR, Westwood default)"$'\n\n'
          BODY="${BODY}**Commit:** [\`${SHORT_SHA}\`](${COMMIT_URL})"$'\n'
          BODY="${BODY}**Flash via OrangeFox / TWRP** · [t.me/home_yu_chat](https://t.me/home_yu_chat)"
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: "⬆️ Create GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./zips/*.zip
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          body: ${{ env.RELEASE_BODY }}

      - name: "🎉 Send Telegram — Build success"
        if: success()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          ENCODED_TAG=$(echo "${{ env.RELEASE_TAG }}" | sed 's/+/%2B/g')
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${ENCODED_TAG}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:9}"

          BUILD_END=$(date +%s)
          DURATION=$(( BUILD_END - ${{ needs.setup.outputs.start_time }} ))

          if [ "${{ inputs.is_testing }}" = "true" ]; then
            STATUS_ICON="🧪"
            STATUS_TEXT="Testing Build"
          else
            STATUS_ICON="✅"
            STATUS_TEXT="Build Success"
          fi

          MESSAGE="<b>${STATUS_ICON} ${STATUS_TEXT}</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>🔄</b> Run #${{ github.run_number }} · ${{ matrix.kernel.name || 'sapphire' }}%0A"
          MESSAGE="${MESSAGE}<b>🏷️</b> <code>${{ env.RELEASE_TAG }}</code>%0A"
          MESSAGE="${MESSAGE}<b>⏱️</b> $((DURATION / 60))m $((DURATION % 60))s%0A"
          MESSAGE="${MESSAGE}<b>🔨</b> <a href='${COMMIT_URL}'>${SHORT_SHA}</a>%0A"
          MESSAGE="${MESSAGE}<b>🔗</b> <a href='${RELEASE_URL}'>Release</a> · <a href='${RUN_URL}'>Logs</a>"

          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true

          for ZIP in ./zips/*.zip; do
            [ -f "$ZIP" ] || continue
            SIZE_MB=$(echo "scale=2; $(stat -c%s "$ZIP") / 1024 / 1024" | bc)
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@"$ZIP" \
              -F caption="📦 $(basename $ZIP) — ${SIZE_MB} MB" || true
          done

  notify-failure:
    name: "❌ Notify Failure"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: always() && needs.build-kernels.result != 'success'
    steps:
      - name: "📣 Send Telegram — Build failed"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          JOB_STATUS="${{ needs.build-kernels.result }}"

          [ "$JOB_STATUS" = "cancelled" ] && ICON="⚠️" && TEXT="Workflow Cancelled" || \
          [ "$JOB_STATUS" = "failure" ] && ICON="❌" && TEXT="Build Failed" || \
          ICON="❓" && TEXT="Unknown ($JOB_STATUS)"

          MESSAGE="<b>${ICON} ${TEXT}!</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>🔄</b> Run #${{ github.run_number }} · sapphire%0A"
          MESSAGE="${MESSAGE}<b>🕐</b> $(date -u +'%Y-%m-%d %H:%M UTC')%0A"
          MESSAGE="${MESSAGE}<b>🔗</b> <a href='${RUN_URL}'>Logs</a>"

          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" || true
