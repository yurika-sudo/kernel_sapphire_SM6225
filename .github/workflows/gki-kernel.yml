name: Build GKI Kernel (Wild-KSU)

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        required: true
        default: 'ksu'
        type: choice
        options:
          - ksu
          - noksu
          - both
      create_release:
        description: 'Create GitHub Release after successful build'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

env:
  ANDROID_VERSION: android13
  KERNEL_VERSION: 5.15
  KERNEL_BRANCH: common-android13-5.15-lts
  CLANG_VERSION: r547379
  DEVICE: sapphiren
  ANYKERNEL_REPO: https://github.com/superuseryu/AnyKernel3
  CCACHE_DIR: ~/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        variant: ${{ github.event.inputs.build_variant == 'both' && fromJSON('["ksu", "noksu"]') || fromJSON(format('["{0}"]', github.event.inputs.build_variant)) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison flex libssl-dev make libelf-dev \
            ccache rsync zip unzip curl git build-essential \
            libncurses-dev gawk wget diffutils libxml2-dev libxslt1-dev python3-dev repo aria2

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.variant }}-
            ccache-

      - name: Setup clang toolchain
        run: |
          mkdir -p prebuilts/clang/host/linux-x86
          aria2c -x 16 -s 16 -o clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf clang-r547379.tar.gz
        
      - name: Verify clang installation
        run: |
          export PATH="${GITHUB_WORKSPACE}/prebuilts/clang/host/linux-x86/clang-r547379/bin:$PATH"
          clang --version
          ld.lld --version

      - name: Initialize kernel source
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b ${KERNEL_BRANCH} --depth=1
          
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
          
          # Clean up to save space
          rm -rf .repo

      - name: Update build config
        working-directory: common
        run: |
          sed -i \
            -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
            -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
            build.config.constants
          
          # Remove defconfig check if exists
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' build.config.gki || true
          # Skip ABI compatibility check (custom kernel config)
          echo 'SKIP_ABI_CHECKS=1' >> build.config.gki.aarch64
          echo 'KMI_STRICT_MODE_OBJECTS=""' >> build.config.gki.aarch64

      - name: Setup Wild KernelSU (KSU Variant Only)
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          curl -LSs https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh | bash -s stable

          if [ -d "Wild_KSU" ]; then
            ln -sf Wild_KSU drivers/kernelsu
            echo "KernelSU setup completed"
          elif [ -d "../Wild_KSU" ]; then
            ln -sf ../Wild_KSU drivers/kernelsu
            echo "KernelSU setup completed"
          else
            echo "Error: Wild_KSU directory not found."
            exit 1
          fi

      - name: Apply SUSFS (KSU Variant Only)
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          if [ -f "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" ]; then
            patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch || true
          fi
          
          if [ -f "susfs4ksu/kernel_patches/fs/susfs.c" ]; then
            cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          fi
          
          if ls susfs4ksu/kernel_patches/include/linux/susfs*.h 1> /dev/null 2>&1; then
            cp susfs4ksu/kernel_patches/include/linux/susfs*.h include/linux/
          fi
          
          if [ -f "Wild_KSU/kernel/ksu.c" ]; then
            if ! grep -q "susfs.h" Wild_KSU/kernel/ksu.c; then
              sed -i '/#include <linux\/fs.h>/a #include <linux/susfs.h>' Wild_KSU/kernel/ksu.c
            fi
            if ! grep -q "susfs_init" Wild_KSU/kernel/ksu.c; then
              sed -i '/ksu_core_init();/a \\tsusfs_init();' Wild_KSU/kernel/ksu.c
            fi
          fi
          
          rm -rf susfs4ksu

      - name: Remove debug printk from modules (KSU Variant Only)
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          find Wild_KSU/ -type f \( -name "*.c" -o -name "*.h" \) \
            -exec sed -i 's/trace_printk/pr_debug/g' {} + 2>/dev/null || true
          
          find fs/ -path "*/susfs*" -type f \( -name "*.c" -o -name "*.h" \) \
            -exec sed -i 's/trace_printk/pr_debug/g' {} + 2>/dev/null || true

      - name: Apply Baseband Guard (KSU Variant Only)
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          git clone --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          
          ln -sf ../Baseband-guard security/baseband-guard
          
          if ! grep -q "baseband-guard" security/Makefile; then
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          fi
          
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          
          if ! grep -q "baseband-guard/Kconfig" security/Kconfig; then
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' security/Kconfig
          fi

      - name: Apply kernel patches
        working-directory: common
        run: |
          # Helper function
          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file"
            rm -f "$file"
          }
          
          # Common patches
          apply_patch "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
          
      - name: Clean git tree
        working-directory: common
        run: |
          git config --global user.email "build@github.com"
          git config --global user.name "GitHub Actions"

          git add -A || true

          if git diff-index --quiet HEAD; then
            echo "No changes detected"
          else
            git commit -m "Build: Apply kernel modifications" --no-verify || true
          fi

      - name: Configure kernel (KSU variant)
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          BUILD_TIME=$(date +'%Y-%m-%d')
          
          # Add local version
          echo "CONFIG_LOCALVERSION_AUTO=y" >> "$CONFIG_FILE"
          
          # Add KSU and SUSFS configs
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF
          
          # Add performance and optimization configs
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_F2FS_FS=y
          CONFIG_F2FS_FS_SECURITY=y
          CONFIG_F2FS_FS_ENCRYPTION=y
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          CONFIG_LRU_GEN_STATS=n
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_DEFAULT_TCP_CONG="westwood"
          CONFIG_ZRAM=y
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          CONFIG_ZRAM_DEF_COMP="lz4"
          EOF
          
          # Disable debug options
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_DEBUG_KERNEL=n
          CONFIG_DEBUG_INFO=n
          CONFIG_DEBUG_INFO_DWARF4=n
          CONFIG_DEBUG_INFO_BTF=n
          CONFIG_DEBUG_FS=n
          CONFIG_DEBUG_BUGVERBOSE=n
          CONFIG_DEBUG_LIST=n
          CONFIG_TRACING=n
          CONFIG_FTRACE=n
          CONFIG_FUNCTION_TRACER=n
          CONFIG_STACK_TRACER=n
          CONFIG_IRQSOFF_TRACER=n
          CONFIG_PREEMPT_TRACER=n
          CONFIG_SCHED_TRACER=n
          CONFIG_TRACE_PRINTK=n
          CONFIG_DYNAMIC_DEBUG=n
          CONFIG_SLUB_DEBUG=n
          CONFIG_DEBUG_PAGEALLOC=n
          CONFIG_DEBUG_OBJECTS=n
          CONFIG_STACKTRACE=n
          CONFIG_RCU_TRACE=n
          CONFIG_EARLY_PRINTK=n
          CONFIG_PRINTK_TIME=n
          CONFIG_PSI=n
          EOF
          
          echo "✅ KSU kernel configs added to defconfig"

      - name: Configure kernel (NoKSU variant)
        if: matrix.variant == 'noksu'
        working-directory: common
        run: |
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          BUILD_TIME=$(date +'%Y-%m-%d')
          
          # Add local version
          echo "CONFIG_LOCALVERSION_AUTO=y" >> "$CONFIG_FILE"
          
          # Add performance and optimization configs (same as KSU but without KSU stuff)
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KALLSYMS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_OVERLAY_FS=y
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_F2FS_FS=y
          CONFIG_F2FS_FS_SECURITY=y
          CONFIG_F2FS_FS_ENCRYPTION=y
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          CONFIG_LRU_GEN_STATS=n
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_DEFAULT_TCP_CONG="westwood"
          CONFIG_ZRAM=y
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          CONFIG_ZRAM_DEF_COMP="lz4"
          EOF
          
          # Disable debug options
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_DEBUG_KERNEL=n
          CONFIG_DEBUG_INFO=n
          CONFIG_DEBUG_INFO_DWARF4=n
          CONFIG_DEBUG_INFO_BTF=n
          CONFIG_DEBUG_FS=n
          CONFIG_DEBUG_BUGVERBOSE=n
          CONFIG_DEBUG_LIST=n
          CONFIG_KPROBES=n
          CONFIG_TRACEPOINTS=n
          CONFIG_TRACING=n
          CONFIG_FTRACE=n
          CONFIG_FUNCTION_TRACER=n
          CONFIG_STACK_TRACER=n
          CONFIG_IRQSOFF_TRACER=n
          CONFIG_PREEMPT_TRACER=n
          CONFIG_SCHED_TRACER=n
          CONFIG_TRACE_PRINTK=n
          CONFIG_DYNAMIC_DEBUG=n
          CONFIG_SLUB_DEBUG=n
          CONFIG_DEBUG_PAGEALLOC=n
          CONFIG_DEBUG_OBJECTS=n
          CONFIG_STACKTRACE=n
          CONFIG_RCU_TRACE=n
          CONFIG_EARLY_PRINTK=n
          CONFIG_PRINTK_TIME=n
          CONFIG_PSI=n
          EOF
          
          echo "✅ NoKSU kernel configs added to defconfig"

      - name: Verify kernel configuration
        working-directory: common
        run: |
          echo "📋 Defconfig contents (last 50 lines):"
          tail -50 arch/arm64/configs/gki_defconfig

      - name: Build kernel
        run: |
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=2G
          export KBUILD_BUILD_USER=yu
          export KBUILD_BUILD_HOST=github
          export PATH="${GITHUB_WORKSPACE}/prebuilts/clang/host/linux-x86/clang-r547379/bin:$PATH"
          
          which clang || { echo "ERROR: clang not found"; exit 127; }
          
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          LTO=thin \
          SKIP_MRPROPER=1 \
          build/build.sh -j$(nproc --all) || {
            echo "Build failed"
            exit 1
          }

      - name: Verify build output and config
        run: |
          if [ ! -f "out/android13-5.15/dist/Image" ]; then
            echo "Error: Kernel Image not found"
            exit 1
          fi
          echo "✅ Kernel Image created successfully"
          
          echo "📋 Checking final .config:"
          if [ -f "out/android13-5.15/common/.config" ]; then
            echo "TCP Westwood status:"
            grep "CONFIG_TCP_CONG_WESTWOOD" out/android13-5.15/common/.config || echo "Not found"
            grep "CONFIG_DEFAULT_WESTWOOD" out/android13-5.15/common/.config || echo "Not found"
            grep "CONFIG_DEFAULT_TCP_CONG" out/android13-5.15/common/.config || echo "Not found"
            
            if [ "${{ matrix.variant }}" == "ksu" ]; then
              echo "KSU status:"
              grep "CONFIG_KSU" out/android13-5.15/common/.config || echo "Not found"
            fi
          fi

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 $ANYKERNEL_REPO ak3
          
          cp out/android13-5.15/dist/Image ak3/
          
          [ -f out/android13-5.15/dist/dtb ] && cp out/android13-5.15/dist/dtb ak3/ || true
          [ -f out/android13-5.15/dist/dtbo.img ] && cp out/android13-5.15/dist/dtbo.img ak3/ || true
          
          cd ak3
          VARIANT_SUFFIX=""
          if [ "${{ matrix.variant }}" == "noksu" ]; then
            VARIANT_SUFFIX="-noksu"
          fi
          zip -r9 ../GKI-${DEVICE}-A13${VARIANT_SUFFIX}-$(date +%Y%m%d).zip * -x .git\* -x README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-${{ env.DEVICE }}-${{ matrix.variant }}-${{ github.run_number }}
          path: GKI-*.zip
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: |
      github.event.inputs.create_release == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    
    steps:
      - name: Get build info
        id: build_info
        run: |
          date_full="$(date '+%Y-%m-%d %H:%M:%S UTC')"
          date_short="$(date +%Y%m%d)"
          tag="v${{ github.run_number }}-${date_short}"
          echo "date=${date_full}" >> $GITHUB_OUTPUT
          echo "date_short=${date_short}" >> $GITHUB_OUTPUT
          echo "tag=${tag}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: GKI-${{ env.DEVICE }}-*

      - name: Check if artifacts exist
        id: check_artifacts
        run: |
          artifact_count=0
          has_ksu=false
          has_noksu=false
          
          if [ -d "artifacts/GKI-${{ env.DEVICE }}-ksu-${{ github.run_number }}" ]; then
            artifact_count=$((artifact_count + 1))
            has_ksu=true
          fi
          
          if [ -d "artifacts/GKI-${{ env.DEVICE }}-noksu-${{ github.run_number }}" ]; then
            artifact_count=$((artifact_count + 1))
            has_noksu=true
          fi
          
          if [ $artifact_count -eq 0 ]; then
            echo "create_release=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "create_release=true" >> $GITHUB_OUTPUT
            echo "has_ksu=${has_ksu}" >> $GITHUB_OUTPUT
            echo "has_noksu=${has_noksu}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release files
        if: steps.check_artifacts.outputs.create_release == 'true'
        run: |
          mkdir -p release_files
          
          if [ "${{ steps.check_artifacts.outputs.has_ksu }}" = "true" ]; then
            cp artifacts/GKI-${{ env.DEVICE }}-ksu-${{ github.run_number }}/*.zip release_files/
          fi
          
          if [ "${{ steps.check_artifacts.outputs.has_noksu }}" = "true" ]; then
            cp artifacts/GKI-${{ env.DEVICE }}-noksu-${{ github.run_number }}/*.zip release_files/
          fi

      - name: Create Unified Release
        if: steps.check_artifacts.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_info.outputs.tag }}
          name: GKI Kernel - Build #${{ github.run_number }} (${{ steps.build_info.outputs.date_short }})
          body: |
            ## GKI Kernel for Redmi Note 13 4G / NFC
            Android 13 • Kernel 5.15 • Build #${{ github.run_number }}
            
            ### Build Information
            - Build Date: ${{ steps.build_info.outputs.date }}
            - Build Number: #${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            
            ### Available Variants
            
            ${{ steps.check_artifacts.outputs.has_ksu == 'true' && '#### KSU Variant:
            - Wild KernelSU integrated
            - SUSFS root hiding
            - Baseband Guard protection
            - KALLSYMS support
            - TMPFS XATTR/POSIX_ACL' || '' }}
            
            ${{ steps.check_artifacts.outputs.has_noksu == 'true' && '#### NoKSU Variant:
            - No KernelSU (stock GKI)
            - No root hiding features
            - No additional security modules' || '' }}
            
            #### Common Features (All Variants):
            - TCP Westwood default congestion control
            - Full TCP algorithm support (BBR, Westwood, Cubic)
            - MGLRU memory management
            - F2FS optimization
            - ZRAM LZ4 compression
            - Debugging infrastructure disabled
            - Proper kernel version string
            
            ### Installation
            1. Boot to recovery (TWRP/OrangeFox)
            2. Flash the appropriate ZIP file
            3. Reboot system
            
            ### Verification
            
            After booting, verify:
            
            ```
            # Check kernel version
            uname -r
            
            # Check TCP congestion control
            cat /proc/sys/net/ipv4/tcp_congestion_control
            
            # Check available TCP algorithms
            cat /proc/sys/net/ipv4/tcp_available_congestion_control
            ```
            
            ### Notes
            - Compatible: Android 13 GKI devices only
            - Requires: Unlocked bootloader
            - Backup: Your current boot partition before flashing
            - Tested on: Redmi Note 13 4G (Sapphire/Sapphiren)
          files: release_files/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
