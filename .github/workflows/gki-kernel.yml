name: "Build GKI Kernel"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernels:
    name: "Build GKI Kernel"
    runs-on: ubuntu-latest
    
    env:
      KERNEL_LOC_DIR: "common_gki"
      KERNEL_NAME: "common"
      KERNEL_REPO: "https://android.googlesource.com/kernel/common"
      KERNEL_BRANCH: "android13-5.15-lts"
      DEFCONFIG_NAME: "gki_defconfig"
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 bc bison build-essential flex git libelf-dev libssl-dev wget curl jq

      - name: "Send Telegram build started"
        if: always()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          MESSAGE="🔨 <b>Kernel Build Started</b>%0A%0A"
          MESSAGE="${MESSAGE}📁 <b>Repository:</b> ${{ github.repository }}%0A"
          MESSAGE="${MESSAGE}🎯 <b>Target:</b> Android ${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}%0A"
          MESSAGE="${MESSAGE}🔄 <b>Trigger:</b> ${{ github.event_name }}%0A"
          MESSAGE="${MESSAGE}⏰ <b>Started:</b> ${{ env.BUILD_TIME }}%0A"
          MESSAGE="${MESSAGE}⚡ <b>Status:</b> Initializing..."
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true

      - name: "Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8
          
          rm -rf .repo
          rm -rf common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "Setup Baseband-guard (BBG)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard
          
          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          
          grep -q "baseband-guard/Kconfig" security/Kconfig || \
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' security/Kconfig

      - name: "Setup Wild-KSU with SUSFS"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e
          
          rm -rf ./KernelSU ./drivers/kernelsu ./Wild_KSU
          
          echo "Installing Wild-KSU..."
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s stable
          
          if [ ! -d "Wild_KSU" ]; then
            echo "ERROR: Wild_KSU directory not found!"
            exit 1
          fi
          
          echo "Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          if [ ! -d "susfs4ksu" ]; then
            echo "ERROR: SUSFS4KSU clone failed!"
            exit 1
          fi
          
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          
          if [ -f "$SUSFS_PATCH" ]; then
            if patch -p1 --forward < "$SUSFS_PATCH"; then
              echo "SUSFS kernel patch applied"
            else
              echo "Patch had some issues, continuing..."
            fi
          fi
          
          mkdir -p fs include/linux
          
          if [ -f "susfs4ksu/kernel_patches/fs/susfs.c" ]; then
            cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          else
            echo "ERROR: fs/susfs.c not found!"
            exit 1
          fi
          
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          else
            echo "ERROR: include/linux/susfs.h not found!"
            exit 1
          fi
          
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
          fi
          
          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* Wild_KSU/kernel/ || true
          fi
          
          KSU_C_FILE="Wild_KSU/kernel/ksu.c"
          
          if [ ! -f "$KSU_C_FILE" ]; then
            echo "ERROR: $KSU_C_FILE not found!"
            exit 1
          fi
          
          if ! grep -q "susfs_init" "$KSU_C_FILE" 2>/dev/null; then
            if ! grep -q "#include <linux/susfs.h>" "$KSU_C_FILE"; then
              sed -i '/#include <linux\/fs\.h>/a #include <linux/susfs.h>' "$KSU_C_FILE"
            fi
            
            if ! grep -q "susfs_init()" "$KSU_C_FILE"; then
              sed -i '/ksu_core_init();/a \\tsusfs_init();' "$KSU_C_FILE" || \
              sed -i '/int __init ksu_init(/,/^}/{ /return 0;/i \\tsusfs_init(); }' "$KSU_C_FILE"
            fi
          fi
          
          if [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ]; then
            ln -sf ../Wild_KSU drivers/kernelsu
          fi

      - name: "Fix kernel version string (remove -dirty & set proper format)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          # Generate build timestamp
          CURRENT_TIME=$(date -u +"%a %b %d %H:%M:%S UTC %Y")
          echo "CURRENT_TIME=$CURRENT_TIME"
          
          # Modify mkcompile_h to set proper timestamp (5.x kernels)
          if [ -f "scripts/mkcompile_h" ]; then
            perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $CURRENT_TIME\"}" scripts/mkcompile_h
          fi
          
          # Remove -dirty from version string in setlocalversion
          if [ -f "scripts/setlocalversion" ]; then
            sed -i 's/-dirty//' scripts/setlocalversion
            sed -i 's/echo "$res"/echo "${res%-dirty}"/' scripts/setlocalversion
          fi
          
          # Generate proper version suffix like: -gbf0a81a7f319-ab13297889
          BID="ab$((RANDOM % 90000000 + 10000000))"
          GHASH=$(git rev-parse --verify HEAD | cut -c1-13)
          
          # Format like: -00014-gbf0a81a7f319-ab13297889
          # Get commit count from start of branch
          COMMIT_COUNT=$(git rev-list --count HEAD)
          COMMIT_COUNT_FORMATTED=$(printf "%05d" $COMMIT_COUNT)
          
          KMI_VERSION="-android13-8-${COMMIT_COUNT_FORMATTED}-g${GHASH}-${BID}"
          echo "KMI_VERSION=$KMI_VERSION"
          
          # Set in defconfig
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          # Remove existing LOCALVERSION configs
          sed -i '/CONFIG_LOCALVERSION=/d' "$CONFIG_FILE"
          sed -i '/CONFIG_LOCALVERSION_AUTO=/d' "$CONFIG_FILE"
          
          # Add new version configs
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION=\"$KMI_VERSION\"" >> "$CONFIG_FILE"
          
          # Also set in setlocalversion script for double safety
          if [ -f "scripts/setlocalversion" ]; then
            sed -i "\$s|echo \"\$res\"|echo \"$KMI_VERSION\"|" scripts/setlocalversion 2>/dev/null || true
          fi
          
          echo "✅ Kernel version string fixed: $KMI_VERSION"

      - name: "Clean git tree
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Add all changes
          git add -A
          
          # Check if there are changes to commit
          if ! git diff-index --quiet HEAD; then
            git commit -m "Build: Apply Wild-KSU, SUSFS, BBG modifications and fix version" --no-verify
            echo "Committed changes to avoid -dirty tag"
          else
            echo "No changes to commit"
          fi
          
          # Verify the git status is clean
          echo "Git status after commit:"
          git status --short

      - name: "Setup kernel configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          echo "CONFIG_LRU_GEN=y" >> "$CONFIG_FILE"

          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KPM=y
          CONFIG_BBG=y
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

      - name: "Disable ABI checks (GKI method)"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Skip ABI checks completely (GKI method)
          export SKIP_ABI_CHECKS=1
          export SKIP_KMI_CHECK=1
          
          # Create dummy ABI check script that always succeeds
          if [ -f "build/abi/compare_to_symbol_list" ]; then
            mv build/abi/compare_to_symbol_list build/abi/compare_to_symbol_list.disabled
            cat > build/abi/compare_to_symbol_list << 'EOF'
            #!/bin/bash
            echo "ABI checking disabled for custom GKI kernel build"
            echo "Custom modifications: Wild-KSU, SUSFS, BBG"
            exit 0
            EOF
            chmod +x build/abi/compare_to_symbol_list
          fi

      - name: "Send Telegram build progress"
        if: always()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          MESSAGE="⚙️ <b>Kernel Build Progress</b>%0A%0A"
          MESSAGE="${MESSAGE}⏰ <b>Time:</b> $(date +'%H:%M:%S')%0A"
          MESSAGE="${MESSAGE}🔧 <b>Stage:</b> Compiling kernel...%0A"
          MESSAGE="${MESSAGE}📊 <b>Status:</b> Running make..."
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true

      - name: "Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          export LTO=thin
          export SKIP_ABI_CHECKS=1
          export SKIP_KMI_CHECK=1
          
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "Verify kernel version string"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          echo "🔍 Checking kernel version string..."
          VERSION_STRING=$(strings Image | grep "Linux version" | head -1)
          echo "Version found: $VERSION_STRING"
          
          # Check if contains -dirty
          if echo "$VERSION_STRING" | grep -q "dirty"; then
            echo "❌ ERROR: Kernel still contains -dirty!"
            exit 1
          fi
          
          # Verify it has the proper format
          if echo "$VERSION_STRING" | grep -qE "android13-8-[0-9]{5}-g[0-9a-f]{13}-ab[0-9]{8}"; then
            echo "✅ Kernel version string has correct format!"
          else
            echo "⚠️  Warning: Version string doesn't match expected format"
            echo "Expected pattern: android13-8-XXXXX-gXXXXXXXXXXXXX-abXXXXXXXX"
          fi

      - name: "Copy kernel image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "Image.gki"
          echo "📦 Kernel image copied: Image.gki"

      - name: "Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernel
          path: ${{ env.WORK_DIR }}/out/dist/Image.gki
          retention-days: 1

  package-kernel:
    name: "Package Kernel"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: success()
    
    steps:
      - name: "Download kernel artifact"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "Create ZIP package"
        id: create_zip
        run: |
          set -e
          echo "📦 Creating AnyKernel3 package..."
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b YASK AnyKernel3
          cp ./artifacts/gki-kernel/Image.gki AnyKernel3/
          
          DATE_TAG=$(date +'%Y.%m.%d')
          ZIP_NAME="GKI_Kernel_WildKSU_${{ env.BUILD_DATE }}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          
          # Get file size
          ZIP_SIZE=$(stat -c%s "$ZIP_NAME" 2>/dev/null || echo "0")
          ZIP_SIZE_MB=$(echo "scale=2; $ZIP_SIZE / 1024 / 1024" | bc)
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_SIZE_MB=$ZIP_SIZE_MB" >> $GITHUB_ENV
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "TAG_NAME=gki-$DATE_TAG" >> $GITHUB_ENV
          
          echo "✅ Package created: $ZIP_NAME ($ZIP_SIZE_MB MB)"

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          name: "GKI Kernel ${{ env.DATE_TAG }}"
          body: |
            ## 🚀 GKI Kernel with Wild-KSU + SUSFS
            
            **Build Date:** ${{ env.BUILD_TIME }}
            **File:** ${{ env.ZIP_NAME }} (${{ env.ZIP_SIZE_MB }} MB)
            
            ### Features:
            - Wild-KSU 3.0.0 Stable
            - SUSFS ඞ v2.0.0
            - Baseband Guard (BBG)
            
            ### Special Thanks:
            - Based on YASK by @belowzeroiq
            - Uses clang-r547379 toolchain
            
            ### Installation Notes:
            - Boot to recovery (TWRP/OrangeFox) (recommended)
            - Kernel Flasher: https://github.com/fatalcoder524/KernelFlasher/
            - SUSFS module: https://github.com/sidex15/ksu_module_susfs
            - Wild-KSU Manager: https://github.com/WildKernels/Wild_KSU/releases
            
          draft: false
          prerelease: false

      - name: "Send Telegram success notification"
        if: success()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG_NAME }}"
          COMMIT_HASH="${GITHUB_SHA:0:7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          MESSAGE="✅ <b>Kernel Build Success!</b>%0A%0A"
          MESSAGE="${MESSAGE}📦 <b>File:</b> <code>${{ env.ZIP_NAME }}</code>%0A"
          MESSAGE="${MESSAGE}📊 <b>Size:</b> ${{ env.ZIP_SIZE_MB }} MB%0A"
          MESSAGE="${MESSAGE}📅 <b>Build Time:</b> ${{ env.BUILD_TIME }}%0A"
          MESSAGE="${MESSAGE}🔗 <b>Release:</b> <a href='${RELEASE_URL}'>Download</a>%0A"
          MESSAGE="${MESSAGE}📝 <b>Build Logs:</b> <a href='${RUN_URL}'>View</a>%0A%0A"
          MESSAGE="${MESSAGE}⚡ <b>Features:</b>%0A"
          MESSAGE="${MESSAGE}• Wild-KSU 3.0.0 + SUSFS ඞ%0A"
          MESSAGE="${MESSAGE}• BBG%0A"
          MESSAGE="${MESSAGE}🎯 <b>Based on:</b> YASK by @belowzeroiq"
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true
          
          # Send file if < 50MB
          if (( $(echo "${{ env.ZIP_SIZE_MB }} < 50" | bc -l) )); then
            echo "📤 Sending ZIP file to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@"${{ env.ZIP_NAME }}" \
              -F caption="📦 ${{ env.ZIP_NAME }} (${{ env.ZIP_SIZE_MB }} MB)"
          else
            echo "ℹ️ File too large (${{ env.ZIP_SIZE_MB }} MB), only sending link."
          fi

  notify-failure:
    name: "Notify Failure"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: failure()
    
    steps:
      - name: "Send Telegram failure notification"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          JOB_URL="$RUN_URL#step:${{ github.step }}"
          COMMIT_HASH="${GITHUB_SHA:0:7}"
          
          MESSAGE="❌ <b>Kernel Build Failed!</b>%0A%0A"
          MESSAGE="${MESSAGE}📅 <b>Time:</b> $(date +'%H:%M:%S')%0A"
          MESSAGE="${MESSAGE}🔗 <b>Commit:</b> <code>${COMMIT_HASH}</code>%0A"
          MESSAGE="${MESSAGE}🚨 <b>Failed Step:</b> ${{ github.job }}%0A"
          MESSAGE="${MESSAGE}🔍 <b>Debug:</b> <a href='${JOB_URL}'>View Error Logs</a>%0A%0A"
          MESSAGE="${MESSAGE}⚠️ <b>Possible Issues:</b>%0A"
          MESSAGE="${MESSAGE}• Compilation error%0A"
          MESSAGE="${MESSAGE}• Missing dependencies%0A"
          MESSAGE="${MESSAGE}• Patch conflicts%0A"
          MESSAGE="${MESSAGE}• Version string issues"
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true
