name: Build GKI Kernel - Fixed

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: false
        default: 'both'
        type: choice
        options:
          - ksu
          - noksu
          - both

permissions:
  contents: write

env:
  KERNEL_BRANCH: android13-5.15-lts
  CLANG_VERSION: r547379
  DEVICE: sapphiren
  ANDROID_VERSION: 13

jobs:
  build:
    name: "Build ${{ matrix.variant.name }}"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: "GKI-KSU"
            enable_ksu: true
            suffix: "ksu"
          - name: "GKI-NoKSU"
            enable_ksu: false
            suffix: "noksu"
    
    steps:
      - name: Setup environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq && sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev build-essential \
            zip git curl aria2 repo jq python3 make gcc ccache \
            libncurses-dev gawk rsync
      
      - name: Setup ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-
      
      - name: Initialize ccache
        run: |
          mkdir -p ~/.ccache
          ccache -M 2G
          ccache -z
      
      - name: Send Telegram notification
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ] && exit 0
          
          MESSAGE="🚀 <b>Kernel Build Started</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>Variant:</b> ${{ matrix.variant.name }}%0A"
          MESSAGE="${MESSAGE}<b>Run:</b> #${{ github.run_number }}%0A"
          MESSAGE="${MESSAGE}<b>Time:</b> $(date +'%H:%M')%0A"
          MESSAGE="${MESSAGE}<b>Trigger:</b> ${{ github.event_name }}"
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true || true
      
      - name: Download clang
        run: |
          mkdir -p prebuilts/clang/host/linux-x86
          aria2c -x16 -s16 -o clang.tar.gz \
            "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-${{ env.CLANG_VERSION }}.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-${{ env.CLANG_VERSION }}
          tar -xzf clang.tar.gz -C prebuilts/clang/host/linux-x86/clang-${{ env.CLANG_VERSION }}
          rm clang.tar.gz
      
      - name: Initialize kernel source
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-${{ env.KERNEL_BRANCH }} --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle
          
          # Clean unwanted clang versions
          rm -rf prebuilts/clang/host/linux-x86/clang-{3289846,r450784e,stable}
          
          cd common
          git checkout -f && git clean -fdx
          
          # Update build config
          sed -i -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
                 -e 's/^CLANG_VERSION=.*/CLANG_VERSION=${{ env.CLANG_VERSION }}/' \
                 build.config.constants
          
          # === FIX 1: Bypass ALL ABI checks ===
          echo "Disabling all ABI checks..."
          
          # Comment out ALL ABI related lines in build.config.gki.aarch64
          sed -i '/^ABI_DEFINITION=/s/^/#/' build.config.gki.aarch64
          sed -i '/^KMI_SYMBOL_LIST=/s/^/#/' build.config.gki.aarch64
          sed -i '/^ADDITIONAL_KMI_SYMBOL_LISTS=/s/^/#/' build.config.gki.aarch64
          sed -i '/^TRIM_NONLISTED_KMI=/s/^/#/' build.config.gki.aarch64
          sed -i '/^GKI_MODULES_LIST=/s/^/#/' build.config.gki.aarch64
          
          # Add override flags at the END of file
          echo '' >> build.config.gki.aarch64
          echo '# ===== MANUAL OVERRIDE =====' >> build.config.gki.aarch64
          echo 'SKIP_ABI_CHECKS=1' >> build.config.gki.aarch64
          echo 'SKIP_CP_KERNEL_HDR=1' >> build.config.gki.aarch64
          echo 'ABI_DEFINITION=' >> build.config.gki.aarch64
          echo 'KMI_SYMBOL_LIST=' >> build.config.gki.aarch64
          echo 'ADDITIONAL_KMI_SYMBOL_LISTS=' >> build.config.gki.aarch64
          echo 'GKI_MODULES_LIST=' >> build.config.gki.aarch64
          
          # Remove POST_DEFCONFIG_CMDS
          sed -i '/^POST_DEFCONFIG_CMDS=/d' build.config.gki
          
          # Create dummy ABI files to avoid "file not found"
          mkdir -p android
          for file in abi_gki_aarch64 abi_gki_aarch64_virtual_device abi_gki_aarch64_db845c abi_symbollist.raw; do
            touch android/$file
            echo "# Dummy file - ABI checks disabled" > android/$file
          done
          
          cd ..
      
      - name: Setup Wild-KSU
        if: matrix.variant.enable_ksu
        working-directory: common
        run: |
          echo "Setting up Wild-KSU..."
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s stable
          
          if [ -d "Wild_KSU" ]; then
            ln -sf Wild_KSU drivers/kernelsu
            echo "✓ Wild-KSU linked"
          else
            echo "❌ Wild_KSU directory not found!"
            ls -la
            exit 1
          fi
      
      - name: Setup SUSFS
        if: matrix.variant.enable_ksu
        working-directory: common
        run: |
          git clone -q --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          # Apply patch if exists
          [ -f "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" ] && \
            patch -p1 --forward < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch 2>/dev/null || true
          
          # Copy SUSFS files
          mkdir -p fs include/linux
          [ -f "susfs4ksu/kernel_patches/fs/susfs.c" ] && cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          [ -f "susfs4ksu/kernel_patches/include/linux/susfs.h" ] && cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ] && cp susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          
          # Integrate with KSU
          if [ -f "Wild_KSU/kernel/ksu.c" ]; then
            grep -q "susfs.h" Wild_KSU/kernel/ksu.c || \
              sed -i '/#include <linux\/fs.h>/a #include <linux/susfs.h>' Wild_KSU/kernel/ksu.c
            grep -q "susfs_init" Wild_KSU/kernel/ksu.c || \
              sed -i '/ksu_core_init();/a \\tsusfs_init();' Wild_KSU/kernel/ksu.c
          fi
          
          rm -rf susfs4ksu
          echo "✓ SUSFS setup complete"
      
      - name: Setup Baseband Guard
        if: matrix.variant.enable_ksu
        working-directory: common
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard
          
          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          
          grep -q "baseband-guard/Kconfig" security/Kconfig || \
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' security/Kconfig
          
          # Add to LSM
          sed -i '/^config LSM$/,/^help$/{ /default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          
          echo "✓ Baseband Guard setup complete"
      
      - name: Clean git state (prevent -dirty)
        working-directory: common
        run: |
          git config --global user.email "build@github.com"
          git config --global user.name "GitHub Actions"
          git add -A 2>/dev/null || true
          git diff-index --quiet HEAD || \
            git commit -m "Build: Apply modifications" --no-verify 2>/dev/null || true
          
          # Create .scmversion to control version string
          echo "-android${{ env.ANDROID_VERSION }}-8-00000-g$(git rev-parse --short=12 HEAD)-ab${{ github.run_number }}" > .scmversion
          
          echo "✓ Git state cleaned"
      
      - name: Configure kernel via Kconfig
        working-directory: common
        env:
          PATH: ${{ github.workspace }}/prebuilts/clang/host/linux-x86/clang-${{ env.CLANG_VERSION }}/bin:$PATH
        run: |
          # Create initial config
          make O=out ARCH=arm64 CC=clang gki_defconfig
          
          # Use scripts/config to modify
          CONFIG_TOOL="./scripts/config"
          
          # === Performance optimizations ===
          $CONFIG_TOOL --file out/.config -e CC_OPTIMIZE_FOR_PERFORMANCE
          $CONFIG_TOOL --file out/.config -e LRU_GEN
          $CONFIG_TOOL --file out/.config -e LRU_GEN_ENABLED
          $CONFIG_TOOL --file out/.config -d LRU_GEN_STATS
          
          # === TCP Congestion Control ===
          $CONFIG_TOOL --file out/.config -e TCP_CONG_ADVANCED
          $CONFIG_TOOL --file out/.config -e TCP_CONG_WESTWOOD
          $CONFIG_TOOL --file out/.config -e TCP_CONG_BBR
          $CONFIG_TOOL --file out/.config -d TCP_CONG_BIC
          $CONFIG_TOOL --file out/.config -d TCP_CONG_HTCP
          $CONFIG_TOOL --file out/.config -e DEFAULT_WESTWOOD
          $CONFIG_TOOL --file out/.config -d DEFAULT_CUBIC
          $CONFIG_TOOL --file out/.config -d DEFAULT_BBR
          $CONFIG_TOOL --file out/.config --set-str DEFAULT_TCP_CONG "westwood"
          
          # === Filesystem support ===
          $CONFIG_TOOL --file out/.config -e OVERLAY_FS
          $CONFIG_TOOL --file out/.config -e TMPFS_XATTR
          $CONFIG_TOOL --file out/.config -e TMPFS_POSIX_ACL
          $CONFIG_TOOL --file out/.config -e F2FS_FS
          $CONFIG_TOOL --file out/.config -e F2FS_FS_SECURITY
          
          # === Memory/ZRAM ===
          $CONFIG_TOOL --file out/.config -e ZRAM
          $CONFIG_TOOL --file out/.config -e ZRAM_DEF_COMP_LZ4
          $CONFIG_TOOL --file out/.config --set-str ZRAM_DEF_COMP "lz4"
          
          # === Disable debug/tracing ===
          $CONFIG_TOOL --file out/.config -d DEBUG_KERNEL
          $CONFIG_TOOL --file out/.config -d DEBUG_INFO
          $CONFIG_TOOL --file out/.config -d DEBUG_FS
          $CONFIG_TOOL --file out/.config -d TRACING_SUPPORT
          $CONFIG_TOOL --file out/.config -d TRACING
          $CONFIG_TOOL --file out/.config -d FTRACE
          $CONFIG_TOOL --file out/.config -d TRACEPOINTS
          $CONFIG_TOOL --file out/.config -d PSI
          $CONFIG_TOOL --file out/.config -d PSI_DEFAULT_DISABLED
          
          # === KSU specific ===
          if [ "${{ matrix.variant.enable_ksu }}" = "true" ]; then
            $CONFIG_TOOL --file out/.config -e KSU
            $CONFIG_TOOL --file out/.config -e KSU_SUSFS
            $CONFIG_TOOL --file out/.config -e BBG
            $CONFIG_TOOL --file out/.config -e KPROBES
          else
            $CONFIG_TOOL --file out/.config -d KSU
            $CONFIG_TOOL --file out/.config -d KSU_SUSFS
            $CONFIG_TOOL --file out/.config -d BBG
          fi
          
          # === Set proper LOCALVERSION ===
          # Get actual git hash
          GIT_HASH=$(git rev-parse --short=12 HEAD)
          BUILD_ID="ab$(printf "%08d" ${{ github.run_number }})"
          LOCAL_VER="-android${{ env.ANDROID_VERSION }}-8-g${GIT_HASH}-${BUILD_ID}"
          
          $CONFIG_TOOL --file out/.config --set-str LOCALVERSION "$LOCAL_VER"
          echo "LOCALVERSION=$LOCAL_VER" >> $GITHUB_ENV
          
          # Finalize config
          make O=out ARCH=arm64 CC=clang olddefconfig
          
          echo "✓ Kernel configuration complete"
      
      - name: Verify config
        working-directory: common
        run: |
          echo "=== Configuration Verification ==="
          echo "LOCALVERSION: $(grep 'CONFIG_LOCALVERSION=' out/.config || echo 'Not found')"
          echo "TCP Westwood: $(grep 'CONFIG_DEFAULT_WESTWOOD' out/.config || echo 'Not found')"
          echo "MGLRU: $(grep 'CONFIG_LRU_GEN' out/.config || echo 'Not found')"
          echo "KSU: $(grep 'CONFIG_KSU' out/.config || echo 'Not found')"
          echo "Debug: $(grep 'CONFIG_DEBUG_KERNEL' out/.config || echo 'Disabled')"
          echo "Tracing: $(grep 'CONFIG_TRACING' out/.config || echo 'Disabled')"
      
      - name: Build kernel
        env:
          SKIP_ABI_CHECKS: 1
          SKIP_CP_KERNEL_HDR: 1
          USE_CCACHE: 1
          CCACHE_DIR: ~/.ccache
          KBUILD_BUILD_USER: yu
          KBUILD_BUILD_HOST: github
          KBUILD_BUILD_TIMESTAMP: "$(date -u '+%a %b %e %H:%M:%S UTC %Y')"
        run: |
          export PATH="${{ github.workspace }}/prebuilts/clang/host/linux-x86/clang-${{ env.CLANG_VERSION }}/bin:$PATH"
          
          echo "=== Starting kernel build ==="
          echo "Using clang: $(clang --version | head -1)"
          
          # Build with full output
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          LTO=thin \
          build/build.sh -j$(nproc) 2>&1 | tee build.log
          
          # Check for success
          if [ -f "out/android13-5.15/dist/Image" ]; then
            echo "✓ Build successful"
            
            # Copy with variant suffix
            cp out/android13-5.15/dist/Image "Image.${{ matrix.variant.suffix }}"
            
            # Verify version string
            echo "=== Kernel version ==="
            strings "Image.${{ matrix.variant.suffix }}" | grep "Linux version" | head -1
          else
            echo "❌ Build failed - Image not found"
            exit 1
          fi
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant.suffix }}
          path: |
            Image.${{ matrix.variant.suffix }}
          retention-days: 1
  
  package:
    name: "Package & Release"
    runs-on: ubuntu-22.04
    needs: [build]
    
    steps:
      - name: Setup
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "TAG=v$(date +'%Y.%m.%d')" >> $GITHUB_ENV
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Package AnyKernel3
        run: |
          git clone -q --depth=1 https://github.com/superuseryu/AnyKernel3 ak3
          
          # Check which variants were built
          HAS_KSU=false
          HAS_NOKSU=false
          
          if [ -f "artifacts/kernel-ksu/Image.ksu" ]; then
            cp artifacts/kernel-ksu/Image.ksu ak3/Image.ksu
            HAS_KSU=true
            echo "✓ KSU variant found"
          fi
          
          if [ -f "artifacts/kernel-noksu/Image.noksu" ]; then
            cp artifacts/kernel-noksu/Image.noksu ak3/Image.noksu
            HAS_NOKSU=true
            echo "✓ NoKSU variant found"
          fi
          
          # Update AnyKernel3 script for AIO
          if [ "$HAS_KSU" = true ] && [ "$HAS_NOKSU" = true ]; then
            cat > ak3/anykernel.sh << 'EOF'
            #!/system/bin/sh
            # AnyKernel3 AIO Installer
            
            ui_print " "
            ui_print "Select variant:"
            ui_print "  • Volume UP   = KSU variant (Wild-KSU + SUSFS)"
            ui_print "  • Volume DOWN = NoKSU variant (Stock GKI)"
            ui_print "  • Power       = Cancel"
            ui_print " "
            
            if $KEYCHECK; then
              if [ "$VKSEL" = "up" ]; then
                ui_print "Selected: KSU variant"
                mv $home/Image.ksu $home/Image
              elif [ "$VKSEL" = "down" ]; then
                ui_print "Selected: NoKSU variant"
                mv $home/Image.noksu $home/Image
              else
                abort "Installation cancelled"
              fi
            else
              ui_print "Default: KSU variant"
              mv $home/Image.ksu $home/Image
            fi
            
            # Continue with standard install
            dump_boot
            write_boot
            ui_print " "
            ui_print "✓ Installation complete"
            ui_print " "
            EOF
            
            ZIP_NAME="GKI-${{ env.DEVICE }}-AIO-${{ env.BUILD_DATE }}.zip"
          elif [ "$HAS_KSU" = true ]; then
            cp ak3/Image.ksu ak3/Image
            ZIP_NAME="GKI-${{ env.DEVICE }}-KSU-${{ env.BUILD_DATE }}.zip"
          elif [ "$HAS_NOKSU" = true ]; then
            cp ak3/Image.noksu ak3/Image
            ZIP_NAME="GKI-${{ env.DEVICE }}-NoKSU-${{ env.BUILD_DATE }}.zip"
          else
            echo "❌ No kernel images found!"
            exit 1
          fi
          
          # Create ZIP
          cd ak3
          zip -q -r9 "../$ZIP_NAME" * -x .git\* -x README.md
          cd ..
          
          ZIP_SIZE=$(stat -c%s "$ZIP_NAME" | awk '{printf "%.2f MB", $1/1024/1024}')
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_SIZE=$ZIP_SIZE" >> $GITHUB_ENV
          echo "ZIP_SHA256=$ZIP_SHA256" >> $GITHUB_ENV
          echo "VARIANT_INFO=$([ "$HAS_KSU" = true ] && echo "KSU" || echo "")$([ "$HAS_NOKSU" = true ] && ([ "$HAS_KSU" = true ] && echo "+NoKSU" || echo "NoKSU") || echo "")" >> $GITHUB_ENV
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "GKI Kernel - ${{ env.BUILD_DATE }}"
          body: |
            ## GKI Kernel for ${{ env.DEVICE }}
            **Build #${{ github.run_number }} • Android ${{ env.ANDROID_VERSION }}**
            
            ### Variants
            ${{ env.VARIANT_INFO }}
            
            ### Features
            - ✅ **Performance**: MGLRU, CC_OPTIMIZE_FOR_PERFORMANCE
            - ✅ **TCP**: Westwood (default) + BBR support
            - ✅ **Filesystem**: F2FS, OverlayFS, TMPFS with XATTR
            - ✅ **Memory**: ZRAM with LZ4 compression
            - ✅ **Optimized**: No debug, no tracing, no PSI
            - ✅ **Clean version**: Proper android13-8-gXXXXXXXX format
            ${{ env.VARIANT_INFO == 'KSU' || env.VARIANT_INFO == 'KSU+NoKSU' }}
            - ✅ **KSU Variant**: Wild-KSU + SUSFS + Baseband Guard
            ${{ env.VARIANT_INFO == 'NoKSU' || env.VARIANT_INFO == 'KSU+NoKSU' }}
            - ✅ **NoKSU Variant**: Stock GKI with optimizations
            
            ### Installation
            1. Download `${{ env.ZIP_NAME }}`
            2. Flash via TWRP/OrangeFox
            3. If AIO: Choose variant with volume keys
            4. Reboot
            
            ### Checksum
            ```
            SHA256: ${{ env.ZIP_SHA256 }}
            Size:   ${{ env.ZIP_SIZE }}
            ```
            
            ### Notes
            - Compatible: Redmi Note 13 4G/NFC
            - Android: 13-16 GKI devices
            - Kernel: 5.15
            - Always backup boot before flashing
          files: ${{ env.ZIP_NAME }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Send Telegram notification
        if: always()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ] && exit 0
          
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          if [ "${{ job.status }}" = "success" ]; then
            SHORT_SHA=$(echo "${{ env.ZIP_SHA256 }}" | cut -c1-16)
            
            MESSAGE="✅ <b>Build Success!</b>%0A%0A"
            MESSAGE="${MESSAGE}<b>File:</b> <code>${{ env.ZIP_NAME }}</code>%0A"
            MESSAGE="${MESSAGE}<b>Size:</b> ${{ env.ZIP_SIZE }}%0A"
            MESSAGE="${MESSAGE}<b>SHA256:</b> <code>$SHORT_SHA...</code>%0A"
            MESSAGE="${MESSAGE}<b>Download:</b> <a href='$RELEASE_URL'>Release</a>%0A"
            MESSAGE="${MESSAGE}<b>Maintainer:</b> @superuseryu%0A%0A"
            MESSAGE="${MESSAGE}#kernel #gki #wildksu #susfs"
          else
            MESSAGE="❌ <b>Build Failed!</b>%0A%0A"
            MESSAGE="${MESSAGE}<b>Time:</b> $(date +'%H:%M UTC')%0A"
            MESSAGE="${MESSAGE}<b>Logs:</b> <a href='$RUN_URL'>View</a>"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true || true
