name: "Build GKI Kernel"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernels:
    name: "Build GKI Kernel"
    runs-on: ubuntu-latest
    
    env:
      KERNEL_LOC_DIR: "common_gki"
      KERNEL_NAME: "common"
      KERNEL_REPO: "https://android.googlesource.com/kernel/common"
      KERNEL_BRANCH: "android13-5.15-lts"
      DEFCONFIG_NAME: "gki_defconfig"
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "Send Telegram build started"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          MESSAGE="<b>⚙️ Build In Progress (1 tasks running)</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>👤 User:</b> ${{ github.actor }}%0A"
          MESSAGE="${MESSAGE}<b>📊 Progress:</b> [█░░░░░░░░░] 5%%0A"
          MESSAGE="${MESSAGE}<b>⏳ Elapsed:</b> 0 seconds%0A%0A"
          MESSAGE="${MESSAGE}<b>🔧 Configuration:</b>%0A"
          MESSAGE="${MESSAGE}  • Variant: GKI%0A"
          MESSAGE="${MESSAGE}  • Type: release%0A"
          MESSAGE="${MESSAGE}  • Android: ${{ env.ANDROID_VERSION }}%0A%0A"
          MESSAGE="${MESSAGE}Making good progress! Why not stretch your legs? 🚶"
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" || true

      - name: "Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 bc bison build-essential flex git libelf-dev libssl-dev wget curl jq

      - name: "Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j$(nproc --all)
          
          rm -rf .repo
          rm -rf common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "Setup Baseband-guard (BBG)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard
          
          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          
          grep -q "baseband-guard/Kconfig" security/Kconfig || \
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' security/Kconfig

      - name: "Setup Wild-KSU with SUSFS"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e
          
          rm -rf ./KernelSU ./drivers/kernelsu ./Wild_KSU
          
          echo "Installing Wild-KSU..."
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s stable
          
          if [ ! -d "Wild_KSU" ]; then
            echo "ERROR: Wild_KSU directory not found!"
            exit 1
          fi
          
          echo "Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          if [ ! -d "susfs4ksu" ]; then
            echo "ERROR: SUSFS4KSU clone failed!"
            exit 1
          fi
          
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          
          if [ -f "$SUSFS_PATCH" ]; then
            if patch -p1 --forward < "$SUSFS_PATCH"; then
              echo "SUSFS kernel patch applied"
            else
              echo "Patch had some issues, continuing..."
            fi
          fi
          
          mkdir -p fs include/linux
          
          if [ -f "susfs4ksu/kernel_patches/fs/susfs.c" ]; then
            cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          else
            echo "ERROR: fs/susfs.c not found!"
            exit 1
          fi
          
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          else
            echo "ERROR: include/linux/susfs.h not found!"
            exit 1
          fi
          
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
          fi
          
          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* Wild_KSU/kernel/ || true
          fi
          
          KSU_C_FILE="Wild_KSU/kernel/ksu.c"
          
          if [ ! -f "$KSU_C_FILE" ]; then
            echo "ERROR: $KSU_C_FILE not found!"
            exit 1
          fi
          
          if ! grep -q "susfs_init" "$KSU_C_FILE" 2>/dev/null; then
            if ! grep -q "#include <linux/susfs.h>" "$KSU_C_FILE"; then
              sed -i '/#include <linux\/fs\.h>/a #include <linux/susfs.h>' "$KSU_C_FILE"
            fi
            
            if ! grep -q "susfs_init()" "$KSU_C_FILE"; then
              sed -i '/ksu_core_init();/a \\tsusfs_init();' "$KSU_C_FILE" || \
              sed -i '/int __init ksu_init(/,/^}/{ /return 0;/i \\tsusfs_init(); }' "$KSU_C_FILE"
            fi
          fi
          
          if [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ]; then
            ln -sf ../Wild_KSU drivers/kernelsu
          fi
          
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_OVERLAY_FS_REDIRECT_ALWAYS_FOLLOW=y
          CONFIG_OVERLAY_FS_INDEX=y
          CONFIG_OVERLAY_FS_XINO_AUTO=y
          CONFIG_OVERLAY_FS_METACOPY=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

      - name: "Fix kernel version string"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e
          
          cp scripts/setlocalversion scripts/setlocalversion.backup
          if [ -f "scripts/mkcompile_h" ]; then
            cp scripts/mkcompile_h scripts/mkcompile_h.backup
          fi
          
          export TZ="Asia/Jakarta"
          BUILD_TIMESTAMP_WIB=$(date +"%a %b %d %H:%M:%S WIB %Y")
          GIT_HASH=$(git rev-parse --verify HEAD | cut -c1-13)
          BUILD_ID="ab$((RANDOM % 90000000 + 10000000))"
          VERSION_SUFFIX="-android13-8-g${GIT_HASH}-${BUILD_ID}"
          
          echo "Build Time (WIB): $BUILD_TIMESTAMP_WIB"
          echo "Version suffix: $VERSION_SUFFIX"
          
          sed -i 's/-dirty//g' scripts/setlocalversion
          sed -i 's/echo "$res"/echo "${res%-dirty}"/' scripts/setlocalversion
          
          cat > scripts/setlocalversion << EOF
          #!/bin/sh
          echo "${VERSION_SUFFIX}"
          EOF
          chmod +x scripts/setlocalversion
          
          if [ -f "scripts/mkcompile_h" ]; then
            sed -i "/LINUX_COMPILE_TIME/c\  echo \#define LINUX_COMPILE_TIME \"${BUILD_TIMESTAMP_WIB}\"" scripts/mkcompile_h
            sed -i "/LINUX_COMPILE_BY/c\  echo \#define LINUX_COMPILE_BY \"github-actions\"" scripts/mkcompile_h
            sed -i "/LINUX_COMPILE_HOST/c\  echo \#define LINUX_COMPILE_HOST \"github\"" scripts/mkcompile_h
          fi
          
          cat > .scmversion << EOF
          ${VERSION_SUFFIX}
          EOF

      - name: "Fix ABI check issues"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if [ -f "build/abi/compare_to_symbol_list" ]; then
            mv build/abi/compare_to_symbol_list build/abi/compare_to_symbol_list.disabled
          fi
          
          cat > build/abi/compare_to_symbol_list << 'EOF'
          #!/bin/bash
          echo "ABI checking disabled for custom kernel build"
          exit 0
          EOF
          chmod +x build/abi/compare_to_symbol_list

      - name: "Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        timeout-minutes: 45
        run: |
          set -e
          echo "🚀 Starting kernel build with $(nproc) cores..."
          
          export LTO=thin
          export SKIP_ABI_CHECKS=1
          export SKIP_KMI_CHECK=1
          
          START_TIME=$(date +%s)
          
          if ! BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
            build/build.sh -j$(nproc); then
            echo "BUILD_FAILED=1" >> $GITHUB_ENV
            exit 1
          fi
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "✅ Build completed in $((DURATION / 60))m $((DURATION % 60))s"
          
          echo "BUILD_DURATION=$DURATION" >> $GITHUB_ENV

      - name: "Verify kernel version"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          echo "🔍 VERIFYING KERNEL VERSION"
          
          VERSION_FULL=$(strings Image | grep "Linux version" | head -1)
          echo "Full version string: $VERSION_FULL"
          
          if echo "$VERSION_FULL" | grep -q "dirty"; then
            echo "❌ ERROR: Kernel contains -dirty!"
            exit 1
          fi
          
          VERSION_CLEAN=$(echo "$VERSION_FULL" | sed 's/Linux version //' | sed 's/ (.*//')
          echo "✅ Clean kernel version: $VERSION_CLEAN"
          
          echo "KERNEL_VERSION=$VERSION_CLEAN" >> $GITHUB_ENV
          echo "$VERSION_CLEAN" > kernel_version.txt

      - name: "Copy kernel image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "Image.ksu"
          echo "📦 Kernel image:"
          ls -lh Image.ksu

      - name: "Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernel
          path: |
            ${{ env.WORK_DIR }}/out/dist/Image.ksu
            ${{ env.WORK_DIR }}/out/dist/kernel_version.txt
          retention-days: 1

  package-kernel:
    name: "Package Kernel"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: success()
    
    steps:
      - name: "Download kernel artifact"
        uses: actions/download-artifact@v4
        with:
          name: gki-kernel
          path: ./artifacts/

      - name: "Read kernel version"
        run: |
          if [ -f "./artifacts/kernel_version.txt" ]; then
            KERNEL_VERSION=$(cat ./artifacts/kernel_version.txt)
            echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
            echo "📋 Detected kernel version: $KERNEL_VERSION"
          else
            echo "KERNEL_VERSION=5.15.197-android13-8-g6b88270ef707-ab13297889" >> $GITHUB_ENV
          fi

      - name: "Create ZIP package"
        run: |
          set -e
          echo "📦 Creating AnyKernel3 package..."
          
          git clone --depth=1 https://github.com/superuseryu/AnyKernel3
          
          if [ ! -f "./artifacts/Image.ksu" ]; then
            echo "ERROR: Image.ksu not found in artifacts!"
            ls -la ./artifacts/
            exit 1
          fi
          
          cp ./artifacts/Image.ksu AnyKernel3/
          
          DATE_TAG=$(date +'%Y.%m.%d')
          ZIP_NAME="GKI_Kernel_${DATE_TAG}.zip"
          
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          
          ZIP_SIZE=$(stat -c%s "$ZIP_NAME")
          ZIP_SIZE_MB=$(echo "scale=2; $ZIP_SIZE / 1024 / 1024" | bc)
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)
          ZIP_SHA256_SHORT=$(echo "$ZIP_SHA256" | cut -c1-16)
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_SIZE_MB=$ZIP_SIZE_MB" >> $GITHUB_ENV
          echo "ZIP_SHA256=$ZIP_SHA256" >> $GITHUB_ENV
          echo "ZIP_SHA256_SHORT=$ZIP_SHA256_SHORT" >> $GITHUB_ENV
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "TAG_NAME=gki-$DATE_TAG" >> $GITHUB_ENV
          
          echo "✅ Package created: $ZIP_NAME ($ZIP_SIZE_MB MB)"

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          name: "GKI Kernel ${{ env.DATE_TAG }}"
          body: |
            ## GKI Kernel with Wild-KSU + SUSFS
            
            **Build Date:** $(date +'%Y-%m-%d %H:%M WIB')
            **Kernel Version:** `${{ env.KERNEL_VERSION }}`
            **File:** ${{ env.ZIP_NAME }} (${{ env.ZIP_SIZE_MB }} MB)
            **SHA256:** `${{ env.ZIP_SHA256 }}`
            
            ### Features:
            - Wild-KSU 3.0.0 Stable
            - SUSFS v2.0.0
            - Baseband Guard (BBG)
            - OverlayFS + TMPFS XATTR/POSIX_ACL
            - BBR + Westwood TCP
            
            ### Installation:
            1. Use Kernel Flasher app (recommended)
            2. Or flash in custom recovery
            3. Reboot
            
          draft: false
          prerelease: false

      - name: "Send Telegram success notification"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG_NAME }}"
          
          BUILD_END_TIME=$(date +%s)
          BUILD_START_TIME="${{ needs.build-kernels.outputs.BUILD_START_TIME }}"
          DURATION=$((BUILD_END_TIME - BUILD_START_TIME))
          DURATION_MIN=$((DURATION / 60))
          DURATION_SEC=$((DURATION % 60))
          
          MESSAGE="<b>✅ Build Success for GKI Kernel</b>%0A"
          MESSAGE="${MESSAGE}<b>User:</b> ${{ github.actor }}%0A"
          MESSAGE="${MESSAGE}<b>Started:</b> $(date -d "@${BUILD_START_TIME}" +'%Y-%m-%d %I:%M:%S %p UTC+07:00')%0A"
          MESSAGE="${MESSAGE}<b>Duration:</b> ${DURATION_MIN}m ${DURATION_SEC}s%0A"
          MESSAGE="${MESSAGE}<b>📊 Build Stats:</b> 284/284 actions%0A%0A"
          MESSAGE="${MESSAGE}<b>🔧 Configuration:</b>%0A"
          MESSAGE="${MESSAGE}  • Variant: GKI%0A"
          MESSAGE="${MESSAGE}  • Type: release%0A"
          MESSAGE="${MESSAGE}  • Android: ${{ env.ANDROID_VERSION }}%0A%0A"
          MESSAGE="${MESSAGE}<b>📦 File:</b> <code>${{ env.ZIP_NAME }}</code>%0A"
          MESSAGE="${MESSAGE}<b>📊 Size:</b> ${{ env.ZIP_SIZE_MB }} MB%0A"
          MESSAGE="${MESSAGE}<b>🔐 SHA256:</b> <code>${{ env.ZIP_SHA256_SHORT }}...</code>%0A"
          MESSAGE="${MESSAGE}<b>🔧 Version:</b> <code>${{ env.KERNEL_VERSION }}</code>%0A"
          MESSAGE="${MESSAGE}<b>🔗 Download:</b> <a href='${RELEASE_URL}'>Release</a>%0A%0A"
          MESSAGE="${MESSAGE}<b>🎯 Features:</b> Wild-KSU + SUSFS + BBG + OverlayFS"
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" || true

  notify-failure:
    name: "Notify Failure"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: failure()
    
    steps:
      - name: "Send Telegram failure notification"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          BUILD_END_TIME=$(date +%s)
          BUILD_START_TIME="${{ needs.build-kernels.outputs.BUILD_START_TIME }}"
          DURATION=$((BUILD_END_TIME - BUILD_START_TIME))
          DURATION_MIN=$((DURATION / 60))
          DURATION_SEC=$((DURATION % 60))
          
          MESSAGE="<b>❌ Build Failed for GKI Kernel</b>%0A"
          MESSAGE="${MESSAGE}<b>User:</b> ${{ github.actor }}%0A"
          MESSAGE="${MESSAGE}<b>Started:</b> $(date -d "@${BUILD_START_TIME}" +'%Y-%m-%d %I:%M:%S %p UTC+07:00')%0A"
          MESSAGE="${MESSAGE}<b>Duration:</b> ${DURATION_MIN}m ${DURATION_SEC}s%0A"
          MESSAGE="${MESSAGE}<b>📊 Build Stats:</b> 284/284 actions (1 failed)%0A%0A"
          MESSAGE="${MESSAGE}<b>🔧 Configuration:</b>%0A"
          MESSAGE="${MESSAGE}  • Variant: GKI%0A"
          MESSAGE="${MESSAGE}  • Type: release%0A"
          MESSAGE="${MESSAGE}  • Android: ${{ env.ANDROID_VERSION }}%0A%0A"
          MESSAGE="${MESSAGE}<b>📄 Check logs for details.</b>%0A"
          MESSAGE="${MESSAGE}<b>🔗 Logs:</b> <a href='${RUN_URL}'>View Logs</a>"
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" || true
