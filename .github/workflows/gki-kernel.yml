name: Build GKI Kernel - TCP ULTIMATE FIX

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        required: true
        default: 'ksu'
        type: choice
        options:
          - ksu
          - noksu
          - both
      tcp_algo:
        description: 'TCP Algorithm (use bbr if westwood fails)'
        required: true
        default: 'westwood_or_bbr'
        type: choice
        options:
          - westwood_or_bbr
          - bbr_only

permissions:
  contents: write

env:
  ANDROID_VERSION: android13
  KERNEL_VERSION: 5.15
  KERNEL_BRANCH: common-android13-5.15-lts
  DEVICE: sapphiren
  ANYKERNEL_REPO: https://github.com/superuseryu/AnyKernel3
  CCACHE_DIR: ~/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        variant: ${{ github.event.inputs.build_variant == 'both' && fromJSON('["ksu", "noksu"]') || fromJSON(format('["{0}"]', github.event.inputs.build_variant)) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean && sudo apt-get autoremove -y

      - name: Install minimal deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev make libelf-dev ccache rsync zip unzip curl git build-essential \
            libncurses-dev gawk wget diffutils > /dev/null

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.variant }}-${{ github.run_number }}
          restore-keys: ccache-${{ matrix.variant }}-
      
      - name: Initialize ccache
        run: |
          mkdir -p ~/.ccache
          ccache -M 2G
          ccache -z

      - name: Cache clang
        uses: actions/cache@v4
        id: clang-cache
        with:
          path: clang
          key: proton-clang-master
          
      - name: Setup clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xzf master.tar.gz -C clang --strip-components=1
          rm master.tar.gz
        
      - name: Verify clang
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          clang --version | head -1

      - name: Cache kernel source
        uses: actions/cache@v4
        id: kernel-cache
        with:
          path: |
            .repo
            common
            build
            prebuilts
          key: kernel-source-${{ env.KERNEL_BRANCH }}-${{ github.run_number }}
          restore-keys: kernel-source-${{ env.KERNEL_BRANCH }}-

      - name: Initialize kernel source
        run: |
          if [ "${{ steps.kernel-cache.outputs.cache-hit }}" != "true" ]; then
            curl -o repo https://storage.googleapis.com/git-repo-downloads/repo
            chmod +x repo
            ./repo init -u https://android.googlesource.com/kernel/manifest -b ${KERNEL_BRANCH} --depth=1
            ./repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
          else
            curl -o repo https://storage.googleapis.com/git-repo-downloads/repo
            chmod +x repo
            ./repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync 2>/dev/null || true
          fi

      - name: Check & Port TCP Westwood
        id: tcp_check
        run: |
          echo "=== Checking TCP Westwood availability ==="
          
          if [ -f "common/net/ipv4/tcp_westwood.c" ]; then
            echo "✅ TCP Westwood source EXISTS!"
            echo "has_westwood=true" >> $GITHUB_OUTPUT
            echo "tcp_algo=westwood" >> $GITHUB_OUTPUT
          else
            echo "❌ TCP Westwood source NOT FOUND in GKI!"
            
            if [ "${{ github.event.inputs.tcp_algo }}" == "westwood_or_bbr" ]; then
              echo "Attempting to port Westwood from mainline kernel..."
              
              # Clone mainline kernel 5.15
              git clone --depth=1 --branch v5.15 https://github.com/torvalds/linux.git mainline_tmp
              
              if [ -f "mainline_tmp/net/ipv4/tcp_westwood.c" ]; then
                echo "✅ Found Westwood in mainline, porting..."
                
                # Copy source file
                cp mainline_tmp/net/ipv4/tcp_westwood.c common/net/ipv4/
                
                # Add to Makefile if not present
                if ! grep -q "tcp_westwood" common/net/ipv4/Makefile; then
                  echo 'obj-$(CONFIG_TCP_CONG_WESTWOOD) += tcp_westwood.o' >> common/net/ipv4/Makefile
                fi
                
                # Add to Kconfig if not present
                if ! grep -q "TCP_CONG_WESTWOOD" common/net/ipv4/Kconfig; then
                  cat >> common/net/ipv4/Kconfig << 'KCONFIG_EOF'
                  config TCP_CONG_WESTWOOD
                  tristate "TCP Westwood+"
                  default m
                  help
                  TCP Westwood+ is a sender-side only modification of the TCP Reno
                  protocol stack that optimizes the performance of TCP congestion
                  control. It is based on end-to-end bandwidth estimation to set
                  congestion window and slow start threshold after a congestion
                  episode. Using this estimation, TCP Westwood+ adaptively sets a
                  slow start threshold and a congestion window which takes into
                  account the bandwidth used at the time congestion is experienced.
                  See http://c3lab.poliba.it/index.php/Westwood for more detail.
                  KCONFIG_EOF
                fi
                
                rm -rf mainline_tmp
                echo "✅ Westwood ported successfully!"
                echo "has_westwood=true" >> $GITHUB_OUTPUT
                echo "tcp_algo=westwood" >> $GITHUB_OUTPUT
              else
                echo "⚠️ Mainline also doesn't have Westwood, falling back to BBR"
                rm -rf mainline_tmp
                echo "has_westwood=false" >> $GITHUB_OUTPUT
                echo "tcp_algo=bbr" >> $GITHUB_OUTPUT
              fi
            else
              echo "User chose BBR only mode"
              echo "has_westwood=false" >> $GITHUB_OUTPUT
              echo "tcp_algo=bbr" >> $GITHUB_OUTPUT
            fi
          fi
          
          echo ""
          echo "=== Final TCP algorithm: $tcp_algo ==="

      - name: Setup Wild KernelSU
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          curl -LSs https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh | bash -s stable
          if [ -d "Wild_KSU" ]; then
            ln -sf Wild_KSU drivers/kernelsu
          elif [ -d "../Wild_KSU" ]; then
            ln -sf ../Wild_KSU drivers/kernelsu
          else
            echo "Error: Wild_KSU not found"
            exit 1
          fi

      - name: Apply SUSFS
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          git clone -q --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          [ -f "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" ] && \
            patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch 2>/dev/null || true
          [ -f "susfs4ksu/kernel_patches/fs/susfs.c" ] && cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          ls susfs4ksu/kernel_patches/include/linux/susfs*.h 2>/dev/null && \
            cp susfs4ksu/kernel_patches/include/linux/susfs*.h include/linux/
          if [ -f "Wild_KSU/kernel/ksu.c" ]; then
            grep -q "susfs.h" Wild_KSU/kernel/ksu.c || \
              sed -i '/#include <linux\/fs.h>/a #include <linux/susfs.h>' Wild_KSU/kernel/ksu.c
            grep -q "susfs_init" Wild_KSU/kernel/ksu.c || \
              sed -i '/ksu_core_init();/a \\tsusfs_init();' Wild_KSU/kernel/ksu.c
          fi
          rm -rf susfs4ksu

      - name: Remove debug printk
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          find Wild_KSU/ -type f \( -name "*.c" -o -name "*.h" \) \
            -exec sed -i 's/trace_printk/pr_debug/g' {} + 2>/dev/null || true

      - name: Apply Baseband Guard
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard
          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          grep -q "baseband-guard/Kconfig" security/Kconfig || \
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' security/Kconfig

      - name: Setup kernel version
        run: touch common/.scmversion

      - name: Clean git tree
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          git config --global user.email "build@github.com"
          git config --global user.name "GitHub Actions"
          git add -A 2>/dev/null || true
          git diff-index --quiet HEAD || git commit -m "Build: Apply modifications" --no-verify 2>/dev/null || true

      - name: Kernel config (KSU variant)
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang gki_defconfig
          
          ./scripts/config --file out/.config -e KSU -e KSU_SUSFS
          make O=out ARCH=arm64 CC=clang olddefconfig
          
          # === TCP Configuration based on availability ===
          TCP_ALGO="${{ steps.tcp_check.outputs.tcp_algo }}"
          
          echo "Configuring TCP: $TCP_ALGO"
          
          ./scripts/config --file out/.config \
            -e INET \
            -e TCP_CONG_ADVANCED \
            -e TCP_CONG_BBR
          
          if [ "$TCP_ALGO" == "westwood" ]; then
            echo "Enabling Westwood..."
            ./scripts/config --file out/.config \
              -e TCP_CONG_WESTWOOD \
              -d TCP_CONG_CUBIC \
              -d DEFAULT_CUBIC \
              -d DEFAULT_BBR \
              -e DEFAULT_WESTWOOD \
              --set-str DEFAULT_TCP_CONG "westwood"
            
            # Force with sed
            make O=out ARCH=arm64 CC=clang olddefconfig
            sed -i '/# CONFIG_TCP_CONG_WESTWOOD is not set/d' out/.config
            grep -q "^CONFIG_TCP_CONG_WESTWOOD=" out/.config || echo "CONFIG_TCP_CONG_WESTWOOD=y" >> out/.config
            sed -i 's/^CONFIG_TCP_CONG_WESTWOOD=.*/CONFIG_TCP_CONG_WESTWOOD=y/' out/.config
            grep -q "^CONFIG_DEFAULT_WESTWOOD=" out/.config || echo "CONFIG_DEFAULT_WESTWOOD=y" >> out/.config
            sed -i 's/^CONFIG_DEFAULT_TCP_CONG=.*/CONFIG_DEFAULT_TCP_CONG="westwood"/' out/.config
          else
            echo "Using BBR (Westwood not available)"
            ./scripts/config --file out/.config \
              -d TCP_CONG_CUBIC \
              -d DEFAULT_CUBIC \
              -e DEFAULT_BBR \
              --set-str DEFAULT_TCP_CONG "bbr"
          fi
          
          # Other configs
          ./scripts/config --file out/.config \
            -e OVERLAY_FS -e CC_OPTIMIZE_FOR_PERFORMANCE \
            -e F2FS_FS -e LRU_GEN -e LRU_GEN_ENABLED \
            -e ZRAM -e ZRAM_DEF_COMP_LZ4 --set-val ZRAM_DEF_COMP "lz4" \
            -d PSI -d DEBUG_KERNEL -d TRACING_SUPPORT -d FTRACE \
            -e BBG || true
          
          current_lsm=$(grep "^CONFIG_LSM=" out/.config | cut -d'"' -f2 || echo "")
          [ -n "$current_lsm" ] && ./scripts/config --file out/.config --set-str LSM "${current_lsm},baseband_guard"
          
          ./scripts/config --file out/.config --set-str LOCALVERSION "-android13-8-00005-gb4287516c23f-ab12345678"
          
          make O=out ARCH=arm64 CC=clang olddefconfig
          sed -i 's/^CONFIG_PSI=y/# CONFIG_PSI is not set/' out/.config

      - name: Kernel config (NoKSU variant)
        if: matrix.variant == 'noksu'
        working-directory: common
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang gki_defconfig
          
          TCP_ALGO="${{ steps.tcp_check.outputs.tcp_algo }}"
          
          ./scripts/config --file out/.config \
            -e INET -e TCP_CONG_ADVANCED -e TCP_CONG_BBR
          
          if [ "$TCP_ALGO" == "westwood" ]; then
            ./scripts/config --file out/.config \
              -e TCP_CONG_WESTWOOD -d TCP_CONG_CUBIC \
              -e DEFAULT_WESTWOOD --set-str DEFAULT_TCP_CONG "westwood"
            make O=out ARCH=arm64 CC=clang olddefconfig
            sed -i '/# CONFIG_TCP_CONG_WESTWOOD is not set/d' out/.config
            grep -q "^CONFIG_TCP_CONG_WESTWOOD=" out/.config || echo "CONFIG_TCP_CONG_WESTWOOD=y" >> out/.config
          else
            ./scripts/config --file out/.config \
              -e DEFAULT_BBR --set-str DEFAULT_TCP_CONG "bbr"
          fi
          
          ./scripts/config --file out/.config \
            -e OVERLAY_FS -e F2FS_FS -e LRU_GEN -e ZRAM \
            -d PSI -d DEBUG_KERNEL -d TRACING_SUPPORT
          
          make O=out ARCH=arm64 CC=clang olddefconfig

      - name: Verify config
        working-directory: common
        run: |
          echo "=== TCP Config Verification ==="
          grep "TCP_CONG" out/.config | grep -v "^#" || echo "No TCP configs!"
          grep "DEFAULT.*TCP" out/.config | grep -v "^#" || echo "No default!"

      - name: Build kernel
        run: |
          export CCACHE_COMPRESS=1 CCACHE_MAXSIZE=2G USE_CCACHE=1
          export KBUILD_BUILD_USER=yu KBUILD_BUILD_HOST=github
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          
          ccache -s
          BUILD_CONFIG=common/build.config.gki.aarch64 LTO=thin SKIP_MRPROPER=1 \
            build/build.sh -j$(nproc --all)
          ccache -s

      - name: Verify build
        run: |
          [ ! -f "out/android13-5.15/dist/Image" ] && exit 1
          echo "✓ Build successful: $(du -h out/android13-5.15/dist/Image | cut -f1)"
          
          echo "=== TCP in binary ==="
          TCP_ALGO="${{ steps.tcp_check.outputs.tcp_algo }}"
          if strings out/android13-5.15/dist/Image | grep -i "$TCP_ALGO"; then
            echo "✅ $TCP_ALGO found in binary!"
          else
            echo "⚠️ $TCP_ALGO string not found (might be OK for some algos)"
          fi

      - name: Package AnyKernel3
        run: |
          git clone -q --depth=1 $ANYKERNEL_REPO ak3
          cp out/android13-5.15/dist/Image ak3/
          cd ak3
          VARIANT_SUFFIX=""
          [ "${{ matrix.variant }}" == "noksu" ] && VARIANT_SUFFIX="-noksu"
          TCP_ALGO="${{ steps.tcp_check.outputs.tcp_algo }}"
          zip -q -r9 ../GKI-${DEVICE}-A13-${TCP_ALGO}${VARIANT_SUFFIX}-$(date +%Y%m%d).zip * -x .git\* -x README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-${{ env.DEVICE }}-${{ matrix.variant }}-${{ steps.tcp_check.outputs.tcp_algo }}-${{ github.run_number }}
          path: GKI-*.zip
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Get build info
        id: info
        run: |
          echo "date=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "tag=v${{ github.run_number }}-$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release
        run: |
          mkdir -p release_files
          find artifacts -name "*.zip" -exec cp {} release_files/ \;
          ls -lh release_files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: GKI Kernel - Build #${{ github.run_number }}
          body: |
            ## GKI Kernel for Redmi Note 13 4G/NFC
            **Build #${{ github.run_number }}** - ${{ steps.info.outputs.date }}
            
            ### TCP Algorithm
            - Auto-detected and configured (Westwood if available, BBR fallback)
            
            ### Features
            - Wild-KSU + SUSFS (KSU variant)
            - MGLRU, F2FS, ZRAM optimizations
            - All debug features disabled
            
            Flash via TWRP/OrangeFox recovery
          files: release_files/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
