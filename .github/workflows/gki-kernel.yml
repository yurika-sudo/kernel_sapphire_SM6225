name: Build GKI Kernel

env:
  ANDROID_VERSION: 13
  KERNEL_VERSION: 5.15

on:
  workflow_dispatch:

jobs:
  build-kernels:
    name: "Build GKI Kernel"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ["ksu", "noksu"]

    env:
      WORK_DIR: ${{ github.workspace }}
      KERNEL_DIR: "kernel-${{ matrix.variant }}"
      OUTPUT_NAME: "Image.${{ matrix.variant }}"

    steps:
      - name: "Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_DIR }}
          sudo apt-get update -qq
          sudo apt-get install -y bc bison flex libssl-dev make libelf-dev \
            rsync zip unzip curl git build-essential libncurses-dev \
            gawk wget diffutils

      - name: "Clone kernel source"
        working-directory: ./${{ env.KERNEL_DIR }}
        run: |
          git clone https://android.googlesource.com/kernel/common \
            --branch android13-5.15-lts --depth=1

      - name: "Setup clang"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          mkdir -p clang
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xzf master.tar.gz -C clang --strip-components=1
          rm master.tar.gz
          echo "✓ Clang ready"

      - name: "Setup Wild-KSU"
        if: matrix.variant == 'ksu'
        working-directory: ./${{ env.KERNEL_DIR }}/common
        run: |
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s stable
          
          if [ -d "Wild_KSU" ]; then
            ln -sf Wild_KSU drivers/kernelsu
            echo "✓ Wild-KSU installed"
          else
            echo "Error: Wild_KSU not found"
            exit 1
          fi

      - name: "Setup SUSFS"
        if: matrix.variant == 'ksu'
        working-directory: ./${{ env.KERNEL_DIR }}/common
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          # Copy SUSFS files
          [ -f "susfs4ksu/kernel_patches/fs/susfs.c" ] && \
            cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          
          ls susfs4ksu/kernel_patches/include/linux/susfs*.h 2>/dev/null && \
            cp susfs4ksu/kernel_patches/include/linux/susfs*.h include/linux/
          
          # Integrate with KSU
          if [ -f "Wild_KSU/kernel/ksu.c" ]; then
            grep -q "susfs.h" Wild_KSU/kernel/ksu.c || \
              sed -i '/#include <linux\/fs.h>/a #include <linux/susfs.h>' Wild_KSU/kernel/ksu.c
            grep -q "susfs_init" Wild_KSU/kernel/ksu.c || \
              sed -i '/ksu_core_init();/a \\tsusfs_init();' Wild_KSU/kernel/ksu.c
          fi
          
          rm -rf susfs4ksu
          echo "✓ SUSFS integrated"

      - name: "Setup Baseband Guard"
        if: matrix.variant == 'ksu'
        working-directory: ./${{ env.KERNEL_DIR }}/common
        run: |
          git clone --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard
          
          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          
          grep -q "baseband-guard/Kconfig" security/Kconfig || \
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' security/Kconfig
          
          echo "✓ Baseband Guard installed"

      - name: "Configure kernel (YASK style)"
        working-directory: ./${{ env.KERNEL_DIR }}/common
        run: |
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          
          echo "=== Adding configs to $CONFIG_FILE ==="
          
          # Clean up any previous additions
          sed -i '/^# Custom configs - START/,/^# Custom configs - END/d' "$CONFIG_FILE"
          
          # Add configs at the end of file
          echo "" >> "$CONFIG_FILE"
          echo "# Custom configs - START" >> "$CONFIG_FILE"
          
          # KSU configs (only for ksu variant)
          if [ "${{ matrix.variant }}" == "ksu" ]; then
            cat >> "$CONFIG_FILE" << 'EOF'
            CONFIG_KSU=y
            CONFIG_KPROBES=y
            CONFIG_HAVE_KPROBES=y
            CONFIG_KPROBE_EVENTS=y
            CONFIG_KSU_SUSFS=y
            CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
            CONFIG_KSU_SUSFS_SUS_PATH=y
            CONFIG_KSU_SUSFS_SUS_MOUNT=y
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
            CONFIG_KSU_SUSFS_SUS_KSTAT=y
            CONFIG_KSU_SUSFS_TRY_UMOUNT=y
            CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y
            CONFIG_KSU_SUSFS_ENABLE_LOG=y
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
            CONFIG_KSU_SUSFS_SUS_SU=y
            CONFIG_BBG=y
            EOF
            fi
          
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF
          
          echo "# Custom configs - END" >> "$CONFIG_FILE"
          
          echo "=== Added configs to $CONFIG_FILE ==="
          
          # Show what we added
          tail -30 "$CONFIG_FILE"

      - name: "Initialize AOSP build environment"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Download repo tool
          curl -o repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x repo
          
          # Initialize minimal manifest
          ./repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android13-5.15-lts --depth=1
          
          # Clean up existing directories
          rm -rf .repo
          rm -rf common
          
          echo "✓ Build environment ready"

      - name: "Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          export PATH="${{ env.WORK_DIR }}/clang/bin:$PATH"
          
          # Disable defconfig check
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' \
            ${{ env.KERNEL_DIR }}/common/build.config.gki.aarch64 2>/dev/null || true
          
          echo "=== Building ${{ matrix.variant }} variant ==="
          
          LTO=thin \
          BUILD_CONFIG=${{ env.KERNEL_DIR }}/common/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all) || {
            echo "Build failed"
            exit 1
          }
          
          echo "✓ Build completed"

      - name: "Copy kernel image"
        run: |
          cp ${{ env.WORK_DIR }}/out/android13-5.15/dist/Image \
             ${{ env.WORK_DIR }}/${{ env.OUTPUT_NAME }}
          echo "✓ Image saved as ${{ env.OUTPUT_NAME }}"

      - name: "Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: ${{ env.WORK_DIR }}/${{ env.OUTPUT_NAME }}
          retention-days: 1

  package-kernels:
    name: "Package Kernels"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    steps:
      - name: "Download kernel artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "Extract kernel versions"
        id: versions
        run: |
          # Get kernel version from one of the images
          KSU_VERSION=$(strings artifacts/kernel-ksu/Image.ksu 2>/dev/null | grep "Linux version" | head -1 | cut -d' ' -f3 || echo "unknown")
          NOKSU_VERSION=$(strings artifacts/kernel-noksu/Image.noksu 2>/dev/null | grep "Linux version" | head -1 | cut -d' ' -f3 || echo "unknown")
          
          echo "KSU version: $KSU_VERSION"
          echo "NoKSU version: $NOKSU_VERSION"
          
          echo "ksu_version=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "noksu_version=$NOKSU_VERSION" >> $GITHUB_OUTPUT

      - name: "Create AnyKernel3 package"
        run: |
          set -e
          
          # Clone AnyKernel3
          git clone --depth=1 https://github.com/superuseryu/AnyKernel3 ak3
          
          # Copy kernel images
          cp artifacts/kernel-ksu/Image.ksu ak3/
          cp artifacts/kernel-noksu/Image.noksu ak3/
          
          # Create anykernel.sh
          cat > ak3/anykernel.sh << 'EOF'
          #!/system/bin/sh
          # AnyKernel3 script
          
          ## AnyKernel setup
          block=/dev/block/by-name/boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          
          ## AnyKernel methods (DO NOT CHANGE)
          . tools/ak3-core.sh;
          
          # Select appropriate image based on variant
          if [ -f "$home/Image.ksu" ]; then
            ui_print "Installing KSU variant...";
            mv $home/Image.ksu $home/Image;
          elif [ -f "$home/Image.noksu" ]; then
            ui_print "Installing NoKSU variant...";
            mv $home/Image.noksu $home/Image;
          else
            abort "No kernel image found!";
          fi
          
          # Flash kernel
          split_boot;
          flash_boot;
          ## end install
          EOF
          
          # Create ZIP
          cd ak3
          ZIP_NAME="GKI-Kernel-Both-$(date +'%Y%m%d').zip"
          zip -r9 "../$ZIP_NAME" * -x .git\* -x README.md
          cd ..
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "✓ Package created: $ZIP_NAME"

      - name: "Create Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: "gki-kernel-$(date +'%Y%m%d')"
          name: "GKI Kernel $(date +'%Y%m%d')"
          body: |
            ## GKI Kernel Build
            
            **Build Date:** $(date +'%Y-%m-%d')
            
            ### Variants Included:
            - **KSU variant:** ${{ steps.versions.outputs.ksu_version }}
            - **NoKSU variant:** ${{ steps.versions.outputs.noksu_version }}
            
            ### Installation:
            1. Flash in TWRP/OrangeFox recovery
            2. Choose variant in AROMA (if available)
            3. Reboot system
            
            ### Notes:
            - Android 13 GKI devices only
            - Unlocked bootloader required
            - Tested on Redmi Note 13 4G/NFC
