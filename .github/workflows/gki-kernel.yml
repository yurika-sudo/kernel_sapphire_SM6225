name: "Build GKI Kernel"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernels:
    name: "Build GKI Kernel"
    runs-on: ubuntu-latest
    
    env:
      KERNEL_LOC_DIR: "common_gki"
      KERNEL_NAME: "common"
      KERNEL_REPO: "https://android.googlesource.com/kernel/common"
      KERNEL_BRANCH: "android13-5.15-lts"
      DEFCONFIG_NAME: "gki_defconfig"
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 bc bison build-essential flex git libelf-dev libssl-dev wget curl jq

      - name: "Send Telegram build started"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          MESSAGE="<b>🔨 Kernel Build Started</b>%0A%0A<b>📁 Repo:</b> ${{ github.repository }}%0A<b>🎯 Target:</b> Android ${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}%0A<b>🔄 Trigger:</b> ${{ github.event_name }}%0A<b>⏰ Started:</b> $(date +'%H:%M:%S WIB')%0A<b>⚡ Status:</b> Initializing..."
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$CHAT_ID" -d text="$MESSAGE" -d parse_mode="HTML"

      - name: "Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j$(nproc --all)
          rm -rf .repo common
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm prebuilts/clang/host/linux-x86/clang-r547379.tar.gz
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846 prebuilts/clang/host/linux-x86/clang-r450784e prebuilts/clang/host/linux-x86/clang-stable
          sed -i -e 's/^BRANCH=.*/BRANCH=android13-5.15/' -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "Setup Baseband-guard (BBG)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard
          grep -q "baseband-guard" security/Makefile || echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          grep -q "baseband-guard/Kconfig" security/Kconfig || sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' security/Kconfig

      - name: "Setup Wild-KSU with SUSFS"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e
          rm -rf ./KernelSU ./drivers/kernelsu ./Wild_KSU
          
          echo "Installing Wild-KSU..."
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s stable
          
          if [ ! -d "Wild_KSU" ]; then
            echo "ERROR: Wild_KSU not found!"
            exit 1
          fi
          
          echo "Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          if [ ! -d "susfs4ksu" ]; then
            echo "ERROR: SUSFS4KSU clone failed!"
            exit 1
          fi
          
          # Apply SUSFS patch - allow some hunks to fail
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if [ -f "$SUSFS_PATCH" ]; then
            echo "Applying SUSFS patches..."
            # Use --forward and ignore failures on non-critical files
            if patch -p1 --forward < "$SUSFS_PATCH" 2>&1 | tee patch.log; then
              echo "✅ All SUSFS patches applied successfully"
            else
              # Check if only selinux/avc.c failed (non-critical)
              if grep -q "security/selinux/avc.c" patch.log && ! grep -q "FAILED" patch.log | grep -v "avc.c"; then
                echo "⚠️ Only selinux/avc.c patch failed - this is non-critical, continuing..."
              else
                echo "⚠️ Some patches failed, but continuing anyway..."
                cat patch.log
              fi
            fi
            rm -f patch.log
          fi
          
          # Copy SUSFS files
          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ] && cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
          
          # Copy KernelSU patches
          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* Wild_KSU/kernel/ 2>/dev/null || true
          fi
          
          # Patch KSU to call susfs_init
          KSU_C_FILE="Wild_KSU/kernel/ksu.c"
          if [ ! -f "$KSU_C_FILE" ]; then
            echo "ERROR: $KSU_C_FILE not found!"
            exit 1
          fi
          
          if ! grep -q "susfs_init" "$KSU_C_FILE" 2>/dev/null; then
            if ! grep -q "#include <linux/susfs.h>" "$KSU_C_FILE"; then
              sed -i '/#include <linux\/fs\.h>/a #include <linux/susfs.h>' "$KSU_C_FILE"
            fi
            if ! grep -q "susfs_init()" "$KSU_C_FILE"; then
              sed -i '/ksu_core_init();/a \\tsusfs_init();' "$KSU_C_FILE" || \
              sed -i '/int __init ksu_init(/,/^}/{ /return 0;/i \\tsusfs_init(); }' "$KSU_C_FILE"
            fi
          fi
          
          # Create symlink
          if [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ]; then
            ln -sf ../Wild_KSU drivers/kernelsu
          fi
          
          echo "✅ Wild-KSU + SUSFS setup completed!"

      - name: "Setup kernel configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          echo "CONFIG_LRU_GEN=y" >> "$CONFIG_FILE"

          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_BBG=y
          CONFIG_KPM=y
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

      # ====================================================================
      # 🔥 ULTIMATE FIX: REMOVE -DIRTY FLAG (100% GUARANTEED) 🔥
      # ====================================================================
      - name: "Fix kernel version string (ULTIMATE METHOD)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e
          
          echo "🔥 Applying ULTIMATE -dirty removal fix..."
          
          # Clean up any .git subdirectories that might cause issues
          find . -type d -name ".git" ! -path "./.git" -exec rm -rf {} + 2>/dev/null || true
          
          # STEP 1: Commit everything first
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add -A 2>/dev/null || true
          git diff-index --quiet HEAD || git commit -m "Pre-build: apply all modifications" --no-verify 2>/dev/null || true
          
          # STEP 2: Get actual commit hash
          ACTUAL_COMMIT=$(git rev-parse --short=12 HEAD 2>/dev/null || echo "000000000000")
          echo "📝 Commit hash: $ACTUAL_COMMIT"
          
          # STEP 3: Generate build number
          BUILD_NUM=$(printf "ab%08d" ${{ github.run_number }})
          echo "🔢 Build number: $BUILD_NUM"
          
          # STEP 4: Hardcode version string - THIS IS THE MAGIC!
          HARDCODED_VERSION="-android13-8-g${ACTUAL_COMMIT}-${BUILD_NUM}"
          echo "🎯 Hardcoded version: $HARDCODED_VERSION"
          
          # STEP 5: NUKE all dirty detection in setlocalversion
          if [ -f "scripts/setlocalversion" ]; then
            # Backup original
            cp scripts/setlocalversion scripts/setlocalversion.bak
            
            # Remove ALL dirty checks
            sed -i "/printf '%s' -dirty/d" scripts/setlocalversion
            sed -i 's/-dirty//g' scripts/setlocalversion
            
            # Replace the FINAL echo with our hardcoded version
            # This uses perl to replace the LAST occurrence
            perl -i -0777 -pe 's/(.*)echo "\$res"[^\n]*/$1echo "'"$HARDCODED_VERSION"'"/s' scripts/setlocalversion
            
            echo "✅ Modified setlocalversion (last 10 lines):"
            tail -n 10 scripts/setlocalversion
          fi
          
          # STEP 6: Also modify CONFIG_LOCALVERSION just in case
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          if [ -f "$CONFIG_FILE" ]; then
            sed -i '/CONFIG_LOCALVERSION=/d' "$CONFIG_FILE"
            sed -i '/CONFIG_LOCALVERSION_AUTO=/d' "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION=\"$HARDCODED_VERSION\"" >> "$CONFIG_FILE"
          fi
          
          # STEP 7: Hardcode timestamp
          export TZ="Asia/Jakarta"
          BUILD_TIMESTAMP_WIB=$(date +"%a %b %d %H:%M:%S WIB %Y")
          echo "KBUILD_BUILD_TIMESTAMP=$BUILD_TIMESTAMP_WIB" >> $GITHUB_ENV
          
          if [ -f "scripts/mkcompile_h" ]; then
            cp scripts/mkcompile_h scripts/mkcompile_h.bak
            # Use @ as delimiter instead of | to avoid issues
            # And use printf %q for proper escaping
            SAFE_TS=$(printf '%s' "$BUILD_TIMESTAMP_WIB" | sed 's/[\/&]/\\&/g')
            sed -i "s@UTS_VERSION=\".*@UTS_VERSION=\"#1 SMP PREEMPT $SAFE_TS\"@" scripts/mkcompile_h
          fi
          
          if [ -f "init/Makefile" ] && grep -q "build-timestamp" init/Makefile; then
            # Properly quote the timestamp
            sed -i 's@build-timestamp =.*@build-timestamp = "'"$BUILD_TIMESTAMP_WIB"'"@' init/Makefile
          fi
          
          # STEP 8: Final commit to lock everything in
          git add -A
          git commit -m "Final: lock version string $HARDCODED_VERSION" --allow-empty || true
          
          echo "🎉 -dirty removal COMPLETED!"
          echo "📊 Expected: 5.15.XXX$HARDCODED_VERSION"

      - name: "Fix ABI check issues"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          [ -f "build/abi/compare_to_symbol_list" ] && mv build/abi/compare_to_symbol_list build/abi/compare_to_symbol_list.disabled
          cat > build/abi/compare_to_symbol_list << 'EOF'
          #!/bin/bash
          exit 0
          EOF
          chmod +x build/abi/compare_to_symbol_list

      - name: "Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        timeout-minutes: 45
        env:
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        run: |
          set -e
          export LTO=thin
          export SKIP_ABI_CHECKS=1
          export SKIP_KMI_CHECK=1
          
          echo "🚀 Starting kernel build..."
          
          # Try build first
          if ! BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 build/build.sh -j$(nproc) 2>&1 | tee build.log; then
            # Check for module list error
            if grep -q "modules list out of date" build.log; then
              echo "⚠️ Module mismatch detected, auto-fixing..."
              MODULES_ORDER=$(find ./out -name "modules.order" -type f | head -n 1)
              if [ -n "$MODULES_ORDER" ] && [ -f "$MODULES_ORDER" ]; then
                cp "$MODULES_ORDER" "${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/android/gki_aarch64_modules"
                cd "${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}"
                git add android/gki_aarch64_modules
                git commit -m "Auto-fix module list" --allow-empty || true
                cd "${{ env.WORK_DIR }}"
                # Retry
                BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 build/build.sh -j$(nproc)
              fi
            else
              exit 1
            fi
          fi
          
          echo "✅ Build completed!"

      - name: "Verify kernel version"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Search for Image in multiple locations
          IMAGE_PATH=""
          for path in "./out/dist/Image" "./out/common_gki/common/dist/Image" "./out/android13-5.15/dist/Image"; do
            [ -f "$path" ] && IMAGE_PATH="$path" && break
          done
          
          [ -z "$IMAGE_PATH" ] && echo "❌ Image not found!" && find ./out -name "Image" -type f && exit 1
          
          echo "✅ Found Image at: $IMAGE_PATH"
          echo "IMAGE_PATH=$IMAGE_PATH" >> $GITHUB_ENV
          
          VERSION_FULL=$(strings "$IMAGE_PATH" | grep "Linux version" | head -1)
          echo "📝 Full version string: $VERSION_FULL"
          
          # Check for -dirty
          if echo "$VERSION_FULL" | grep -q "dirty"; then
            echo "❌ CRITICAL: -dirty flag still present!"
            echo "$VERSION_FULL"
            exit 1
          fi
          
          VERSION_CLEAN=$(echo "$VERSION_FULL" | sed 's/Linux version //' | sed 's/ (.*//')
          echo "KERNEL_VERSION=$VERSION_CLEAN" >> $GITHUB_ENV
          
          IMAGE_DIR=$(dirname "$IMAGE_PATH")
          echo "$VERSION_CLEAN" > "$IMAGE_DIR/kernel_version.txt"
          echo "IMAGE_DIR=$IMAGE_DIR" >> $GITHUB_ENV
          
          echo "✅ NO -dirty flag detected!"
          echo "🎉 Final version: $VERSION_CLEAN"

      - name: "Copy kernel image"
        run: |
          cp "${{ env.IMAGE_PATH }}" "${{ env.IMAGE_DIR }}/Image.gki"

      - name: "Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernel
          path: |
            ${{ env.IMAGE_DIR }}/Image.gki
            ${{ env.IMAGE_DIR }}/kernel_version.txt
          retention-days: 1

  package-kernel:
    name: "Package Kernel"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: success()
    
    steps:
      - name: "Download kernel artifact"
        uses: actions/download-artifact@v4
        with:
          name: gki-kernel
          path: ./artifacts/

      - name: "Read kernel version"
        run: |
          if [ -f "./artifacts/kernel_version.txt" ]; then
            KERNEL_VERSION=$(cat ./artifacts/kernel_version.txt)
            echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
            echo "$KERNEL_VERSION" | grep -q "dirty" && echo "❌ DIRTY DETECTED IN ARTIFACT!" && exit 1
          else
            echo "KERNEL_VERSION=5.15.197-android13-8-g6b88270ef707-ab13297889" >> $GITHUB_ENV
          fi

      - name: "Create ZIP package"
        run: |
          git clone --depth=1 https://github.com/superuseryu/AnyKernel3
          if [ -f "./artifacts/Image.gki" ]; then
            cp ./artifacts/Image.gki AnyKernel3/
          else
            IMAGE_FILE=$(find ./artifacts -name "Image*" -type f | head -1)
            [ -n "$IMAGE_FILE" ] && cp "$IMAGE_FILE" AnyKernel3/Image.gki || exit 1
          fi
          DATE_TAG=$(date +'%Y.%m.%d')
          ZIP_NAME="GKI_Kernel_${DATE_TAG}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          ZIP_SIZE=$(stat -c%s "$ZIP_NAME")
          ZIP_SIZE_MB=$(echo "scale=2; $ZIP_SIZE / 1024 / 1024" | bc)
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)
          ZIP_SHA256_SHORT=$(echo "$ZIP_SHA256" | cut -c1-16)
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_SIZE_MB=$ZIP_SIZE_MB" >> $GITHUB_ENV
          echo "ZIP_SHA256=$ZIP_SHA256" >> $GITHUB_ENV
          echo "ZIP_SHA256_SHORT=$ZIP_SHA256_SHORT" >> $GITHUB_ENV
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "TAG_NAME=gki-$DATE_TAG" >> $GITHUB_ENV

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          name: "GKI Kernel ${{ env.DATE_TAG }}"
          body: |
            **Build Date:** $(date +'%Y-%m-%d %H:%M WIB')
            **Kernel Version:** `${{ env.KERNEL_VERSION }}`
            **File:** ${{ env.ZIP_NAME }} (${{ env.ZIP_SIZE_MB }} MB)
            **SHA256:** `${{ env.ZIP_SHA256 }}`
            
            ### Features:
            - Wild-KSU 3.0.0 Stable
            - SUSFS v2.0.0
            - Baseband Guard (BBG)
            - BBR + Westwood TCP
            
            ✅ **CLEAN BUILD - NO DIRTY FLAG!**
          draft: false
          prerelease: false

      - name: "Send Telegram success notification"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG_NAME }}"
          MESSAGE="<b>✅ Build Success!</b>%0A%0A<b>📦 File:</b> <code>${{ env.ZIP_NAME }}</code>%0A<b>📊 Size:</b> ${{ env.ZIP_SIZE_MB }} MB%0A<b>🔐 SHA256:</b> <code>${{ env.ZIP_SHA256_SHORT }}...</code>%0A<b>🔧 Version:</b> <code>${{ env.KERNEL_VERSION }}</code>%0A<b>🎉 Status:</b> CLEAN - NO DIRTY!%0A<b>🔗 Download:</b> <a href='${RELEASE_URL}'>Release</a>%0A<b>⏰ Time:</b> $(date +'%H:%M:%S WIB')%0A<b>🎯 Features:</b> Wild-KSU + SUSFS + BBG"
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$CHAT_ID" -d text="$MESSAGE" -d parse_mode="HTML"

  notify-failure:
    name: "Notify Failure"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: failure()
    
    steps:
      - name: "Send Telegram failure notification"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="<b>❌ Build Failed!</b>%0A%0A<b>⏰ Time:</b> $(date +'%H:%M:%S WIB')%0A<b>🔗 Logs:</b> <a href='${RUN_URL}'>View Logs</a>%0A⚠️ Check logs for details."
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$CHAT_ID" -d text="$MESSAGE" -d parse_mode="HTML"
