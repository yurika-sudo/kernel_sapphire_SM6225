name: "Build GKI Kernel"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernels:
    name: "Build GKI Kernel"
    runs-on: ubuntu-latest
    
    env:
      KERNEL_LOC_DIR: "common_gki"
      KERNEL_NAME: "common"
      KERNEL_REPO: "https://android.googlesource.com/kernel/common"
      KERNEL_BRANCH: "android13-5.15-lts"
      DEFCONFIG_NAME: "gki_defconfig"
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 bc bison build-essential flex git libelf-dev libssl-dev wget curl jq

      - name: "Send Telegram build started"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          MESSAGE="<b>🔨 Kernel Build Started</b>%0A%0A<b>📁 Repo:</b> ${{ github.repository }}%0A<b>🎯 Target:</b> Android ${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}%0A<b>🔄 Trigger:</b> ${{ github.event_name }}%0A<b>⏰ Started:</b> $(date +'%H:%M:%S WIB')%0A<b>⚡ Status:</b> Initializing..."
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$CHAT_ID" -d text="$MESSAGE" -d parse_mode="HTML"

      - name: "Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j$(nproc --all)
          rm -rf .repo common
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm prebuilts/clang/host/linux-x86/clang-r547379.tar.gz
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846 prebuilts/clang/host/linux-x86/clang-r450784e prebuilts/clang/host/linux-x86/clang-stable
          sed -i -e 's/^BRANCH=.*/BRANCH=android13-5.15/' -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "Setup Baseband-guard (BBG)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard
          grep -q "baseband-guard" security/Makefile || echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          grep -q "baseband-guard/Kconfig" security/Kconfig || sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' security/Kconfig

      - name: "Setup Wild-KSU with SUSFS"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e
          rm -rf ./KernelSU ./drivers/kernelsu ./Wild_KSU
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s stable
          [ ! -d "Wild_KSU" ] && echo "ERROR: Wild_KSU directory not found!" && exit 1
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          [ ! -d "susfs4ksu" ] && echo "ERROR: SUSFS4KSU clone failed!" && exit 1
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          [ -f "$SUSFS_PATCH" ] && patch -p1 --forward < "$SUSFS_PATCH" || true
          mkdir -p fs include/linux
          [ -f "susfs4ksu/kernel_patches/fs/susfs.c" ] && cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c || (echo "ERROR: fs/susfs.c not found!" && exit 1)
          [ -f "susfs4ksu/kernel_patches/include/linux/susfs.h" ] && cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h || (echo "ERROR: include/linux/susfs.h not found!" && exit 1)
          [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ] && cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
          [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ] && cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* Wild_KSU/kernel/ || true
          KSU_C_FILE="Wild_KSU/kernel/ksu.c"
          [ ! -f "$KSU_C_FILE" ] && echo "ERROR: $KSU_C_FILE not found!" && exit 1
          if ! grep -q "susfs_init" "$KSU_C_FILE" 2>/dev/null; then
            grep -q "#include <linux/susfs.h>" "$KSU_C_FILE" || sed -i '/#include <linux\/fs\.h>/a #include <linux/susfs.h>' "$KSU_C_FILE"
            grep -q "susfs_init()" "$KSU_C_FILE" || (sed -i '/ksu_core_init();/a \\tsusfs_init();' "$KSU_C_FILE" || sed -i '/int __init ksu_init(/,/^}/{ /return 0;/i \\tsusfs_init(); }' "$KSU_C_FILE")
          fi
          [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ] && ln -sf ../Wild_KSU drivers/kernelsu

      - name: "Fix kernel version string"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          export TZ="Asia/Jakarta"
          BUILD_TIMESTAMP_WIB=$(date +"%a %b %d %H:%M:%S WIB %Y")
          GIT_HASH=$(git rev-parse --verify HEAD | cut -c1-13)
          BUILD_ID="ab$((RANDOM % 90000000 + 10000000))"
          VERSION_SUFFIX="-android13-8-g${GIT_HASH}-${BUILD_ID}"
          
          cp scripts/setlocalversion scripts/setlocalversion.backup
          [ -f "scripts/mkcompile_h" ] && cp scripts/mkcompile_h scripts/mkcompile_h.backup
          
          sed -i "/printf '%s' -dirty/d" scripts/setlocalversion
          sed -i 's/-dirty//g' scripts/setlocalversion
          sed -i '$ s|echo "$res"|echo "'"$VERSION_SUFFIX"'"|' scripts/setlocalversion
          
          if [ -f "scripts/mkcompile_h" ]; then
            ESCAPED_TIMESTAMP=$(echo "$BUILD_TIMESTAMP_WIB" | sed 's/[\/&]/\\&/g')
            sed -i "s|UTS_VERSION=\"\$(echo \$UTS_VERSION \$CONFIG_FLAGS \$TIMESTAMP | cut -b -\$UTS_LEN)\"|UTS_VERSION=\"#1 SMP PREEMPT $ESCAPED_TIMESTAMP\"|" scripts/mkcompile_h
            grep -q "LINUX_COMPILE_BY" scripts/mkcompile_h || sed -i "/UTS_VERSION=/a LINUX_COMPILE_BY=\"GitHub Actions\"\nLINUX_COMPILE_HOST=\"github.com\"" scripts/mkcompile_h
          fi
          
          if [ -f "init/Makefile" ] && grep -q "build-timestamp" init/Makefile; then
            HARDCODED_TS="\"$(date +'%a %b %e %H:%M:%S WIB %Y')\""
            sed -i "s|build-timestamp =.*|build-timestamp = $HARDCODED_TS|" init/Makefile
          fi
          
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          sed -i '/CONFIG_LOCALVERSION=/d' "$CONFIG_FILE"
          sed -i '/CONFIG_LOCALVERSION_AUTO=/d' "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION=\"$VERSION_SUFFIX\"" >> "$CONFIG_FILE"

      - name: "Clean git status"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          find . -type d -name ".git" ! -path "./.git" -exec rm -rf {} + 2>/dev/null || true
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add -A
          git diff-index --quiet HEAD || git commit -m "build: apply modifications" --no-verify

      - name: "Setup kernel configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
         
          echo "CONFIG_LRU_GEN=y" >> "$CONFIG_FILE"

          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_BBG=y
          CONFIG_KPM=y
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

      - name: "Fix ABI check issues"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          [ -f "build/abi/compare_to_symbol_list" ] && mv build/abi/compare_to_symbol_list build/abi/compare_to_symbol_list.disabled
          cat > build/abi/compare_to_symbol_list << 'EOF'
          #!/bin/bash
          echo "ABI checking disabled for custom kernel build"
          exit 0
          EOF
          chmod +x build/abi/compare_to_symbol_list

      - name: "Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        timeout-minutes: 45
        run: |
          export LTO=thin
          export SKIP_ABI_CHECKS=1
          export SKIP_KMI_CHECK=1
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 build/build.sh -j$(nproc)

      - name: "Verify kernel version"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          VERSION_FULL=$(strings Image | grep "Linux version" | head -1)
          echo "$VERSION_FULL" | grep -q "dirty" && echo "ERROR: Kernel contains -dirty!" && exit 1
          VERSION_CLEAN=$(echo "$VERSION_FULL" | sed 's/Linux version //' | sed 's/ (.*//')
          echo "KERNEL_VERSION=$VERSION_CLEAN" >> $GITHUB_ENV
          echo "$VERSION_CLEAN" > kernel_version.txt

      - name: "Copy kernel image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "Image.gki"

      - name: "Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernel
          path: ${{ env.WORK_DIR }}/out/dist/Image.gki
          retention-days: 1

  package-kernel:
    name: "Package Kernel"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: success()
    
    steps:
      - name: "Download kernel artifact"
        uses: actions/download-artifact@v4
        with:
          name: gki-kernel
          path: ./artifacts/

      - name: "Read kernel version"
        run: |
          if [ -f "./artifacts/kernel_version.txt" ]; then
            KERNEL_VERSION=$(cat ./artifacts/kernel_version.txt)
            echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          else
            echo "KERNEL_VERSION=5.15.197-android13-8-g6b88270ef707-ab13297889" >> $GITHUB_ENV
          fi

      - name: "Create ZIP package"
        run: |
          git clone --depth=1 https://github.com/superuseryu/AnyKernel3
          
          if [ -f "./artifacts/Image.gki" ]; then
            cp ./artifacts/Image.gki AnyKernel3/
          elif [ -f "./artifacts/gki-kernel/Image.gki" ]; then
            cp ./artifacts/gki-kernel/Image.gki AnyKernel3/
          else
            IMAGE_FILE=$(find ./artifacts -name "Image*" -type f | head -1)
            [ -n "$IMAGE_FILE" ] && cp "$IMAGE_FILE" AnyKernel3/Image.gki || exit 1
          fi
          
          DATE_TAG=$(date +'%Y.%m.%d')
          ZIP_NAME="GKI_Kernel_${DATE_TAG}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          ZIP_SIZE=$(stat -c%s "$ZIP_NAME")
          ZIP_SIZE_MB=$(echo "scale=2; $ZIP_SIZE / 1024 / 1024" | bc)
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)
          ZIP_SHA256_SHORT=$(echo "$ZIP_SHA256" | cut -c1-16)
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_SIZE_MB=$ZIP_SIZE_MB" >> $GITHUB_ENV
          echo "ZIP_SHA256=$ZIP_SHA256" >> $GITHUB_ENV
          echo "ZIP_SHA256_SHORT=$ZIP_SHA256_SHORT" >> $GITHUB_ENV
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "TAG_NAME=gki-$DATE_TAG" >> $GITHUB_ENV

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          name: "GKI Kernel ${{ env.DATE_TAG }}"
          body: |
            **Build Date:** $(date +'%Y-%m-%d %H:%M WIB')
            **Kernel Version:** `${{ env.KERNEL_VERSION }}`
            **File:** ${{ env.ZIP_NAME }} (${{ env.ZIP_SIZE_MB }} MB)
            **SHA256:** `${{ env.ZIP_SHA256 }}`
            
            ### Features:
            - Wild-KSU 3.0.0 Stable
            - SUSFS v2.0.0
            - Baseband Guard (BBG)
            - BBR + Westwood TCP
            
            ### Installation:
            1. Use Kernel Flasher app
            2. Or flash in custom recovery
            3. Reboot
          draft: false
          prerelease: false

      - name: "Send Telegram success notification"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG_NAME }}"
          MESSAGE="<b>✅ Build Success!</b>%0A%0A<b>📦 File:</b> <code>${{ env.ZIP_NAME }}</code>%0A<b>📊 Size:</b> ${{ env.ZIP_SIZE_MB }} MB%0A<b>🔐 SHA256:</b> <code>${{ env.ZIP_SHA256_SHORT }}...</code>%0A<b>🔧 Version:</b> <code>${{ env.KERNEL_VERSION }}</code>%0A<b>🔗 Download:</b> <a href='${RELEASE_URL}'>Release</a>%0A<b>⏰ Time:</b> $(date +'%H:%M:%S WIB')%0A<b>🎯 Features:</b> Wild-KSU + SUSFS + BBG"
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$CHAT_ID" -d text="$MESSAGE" -d parse_mode="HTML"

  notify-failure:
    name: "Notify Failure"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: failure()
    
    steps:
      - name: "Send Telegram failure notification"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="<b>❌ Build Failed!</b>%0A%0A<b>⏰ Time:</b> $(date +'%H:%M:%S WIB')%0A<b>🔗 Logs:</b> <a href='${RUN_URL}'>View Logs</a>%0A⚠️ Check the logs for details."
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$CHAT_ID" -d text="$MESSAGE" -d parse_mode="HTML"
