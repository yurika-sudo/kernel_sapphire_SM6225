name: "Build GKI Kernel (Minimal)"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        required: true
        default: 'ksu'
        type: choice
        options:
          - ksu
          - noksu
          - both
      enable_telegram:
        description: 'Send Telegram notifications'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  ANDROID_VERSION: "13"
  KERNEL_VERSION: "5.15"
  KERNEL_BRANCH: "android13-5.15-lts"
  DEVICE: "sapphiren"
  ANYKERNEL_REPO: "https://github.com/superuseryu/AnyKernel3"

jobs:
  build-kernel:
    name: "Build GKI ${{ matrix.variant }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ github.event.inputs.build_variant == 'both' && fromJSON('["ksu", "noksu"]') || fromJSON(format('["{0}"]', github.event.inputs.build_variant || 'ksu')) }}
    
    steps:
      # Setup
      - name: Setup workspace
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
          echo "Cores: $(nproc --all)"
      
      # Cleanup
      - name: Free up disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      
      # Dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison flex libssl-dev make libelf-dev \
            ccache rsync zip unzip curl git build-essential \
            libncurses-dev gawk wget aria2 repo
      
      # Telegram Start
      - name: Telegram Build Started
        if: github.event.inputs.enable_telegram != 'false' && always()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            MESSAGE="<b>🚀 Build Started</b>%0A"
            MESSAGE="${MESSAGE}<b>📦 Variant:</b> <code>${{ matrix.variant }}</code>%0A"
            MESSAGE="${MESSAGE}<b>🔄 Trigger:</b> ${{ github.event_name }}%0A"
            MESSAGE="${MESSAGE}<b>🆔 Run:</b> #${{ github.run_number }}%0A"
            MESSAGE="${MESSAGE}<b>⏰ Started:</b> $(date +'%H:%M UTC')"
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null || true
          fi
      
      # Download Clang FRESH
      - name: Download Clang Toolchain
        run: |
          set -e
          rm -rf clang clang.tar.gz
          
          # URL Google Android (lebih reliable)
          wget --progress=bar:force -O clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-gsi/clang-r547379.tar.gz" || {
            echo "Trying GitHub mirror..."
            wget --progress=bar:force -O clang.tar.gz \
              "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          }
          
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang --strip-components=1
          rm clang.tar.gz
          
          # Verify
          if [ -f "clang/bin/clang" ]; then
            echo "✅ Clang ready"
            clang/bin/clang --version | head -1
          else
            echo "❌ Clang not found!"
            ls -la clang/
            exit 1
          fi
      
      # Telegram - Download Complete
      - name: Telegram Download Complete
        if: github.event.inputs.enable_telegram != 'false' && always()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            MESSAGE="<b>📥 Download Complete</b>%0A"
            MESSAGE="${MESSAGE}<b>✅ Clang:</b> Ready%0A"
            MESSAGE="${MESSAGE}<b>⏱️ Time:</b> $(date +'%H:%M UTC')"
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null || true
          fi
      
      # Initialize Kernel Source FRESH
      - name: Initialize Kernel Source
        run: |
          rm -rf .repo common build prebuilts
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android13-5.15-lts --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
          
          cd common
          git checkout -f
          echo "✅ Kernel source ready"
      
      # Disable ABI Checks
      - name: Disable ABI Checks
        working-directory: common
        run: |
          touch android/abi_gki_aarch64
          
          if [ -f "build.config.gki.aarch64" ]; then
            sed -i 's/^ABI_DEFINITION=/#ABI_DEFINITION=/g' build.config.gki.aarch64
            sed -i 's/^KMI_SYMBOL_LIST=/#KMI_SYMBOL_LIST=/g' build.config.gki.aarch64
            echo "SKIP_ABI_CHECKS=1" >> build.config.gki.aarch64
            echo "ABI_DEFINITION=" >> build.config.gki.aarch64
          fi
          
          echo "✅ ABI checks disabled"
      
      # Setup KSU (if variant)
      - name: Setup KernelSU
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s stable
          
          if [ -d "Wild_KSU" ]; then
            ln -sf Wild_KSU drivers/kernelsu
            echo "✅ KSU installed"
          else
            echo "❌ KSU installation failed!"
            exit 1
          fi
      
      # Apply SUSFS
      - name: Apply SUSFS
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          git clone -q --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          if [ -f "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" ]; then
            patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch || true
          fi
          
          [ -f "susfs4ksu/kernel_patches/fs/susfs.c" ] && cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          ls susfs4ksu/kernel_patches/include/linux/susfs*.h 2>/dev/null && \
            cp susfs4ksu/kernel_patches/include/linux/susfs*.h include/linux/
          
          rm -rf susfs4ksu
          echo "✅ SUSFS applied"
      
      # Setup Baseband Guard
      - name: Setup Baseband Guard
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard
          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          echo "✅ Baseband Guard setup"
      
      # Telegram - Configuration Complete
      - name: Telegram Config Complete
        if: github.event.inputs.enable_telegram != 'false' && always()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            MESSAGE="<b>⚙️ Configuration Complete</b>%0A"
            MESSAGE="${MESSAGE}<b>📦 Variant:</b> <code>${{ matrix.variant }}</code>%0A"
            MESSAGE="${MESSAGE}<b>✅ Steps:</b>"
            MESSAGE="${MESSAGE}${{ matrix.variant == 'ksu' && ' KSU+SUSFS+BBG' || ' Stock' }}%0A"
            MESSAGE="${MESSAGE}<b>⏱️ Time:</b> $(date +'%H:%M UTC')"
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null || true
          fi
      
      # Configure Kernel
      - name: Configure Kernel
        working-directory: common
        run: |
          CONFIG="arch/arm64/configs/gki_defconfig"
          
          # Common configs
          cat >> "$CONFIG" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          CONFIG_DEBUG_KERNEL=n
          CONFIG_TRACING_SUPPORT=n
          CONFIG_TRACING=n
          CONFIG_FTRACE=n
          CONFIG_TRACEPOINTS=n
          CONFIG_FUNCTION_TRACER=n
          CONFIG_FUNCTION_GRAPH_TRACER=n
          CONFIG_TRACE_PRINTK=n
          CONFIG_DYNAMIC_FTRACE=n
          CONFIG_DEBUG_INFO=n
          CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=n
          CONFIG_DEBUG_INFO_DWARF4=n
          CONFIG_DEBUG_INFO_DWARF5=n
          CONFIG_DEBUG_INFO_BTF=n
          CONFIG_DEBUG_INFO_REDUCED=n
          CONFIG_DEBUG_INFO_COMPRESSED=n
          CONFIG_DEBUG_FS=n
          CONFIG_DYNAMIC_DEBUG=n
          CONFIG_DEBUG_PAGEALLOC=n
          CONFIG_PAGE_OWNER=n
          CONFIG_PAGE_POISONING=n
          CONFIG_SLUB_DEBUG=n
          CONFIG_SLUB_DEBUG_ON=n
          CONFIG_DEBUG_OBJECTS=n
          CONFIG_DEBUG_OBJECTS_TIMERS=n
          CONFIG_PROVE_LOCKING=n
          CONFIG_DEBUG_LOCKDEP=n
          CONFIG_DEBUG_SPINLOCK=n
          CONFIG_DEBUG_MUTEXES=n
          CONFIG_LOCK_STAT=n
          CONFIG_STACKTRACE=n
          CONFIG_DEBUG_STACK_USAGE=n
          CONFIG_DEBUG_STACKOVERFLOW=n
          CONFIG_RCU_TRACE=n
          CONFIG_RCU_EQS_DEBUG=n
          CONFIG_PRINTK_TIME=n
          CONFIG_PRINTK_CALLER=n
          CONFIG_PRINTK_INDEX=n
          CONFIG_ZRAM=y
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          CONFIG_ZRAM_DEF_COMP="lz4"
          CONFIG_ZRAM_MEMORY_TRACKING=n
          CONFIG_F2FS_FS=y
          CONFIG_F2FS_FS_SECURITY=y
          CONFIG_F2FS_FS_ENCRYPTION=y
          CONFIG_F2FS_FAULT_INJECTION=n
          CONFIG_F2FS_STAT_FS=y
          CONFIG_SCHED_AUTOGROUP=y
          CONFIG_SCHED_TUNE=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_COMPACTION=y
          CONFIG_PAGE_COUNTER=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_PSI=n
          CONFIG_PSI_DEFAULT_DISABLED=y
          CONFIG_MODULE_COMPRESS_NONE=y
          CONFIG_MODULE_SIG=n
          CONFIG_MODULE_FORCE_LOAD=n
          CONFIG_NET_SCHED=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_TCP_BBR2=y
          CONFIG_NET_NS=y
          CONFIG_HZ_1000=y
          CONFIG_HZ=1000
          EOF
          
          # KSU configs
          if [ "${{ matrix.variant }}" = "ksu" ]; then
          cat >> "$CONFIG" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_BBG=y
          CONFIG_KPM=y
          EOF
          fi
          
          echo "✅ Kernel configured"
      
      # Generate Config
      - name: Generate Config
        working-directory: common
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          
          make ARCH=arm64 \
               LLVM=1 \
               LLVM_IAS=1 \
               CC=clang \
               LD=ld.lld \
               O=../out \
               gki_defconfig
          
          echo "✅ Config generated"
      
      # Telegram - Build Started
      - name: Telegram Build Started
        if: github.event.inputs.enable_telegram != 'false' && always()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            MESSAGE="<b>🔨 Build Started</b>%0A"
            MESSAGE="${MESSAGE}<b>📦 Variant:</b> <code>${{ matrix.variant }}</code>%0A"
            MESSAGE="${MESSAGE}<b>⚙️ Cores:</b> $(nproc --all)%0A"
            MESSAGE="${MESSAGE}<b>⏱️ Time:</b> $(date +'%H:%M UTC')%0A"
            MESSAGE="${MESSAGE}<b>⏳ ETA:</b> ~30 minutes..."
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null || true
          fi
      
      # Build Kernel
      - name: Build Kernel
        run: |
          set -e
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export SKIP_ABI_CHECKS=1
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld
          
          # Build
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          SKIP_MRPROPER=1 \
          build/build.sh -j$(nproc --all) || {
            echo "❌ Build failed!"
            exit 1
          }
          
          echo "✅ Build successful"
      
      # Verify Output
      - name: Verify Output
        run: |
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            ls -lh out/arch/arm64/boot/Image.gz
            echo "✅ Kernel image found"
          else
            echo "❌ Kernel image not found!"
            exit 1
          fi
      
      # Prepare AnyKernel
      - name: Prepare AnyKernel
        run: |
          git clone --depth=1 ${{ env.ANYKERNEL_REPO }} AnyKernel3
          cd AnyKernel3
          rm -rf .git* *.md modules/
      
      # Package Kernel
      - name: Package Kernel
        run: |
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          
          if [ "${{ matrix.variant }}" = "ksu" ]; then
            ZIPNAME="GKI-${{ env.DEVICE }}-A${{ env.ANDROID_VERSION }}-${BUILD_DATE}.zip"
          else
            ZIPNAME="GKI-${{ env.DEVICE }}-A${{ env.ANDROID_VERSION }}-noksu-${BUILD_DATE}.zip"
          fi
          
          cd AnyKernel3
          zip -r9 "../${ZIPNAME}" *
          
          echo "ZIPNAME=${ZIPNAME}" >> $GITHUB_ENV
          echo "✅ Package: ${ZIPNAME}"
      
      # Telegram - Build Success
      - name: Telegram Build Success
        if: github.event.inputs.enable_telegram != 'false' && always()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            SIZE=$(du -h "${{ env.ZIPNAME }}" | cut -f1)
            
            MESSAGE="<b>✅ Build Successful!</b>%0A"
            MESSAGE="${MESSAGE}<b>📦 Variant:</b> <code>${{ matrix.variant }}</code>%0A"
            MESSAGE="${MESSAGE}<b>📁 File:</b> <code>${{ env.ZIPNAME }}</code>%0A"
            MESSAGE="${MESSAGE}<b>💾 Size:</b> $SIZE%0A"
            MESSAGE="${MESSAGE}<b>⏱️ Time:</b> $(date +'%H:%M UTC')%0A"
            MESSAGE="${MESSAGE}<b>⬇️ Next:</b> Creating release..."
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null || true
          fi
      
      # Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-${{ env.DEVICE }}-${{ matrix.variant }}-${{ github.run_number }}
          path: ${{ env.ZIPNAME }}
          retention-days: 7
      
      # Telegram - Build Failed (catch-all)
      - name: Telegram Build Failed
        if: failure() && github.event.inputs.enable_telegram != 'false'
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            MESSAGE="<b>❌ Build Failed!</b>%0A"
            MESSAGE="${MESSAGE}<b>📦 Variant:</b> <code>${{ matrix.variant }}</code>%0A"
            MESSAGE="${MESSAGE}<b>🆔 Run:</b> #${{ github.run_number }}%0A"
            MESSAGE="${MESSAGE}<b>⏱️ Time:</b> $(date +'%H:%M UTC')%0A"
            MESSAGE="${MESSAGE}<b>🔗 Logs:</b> <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Logs</a>"
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null || true
          fi

  release:
    name: Create Release
    needs: build-kernel
    runs-on: ubuntu-22.04
    if: always() && needs.build-kernel.result == 'success'
    
    steps:
      - name: Generate build info
        id: build_info
        run: |
          echo "tag_name=GKI-A${{ env.ANDROID_VERSION }}-$(date +'%Y%m%d')-build${{ github.run_number }}" >> $GITHUB_OUTPUT
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release_files
          
          # Find and copy all zip files
          find artifacts -name "*.zip" -exec cp {} release_files/ \;
          
          echo "Files:"
          ls -lh release_files/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_info.outputs.tag_name }}
          name: "GKI Kernel - Build #${{ github.run_number }}"
          body: |
            ## GKI Kernel for Redmi Note 13 4G/NFC
            **Android ${{ env.ANDROID_VERSION }} • Build #${{ github.run_number }}**
            
            ### Features:
            - TCP BBR + Westwood (default)
            - ZRAM with LZ4
            - MGLRU enabled
            - Performance optimized
            
            **Download and flash via recovery**
          files: release_files/*.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Telegram Release Created
        if: github.event.inputs.enable_telegram != 'false' && always()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.build_info.outputs.tag_name }}"
            
            MESSAGE="<b>🎉 Release Published!</b>%0A"
            MESSAGE="${MESSAGE}<b>🏷️ Tag:</b> <code>${{ steps.build_info.outputs.tag_name }}</code>%0A"
            MESSAGE="${MESSAGE}<b>📅 Date:</b> $(date +'%Y-%m-%d')%0A"
            MESSAGE="${MESSAGE}<b>🔗 Download:</b> <a href='$RELEASE_URL'>Release Page</a>"
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null || true
          fi
