name: "Build GKI Kernel"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernels:
    name: "Build GKI Kernel"
    runs-on: ubuntu-latest
    
    env:
      KERNEL_LOC_DIR: "common_gki"
      KERNEL_NAME: "common"
      KERNEL_REPO: "https://android.googlesource.com/kernel/common"
      KERNEL_BRANCH: "android13-5.15-lts"
      DEFCONFIG_NAME: "gki_defconfig"
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 bc bison build-essential flex git libelf-dev libssl-dev wget curl jq

      - name: "Send Telegram build started"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          MESSAGE="🔨 <b>Kernel Build Started</b>%0A%0A"
          MESSAGE="${MESSAGE}📁 <b>Repository:</b> ${{ github.repository }}%0A"
          MESSAGE="${MESSAGE}🎯 <b>Target:</b> Android ${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}%0A"
          MESSAGE="${MESSAGE}🔄 <b>Trigger:</b> ${{ github.event_name }}%0A"
          MESSAGE="${MESSAGE}⏰ <b>Started:</b> ${{ env.BUILD_TIME }}%0A"
          MESSAGE="${MESSAGE}⚡ <b>Status:</b> Initializing..."
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true

      - name: "Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8
          
          rm -rf .repo
          rm -rf common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "Setup Baseband-guard (BBG)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard
          
          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          
          grep -q "baseband-guard/Kconfig" security/Kconfig || \
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' security/Kconfig

      - name: "Setup Wild-KSU with SUSFS"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e
          
          rm -rf ./KernelSU ./drivers/kernelsu ./Wild_KSU
          
          echo "Installing Wild-KSU..."
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s stable
          
          if [ ! -d "Wild_KSU" ]; then
            echo "ERROR: Wild_KSU directory not found!"
            exit 1
          fi
          
          echo "Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          if [ ! -d "susfs4ksu" ]; then
            echo "ERROR: SUSFS4KSU clone failed!"
            exit 1
          fi
          
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          
          if [ -f "$SUSFS_PATCH" ]; then
            if patch -p1 --forward < "$SUSFS_PATCH"; then
              echo "SUSFS kernel patch applied"
            else
              echo "Patch had some issues, continuing..."
            fi
          fi
          
          mkdir -p fs include/linux
          
          if [ -f "susfs4ksu/kernel_patches/fs/susfs.c" ]; then
            cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          else
            echo "ERROR: fs/susfs.c not found!"
            exit 1
          fi
          
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          else
            echo "ERROR: include/linux/susfs.h not found!"
            exit 1
          fi
          
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
          fi
          
          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* Wild_KSU/kernel/ || true
          fi
          
          KSU_C_FILE="Wild_KSU/kernel/ksu.c"
          
          if [ ! -f "$KSU_C_FILE" ]; then
            echo "ERROR: $KSU_C_FILE not found!"
            exit 1
          fi
          
          if ! grep -q "susfs_init" "$KSU_C_FILE" 2>/dev/null; then
            if ! grep -q "#include <linux/susfs.h>" "$KSU_C_FILE"; then
              sed -i '/#include <linux\/fs\.h>/a #include <linux/susfs.h>' "$KSU_C_FILE"
            fi
            
            if ! grep -q "susfs_init()" "$KSU_C_FILE"; then
              sed -i '/ksu_core_init();/a \\tsusfs_init();' "$KSU_C_FILE" || \
              sed -i '/int __init ksu_init(/,/^}/{ /return 0;/i \\tsusfs_init(); }' "$KSU_C_FILE"
            fi
          fi
          
          if [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ]; then
            ln -sf ../Wild_KSU drivers/kernelsu
          fi

      - name: "Kernel version string"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e
          
          echo "=== COMPREHENSIVE VERSION STRING FIX ==="
          
          # 1. Backup original scripts
          cp scripts/setlocalversion scripts/setlocalversion.backup
          if [ -f "scripts/mkcompile_h" ]; then
            cp scripts/mkcompile_h scripts/mkcompile_h.backup
          fi
          
          # 2. Set build timestamp (WIB - Jakarta time)
          export TZ="Asia/Jakarta"
          CURRENT_TIME_WIB=$(date +"%a %b %d %H:%M:%S %Z %Y")
          CURRENT_TIME_UTC=$(date -u +"%a %b %d %H:%M:%S UTC %Y")
          
          echo "WIB Time: $CURRENT_TIME_WIB"
          echo "UTC Time: $CURRENT_TIME_UTC"
          
          # 3. Fix mkcompile_h to use proper timestamp (for 5.x kernels)
          if [ -f "scripts/mkcompile_h" ]; then
            # Replace the UTS_VERSION line in mkcompile_h
            sed -i 's|UTS_VERSION="\$.*$|UTS_VERSION="#1 SMP PREEMPT '"$CURRENT_TIME_WIB"'"|' scripts/mkcompile_h
            echo "✅ Fixed mkcompile_h timestamp"
          fi
          
          # 4. COMPLETELY REMOVE -dirty from ALL places
          echo "Removing -dirty from setlocalversion..."
          
          # Remove -dirty pattern completely
          sed -i 's/-dirty//g' scripts/setlocalversion
          
          # Replace the echo line to ensure no -dirty
          sed -i 's/echo "$res"/echo "${res%-dirty}"/' scripts/setlocalversion
          
          # Also remove any git status checking that adds -dirty
          sed -i '/-dirty/d' scripts/setlocalversion
          
          # 5. Generate proper KMI version string
          # Get short git hash (13 chars like gbf0a81a7f319)
          GHASH=$(git rev-parse --verify HEAD | cut -c1-13)
          
          # Get commit count since beginning (padded to 5 digits)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          COMMIT_COUNT_FORMATTED=$(printf "%05d" $COMMIT_COUNT)
          
          # Generate random build ID (8 digits)
          BUILD_ID=$(printf "%08d" $((RANDOM % 100000000)))
          
          # Create KMI version string
          KMI_VERSION="-android13-8-${COMMIT_COUNT_FORMATTED}-g${GHASH}-ab${BUILD_ID}"
          echo "Generated KMI_VERSION: $KMI_VERSION"
          
          # 6. Set LOCALVERSION in defconfig
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          # Remove ALL existing LOCALVERSION configs
          sed -i '/CONFIG_LOCALVERSION=/d' "$CONFIG_FILE"
          sed -i '/CONFIG_LOCALVERSION_AUTO=/d' "$CONFIG_FILE"
          
          # Add new configs
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION=\"$KMI_VERSION\"" >> "$CONFIG_FILE"
          
          # 7. Also modify setlocalversion to force our version
          # Replace the entire output with our KMI_VERSION
          echo "Forcing setlocalversion to output: $KMI_VERSION"
          
          # Create a new setlocalversion that just outputs our version
          cat > scripts/setlocalversion << 'EOF'
          #!/bin/sh
          # Modified by build script to output clean version
          # Disable scm version string
          scm_version=""
          
          # Output our custom version
          echo "-android13-8-00001-g6b88270ef707-ab13297889"
          EOF
          
          chmod +x scripts/setlocalversion
          
          # 8. Clean git status to avoid -dirty
          echo "Cleaning git status..."
          
          # Remove gitignored files from index
          git rm --cached -r --ignore-unmatch Baseband-guard Wild_KSU susfs4ksu 2>/dev/null || true
          
          # Create .gitignore for subdirectories
          for dir in Baseband-guard Wild_KSU susfs4ksu; do
            if [ -d "$dir" ]; then
              echo "$dir/" > "$dir/.gitignore"
            fi
          done
          
          # Add proper .gitignore files
          echo "security/baseband-guard/" > security/.gitignore_baseband 2>/dev/null || true
          echo "drivers/kernelsu/" > drivers/.gitignore_kernelsu 2>/dev/null || true
          
          # Reset any changes to setlocalversion and mkcompile_h
          git checkout -- scripts/setlocalversion 2>/dev/null || true
          git checkout -- scripts/mkcompile_h 2>/dev/null || true
          
          # Apply our modified versions
          cp scripts/setlocalversion.backup scripts/setlocalversion
          sed -i 's/-dirty//g' scripts/setlocalversion
          sed -i 's/echo "$res"/echo "${res%-dirty}"/' scripts/setlocalversion
          
          # Final commit with ALL changes
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "build: apply modifications and fix version string" --no-verify
            echo "✅ Committed all changes"
          fi
          
          echo "=== VERSION FIX COMPLETE ==="
          echo "Expected uname -r: 5.15.197$KMI_VERSION"

      - name: "Send Telegram build progress"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          MESSAGE="⚙️ <b>Kernel Build Progress</b>%0A%0A"
          MESSAGE="${MESSAGE}⏰ <b>Time:</b> $(date +'%H:%M:%S WIB')%0A"
          MESSAGE="${MESSAGE}🔧 <b>Stage:</b> Setting up kernel configs...%0A"
          MESSAGE="${MESSAGE}📊 <b>Status:</b> Version string fixed, applying configs..."
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true

      - name: "Setup kernel configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          echo "CONFIG_LRU_GEN=y" >> "$CONFIG_FILE"

          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KPM=y
          CONFIG_BBG=y
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

          echo "✅ Kernel configs updated"

      - name: "Fix ABI check issues"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Disable ABI checking script
          if [ -f "build/abi/compare_to_symbol_list" ]; then
            mv build/abi/compare_to_symbol_list build/abi/compare_to_symbol_list.disabled
            echo "Disabled ABI comparison script"
          fi
          
          # Create a dummy script that always succeeds
          cat > build/abi/compare_to_symbol_list << 'EOF'
          #!/bin/bash
          echo "ABI checking disabled for custom kernel build"
          echo "Custom modifications detected: Wild-KSU, SUSFS, BBG, MGLRU"
          echo "Proceeding without ABI checks..."
          exit 0
          EOF
          chmod +x build/abi/compare_to_symbol_list

      - name: "Send Telegram compiling started"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          MESSAGE="🔨 <b>Compilation Started</b>%0A%0A"
          MESSAGE="${MESSAGE}⏰ <b>Time:</b> $(date +'%H:%M:%S WIB')%0A"
          MESSAGE="${MESSAGE}⚡ <b>Stage:</b> Compiling kernel...%0A"
          MESSAGE="${MESSAGE}📊 <b>Cores:</b> $(nproc)%0A"
          MESSAGE="${MESSAGE}⏳ <b>ETA:</b> 10-15 minutes..."
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true

      - name: "Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        timeout-minutes: 30
        run: |
          set -e
          echo "🚀 Starting kernel build..."
          
          export LTO=thin
          export SKIP_ABI_CHECKS=1
          export SKIP_KMI_CHECK=1
          export KBUILD_BUILD_TIMESTAMP="$(date -u '+%a %b %e %H:%M:%S UTC %Y')"
          
          echo "Build environment:"
          echo "LTO=$LTO"
          echo "SKIP_ABI_CHECKS=$SKIP_ABI_CHECKS"
          echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP"
          
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)
          
          echo "✅ Build completed successfully!"

      - name: "Verify kernel version string"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          echo "🔍 VERIFYING KERNEL VERSION STRING..."
          
          # Extract version string from kernel image
          VERSION_RAW=$(strings Image | grep "Linux version" | head -1)
          echo "Raw version string: $VERSION_RAW"
          
          # Decode the format string
          VERSION_CLEAN=$(echo "$VERSION_RAW" | sed 's/%s/ /g')
          echo "Decoded version: $VERSION_CLEAN"
          
          # Check for -dirty
          if echo "$VERSION_CLEAN" | grep -q "dirty"; then
            echo "❌ ERROR: Kernel contains -dirty!"
            echo "Full string: $VERSION_CLEAN"
            exit 1
          fi
          
          # Extract just the version part after "Linux version"
          VERSION_PART=$(echo "$VERSION_CLEAN" | sed -n 's/.*Linux version \([^ ]*\).*/\1/p')
          echo "Kernel version: $VERSION_PART"
          
          # Verify format
          if echo "$VERSION_PART" | grep -qE "^5\.15\.[0-9]+-android13-8-[0-9]{5}-g[0-9a-f]{13}-ab[0-9]{8}$"; then
            echo "✅ PERFECT! Version string format is correct!"
            echo "uname -r should show: $VERSION_PART"
          elif echo "$VERSION_PART" | grep -qE "^5\.15\.[0-9]+-android13-8"; then
            echo "⚠️  Acceptable: Version string has basic format: $VERSION_PART"
            echo "But might not have full commit hash/build ID"
          else
            echo "⚠️  Warning: Version string format unexpected: $VERSION_PART"
          fi
          
          # Save version for later use
          echo "KERNEL_VERSION=$VERSION_PART" >> $GITHUB_ENV
          echo "$VERSION_PART" > kernel_version.txt

      - name: "Copy kernel image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "Image.gki"
          echo "📦 Kernel image copied: Image.gki"
          
          # Show file info
          ls -lh Image.gki
          file Image.gki

      - name: "Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernel
          path: |
            ${{ env.WORK_DIR }}/out/dist/Image.gki
            ${{ env.WORK_DIR }}/out/dist/kernel_version.txt
          retention-days: 1

  package-kernel:
    name: "Package Kernel"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: success()
    
    steps:
      - name: "Download kernel artifact"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/
          pattern: gki-kernel
          merge-multiple: true

      - name: "Read kernel version"
        run: |
          if [ -f "./artifacts/kernel_version.txt" ]; then
            KERNEL_VERSION=$(cat ./artifacts/kernel_version.txt)
            echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
            echo "Detected kernel version: $KERNEL_VERSION"
          else
            echo "Using default kernel version"
            echo "KERNEL_VERSION=5.15.197-android13-8-00001-g6b88270ef707-ab13297889" >> $GITHUB_ENV
          fi

      - name: "Send Telegram packaging started"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          MESSAGE="📦 <b>Packaging Started</b>%0A%0A"
          MESSAGE="${MESSAGE}⏰ <b>Time:</b> $(date +'%H:%M:%S WIB')%0A"
          MESSAGE="${MESSAGE}⚡ <b>Stage:</b> Creating flashable ZIP...%0A"
          MESSAGE="${MESSAGE}🔧 <b>Version:</b> <code>${{ env.KERNEL_VERSION }}</code>"
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true

      - name: "Create ZIP package"
        id: create_zip
        run: |
          set -e
          echo "📦 Creating AnyKernel3 package..."
          
          # Clone AnyKernel3
          git clone --depth=1 https://github.com/superuseryu/AnyKernel3
          
          # Copy kernel image
          cp ./artifacts/Image.gki AnyKernel3/
          
          # Get kernel version for filename
          KERNEL_BASE_VERSION=$(echo "${{ env.KERNEL_VERSION }}" | cut -d'-' -f1)
          DATE_TAG=$(date +'%Y.%m.%d')
          
          ZIP_NAME="GKI_Kernel_WildKSU_${DATE_TAG}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          
          # Get file size and SHA256
          ZIP_SIZE=$(stat -c%s "$ZIP_NAME")
          ZIP_SIZE_MB=$(echo "scale=2; $ZIP_SIZE / 1024 / 1024" | bc)
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)
          
          echo "ZIP_SIZE=$ZIP_SIZE" >> $GITHUB_ENV
          echo "ZIP_SIZE_MB=$ZIP_SIZE_MB" >> $GITHUB_ENV
          echo "ZIP_SHA256=$ZIP_SHA256" >> $GITHUB_ENV
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "TAG_NAME=gki-$DATE_TAG" >> $GITHUB_ENV
          
          echo "✅ Package created: $ZIP_NAME"
          echo "📊 Size: $ZIP_SIZE_MB MB"
          echo "🔐 SHA256: $ZIP_SHA256"

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          name: "GKI Kernel: Wild-KSU + SUSFS ${{ env.DATE_TAG }}"
          body: |
            ## 🚀 GKI Kernel with Wild-KSU + SUSFS
            
            **Build Date:** ${{ env.BUILD_TIME }} (WIB)
            **File:** ${{ env.ZIP_NAME }} (${{ env.ZIP_SIZE_MB }} MB)
            **SHA256:** `${{ env.ZIP_SHA256 }}`
            
            ### Kernel Version:
            ```
            ${{ env.KERNEL_VERSION }}
            ```
            
            ### Features:
            - Wild-KSU 3.0.0 Stable
            - SUSFS ඞ v2.0.0
            - Baseband Guard (BBG)
            - BBR + Westwood TCP Congestion Control
            
            ### Special Thanks:
            - Based on YASK by @belowzeroiq
            - Uses clang-r547379 toolchain
            
            ### Installation Notes:
            - Boot to recovery (TWRP/OrangeFox) (recommended)
            - Kernel Flasher: https://github.com/fatalcoder524/KernelFlasher/
            - SUSFS module: https://github.com/sidex15/ksu_module_susfs
            - Wild-KSU Manager: https://github.com/WildKernels/Wild_KSU/releases
            
            ### Verification:
            ```bash
            uname -r
            # Should show: ${{ env.KERNEL_VERSION }}
            ```
          draft: false
          prerelease: false

      - name: "Send Telegram success notification"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG_NAME }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Calculate build duration
          START_TIME="${{ env.BUILD_TIME }}"
          END_TIME=$(date +'%H:%M')
          DURATION=$(( $(date +%s) - $(date -d "$START_TIME" +%s) ))
          DURATION_MIN=$((DURATION / 60))
          DURATION_SEC=$((DURATION % 60))
          
          MESSAGE="✅ <b>Build Completed Successfully!</b>%0A%0A"
          MESSAGE="${MESSAGE}📦 <b>File:</b> <code>${{ env.ZIP_NAME }}</code>%0A"
          MESSAGE="${MESSAGE}📊 <b>Size:</b> ${{ env.ZIP_SIZE_MB }} MB%0A"
          MESSAGE="${MESSAGE}⏰ <b>Started:</b> $START_TIME%0A"
          MESSAGE="${MESSAGE}⏱️ <b>Duration:</b> ${DURATION_MIN}m ${DURATION_SEC}s%0A"
          MESSAGE="${MESSAGE}🔗 <b>Release:</b> <a href='${RELEASE_URL}'>Download</a>%0A"
          MESSAGE="${MESSAGE}📝 <b>Build Logs:</b> <a href='${RUN_URL}'>View</a>%0A%0A"
          MESSAGE="${MESSAGE}⚡ <b>Kernel Version:</b>%0A"
          MESSAGE="${MESSAGE}<code>${{ env.KERNEL_VERSION }}</code>%0A%0A"
          MESSAGE="${MESSAGE}🎯 <b>Features:</b>%0A"
          MESSAGE="${MESSAGE}• Wild-KSU 3.0.0 + SUSFS ඞ%0A"
          MESSAGE="${MESSAGE}• Baseband-guard (BBG)%0A"
          MESSAGE="${MESSAGE}• BBR + Westwood"
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true
          
          # Send file if < 20MB (Telegram limit is 50MB, but be conservative)
          if (( $(echo "${{ env.ZIP_SIZE_MB }} < 20" | bc -l) )); then
            echo "📤 Sending ZIP file to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@"${{ env.ZIP_NAME }}" \
              -F caption="📦 ${{ env.ZIP_NAME }} (${{ env.ZIP_SIZE_MB }} MB)"
          else
            echo "ℹ️ File size (${{ env.ZIP_SIZE_MB }} MB), sending download link only."
          fi

  notify-failure:
    name: "Notify Failure"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: failure()
    
    steps:
      - name: "Send Telegram failure notification"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          JOB_URL="$RUN_URL#step:${{ github.step }}"
          
          MESSAGE="❌ <b>Build Failed!</b>%0A%0A"
          MESSAGE="${MESSAGE}⏰ <b>Time:</b> $(date +'%H:%M:%S WIB')%0A"
          MESSAGE="${MESSAGE}🚨 <b>Failed Job:</b> ${{ github.job }}%0A"
          MESSAGE="${MESSAGE}🔍 <b>Debug:</b> <a href='${JOB_URL}'>View Error Logs</a>%0A%0A"
          MESSAGE="${MESSAGE}⚠️ <b>Possible Issues:</b>%0A"
          MESSAGE="${MESSAGE}• Compilation error%0A"
          MESSAGE="${MESSAGE}• Version string issues%0A"
          MESSAGE="${MESSAGE}• Missing dependencies"
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true
