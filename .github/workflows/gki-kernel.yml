name: Build GKI Kernel (Wild-KSU)

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        required: true
        default: 'ksu'
        type: choice
        options:
          - ksu
          - noksu
          - both

permissions:
  contents: write

env:
  KERNEL_BRANCH: common-android13-5.15-lts
  DEVICE: sapphiren
  ANYKERNEL_REPO: https://github.com/superuseryu/AnyKernel3

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        variant: ${{ github.event.inputs.build_variant == 'both' && fromJSON('["ksu", "noksu"]') || fromJSON(format('["{0}"]', github.event.inputs.build_variant)) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          sudo apt-get clean
          sudo apt-get autoremove -y
          
          echo "=== After cleanup ==="
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev make libelf-dev \
            rsync zip unzip curl git build-essential \
            libncurses-dev gawk wget diffutils > /dev/null

      - name: Setup clang
        run: |
          mkdir -p clang
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xzf master.tar.gz -C clang --strip-components=1
          rm master.tar.gz
          echo "✓ Clang setup completed"

      - name: Initialize kernel source
        run: |
          curl -o repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x repo
          
          ./repo init -u https://android.googlesource.com/kernel/manifest \
            -b ${KERNEL_BRANCH} --depth=1
          
          ./repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
          echo "✓ Kernel source ready"

      - name: Disable defconfig check
        run: |
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' common/build.config.gki.aarch64 || true
          echo "✓ Disabled check_defconfig"

      - name: Setup Wild KernelSU
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          curl -LSs https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh | bash -s stable
          
          if [ -d "Wild_KSU" ]; then
            ln -sf Wild_KSU drivers/kernelsu
            echo "✓ KSU setup completed"
          else
            echo "Error: Wild_KSU directory not found"
            exit 1
          fi

      - name: Apply SUSFS
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          git clone -q --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          [ -f "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" ] && \
            patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch 2>/dev/null || true
          
          [ -f "susfs4ksu/kernel_patches/fs/susfs.c" ] && \
            cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          
          ls susfs4ksu/kernel_patches/include/linux/susfs*.h 2>/dev/null && \
            cp susfs4ksu/kernel_patches/include/linux/susfs*.h include/linux/
          
          if [ -f "Wild_KSU/kernel/ksu.c" ]; then
            grep -q "susfs.h" Wild_KSU/kernel/ksu.c || \
              sed -i '/#include <linux\/fs.h>/a #include <linux/susfs.h>' Wild_KSU/kernel/ksu.c
            grep -q "susfs_init" Wild_KSU/kernel/ksu.c || \
              sed -i '/ksu_core_init();/a \\tsusfs_init();' Wild_KSU/kernel/ksu.c
          fi
          
          rm -rf susfs4ksu
          echo "✓ SUSFS applied"

      - name: Apply Baseband Guard
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          
          # Create symlink
          ln -sf ../Baseband-guard security/baseband-guard
          
          # Update security/Makefile
          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          
          # Update security/Kconfig to add BBG to LSM defaults
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          
          # Add BBG Kconfig source
          grep -q "baseband-guard/Kconfig" security/Kconfig || \
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' security/Kconfig
          
          echo "✓ Baseband Guard applied"

      - name: Apply basic kernel patches
        working-directory: common
        run: |
          # Apply essential patches
          curl -s https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch | patch -p1 --no-backup-if-mismatch || true
          echo "✓ Basic patches applied"

      - name: Configure kernel
        working-directory: common
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          
          # Start with gki_defconfig
          make O=out ARCH=arm64 CC=clang gki_defconfig
          
          # Basic performance configs
          ./scripts/config --file out/.config -e CC_OPTIMIZE_FOR_PERFORMANCE
          ./scripts/config --file out/.config -e LRU_GEN
          ./scripts/config --file out/.config -e LRU_GEN_ENABLED
          
          # TCP Congestion Control
          ./scripts/config --file out/.config -e TCP_CONG_ADVANCED
          ./scripts/config --file out/.config -e TCP_CONG_WESTWOOD
          ./scripts/config --file out/.config -e TCP_CONG_BBR
          ./scripts/config --file out/.config -d TCP_CONG_BIC
          ./scripts/config --file out/.config -d TCP_CONG_HTCP
          ./scripts/config --file out/.config -d DEFAULT_BBR
          ./scripts/config --file out/.config -d DEFAULT_CUBIC
          ./scripts/config --file out/.config -e DEFAULT_WESTWOOD
          ./scripts/config --file out/.config --set-str DEFAULT_TCP_CONG "westwood"
          
          # ZRAM
          ./scripts/config --file out/.config -e ZRAM
          ./scripts/config --file out/.config -e ZRAM_DEF_COMP_LZ4
          ./scripts/config --file out/.config --set-val ZRAM_DEF_COMP "lz4"
          
          # Filesystem support
          ./scripts/config --file out/.config -e OVERLAY_FS
          ./scripts/config --file out/.config -e F2FS_FS
          ./scripts/config --file out/.config -e F2FS_FS_SECURITY
          ./scripts/config --file out/.config -e F2FS_FS_ENCRYPTION
          
          # Disable PSI
          ./scripts/config --file out/.config -d PSI
          
          # For KSU variant
          if [ "${{ matrix.variant }}" == "ksu" ]; then
            ./scripts/config --file out/.config -e KSU
            ./scripts/config --file out/.config -e KPROBES
            ./scripts/config --file out/.config -e KSU_SUSFS
            ./scripts/config --file out/.config -e BBG
            
            # Add BBG to LSM
            current_lsm=$(grep "^CONFIG_LSM=" out/.config | cut -d'"' -f2 || echo "")
            if [ -n "$current_lsm" ]; then
              ./scripts/config --file out/.config --set-str LSM "${current_lsm},baseband_guard"
            fi
          fi
          
          # Disable debug/tracing to avoid ABI issues
          ./scripts/config --file out/.config -d DEBUG_KERNEL
          ./scripts/config --file out/.config -d DEBUG_INFO
          ./scripts/config --file out/.config -d KASAN
          ./scripts/config --file out/.config -d GCOV_KERNEL
          ./scripts/config --file out/.config -d DEBUG_FS
          ./scripts/config --file out/.config -d TRACING_SUPPORT
          ./scripts/config --file out/.config -d TRACING
          ./scripts/config --file out/.config -d FTRACE
          
          make O=out ARCH=arm64 CC=clang olddefconfig
          
          # Final verification
          echo "=== Config verification ==="
          grep "CONFIG_LRU_GEN_ENABLED=y" out/.config && echo "✓ MGLRU enabled" || echo "✗ MGLRU not found"
          grep "CONFIG_DEFAULT_WESTWOOD=y" out/.config && echo "✓ Westwood default" || echo "✗ Westwood not default"
          
          if [ "${{ matrix.variant }}" == "ksu" ]; then
            grep "CONFIG_KSU=y" out/.config && echo "✓ KSU enabled" || echo "✗ KSU not found"
            grep "CONFIG_BBG=y" out/.config && echo "✓ BBG enabled" || echo "✗ BBG not found"
          fi
          
          echo "✓ Kernel configured for ${{ matrix.variant }} variant"

      - name: Build kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          
          echo "=== Starting kernel build ==="
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          LTO=thin \
          SKIP_MRPROPER=1 \
          build/build.sh -j$(nproc --all) || {
            echo "Build failed, checking logs..."
            cat out/error.log 2>/dev/null || true
            exit 1
          }
          
          echo "✓ Build completed successfully"

      - name: Extract kernel version
        id: kernel_version
        run: |
          # Extract kernel version from Image
          KERNEL_STRING=$(strings out/android13-5.15/dist/Image | grep "Linux version" | head -1 | cut -d' ' -f3)
          echo "Kernel version string: $KERNEL_STRING"
          
          # Clean up the version string for filename
          VERSION_FILENAME=$(echo "$KERNEL_STRING" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "version=$VERSION_FILENAME" >> $GITHUB_OUTPUT
          echo "raw_version=$KERNEL_STRING" >> $GITHUB_OUTPUT

      - name: Package AnyKernel3
        run: |
          git clone -q --depth=1 $ANYKERNEL_REPO ak3
          cp out/android13-5.15/dist/Image ak3/
          
          # Copy additional files if they exist
          [ -f out/android13-5.15/dist/dtb ] && cp out/android13-5.15/dist/dtb ak3/ || true
          [ -f out/android13-5.15/dist/dtbo.img ] && cp out/android13-5.15/dist/dtbo.img ak3/ || true
          
          cd ak3
          
          # Create ZIP with kernel version in name
          if [ "${{ matrix.variant }}" == "ksu" ]; then
            ZIP_NAME="Kernel-${{ steps.kernel_version.outputs.version }}-ksu.zip"
          else
            ZIP_NAME="Kernel-${{ steps.kernel_version.outputs.version }}-noksu.zip"
          fi
          
          zip -q -r9 ../$ZIP_NAME * -x .git\* -x README.md
          echo "✓ Package created: $ZIP_NAME"
          
          # Save ZIP name for upload
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-kernel
          path: |
            Kernel-*.zip
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Get build info
        id: build_info
        run: |
          date_full="$(date '+%Y-%m-%d %H:%M:%S UTC')"
          date_short="$(date +%Y%m%d)"
          tag="build-${{ github.run_number }}"
          echo "date=${date_full}" >> $GITHUB_OUTPUT
          echo "date_short=${date_short}" >> $GITHUB_OUTPUT
          echo "tag=${tag}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_files
          
          # Find and copy all kernel zip files
          find artifacts -name "*.zip" -exec cp {} release_files/ \;
          
          echo "=== Release files ==="
          ls -la release_files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_info.outputs.tag }}
          name: GKI Kernel Build #${{ github.run_number }}
          body: |
            ## GKI Kernel Build #${{ github.run_number }}
            
            **Build Date:** ${{ steps.build_info.outputs.date }}
            
            ### Variants Available:
            - **KSU Variant**: Wild KernelSU + SUSFS + BBG + Performance optimizations
            - **NoKSU Variant**: Stock GKI with performance optimizations only
            
            ### Common Features:
            - ✅ MGLRU memory management
            - ✅ TCP Westwood congestion control
            - ✅ ZRAM LZ4 compression
            - ✅ PSI disabled for performance
            - ✅ All debugging infrastructure disabled
            
            ### KSU Variant Exclusive:
            - ✅ Wild KernelSU v3.0.0
            - ✅ SUSFS v2.0.0 root hiding
            - ✅ Baseband Guard security protection
            
            ### Installation:
            1. Boot to custom recovery (TWRP/OrangeFox)
            2. Flash the appropriate kernel ZIP
            3. Reboot system
            
            ### Notes:
            - Requires unlocked bootloader
            - Backup boot partition before flashing
            - Tested on Redmi Note 13 4G/NFC (Sapphire/Sapphiren)
            - Android 13 GKI compatible only
            
            ### Build Info:
            - **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Branch:** `${{ github.ref_name }}`
            - **Build Log:** [View](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: release_files/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
