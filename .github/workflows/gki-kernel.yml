name: "Build GKI Kernel (Minimal)"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        required: true
        default: 'ksu'
        type: choice
        options:
          - ksu
          - noksu
          - both
      enable_telegram:
        description: 'Send Telegram notifications'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  ANDROID_VERSION: "13"
  KERNEL_VERSION: "5.15"
  KERNEL_BRANCH: "common-android13-5.15-lts"
  DEVICE: "sapphiren"
  ANYKERNEL_REPO: "https://github.com/superuseryu/AnyKernel3"

jobs:
  build-kernel:
    name: "Build GKI ${{ matrix.variant }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ github.event.inputs.build_variant == 'both' && fromJSON('["ksu", "noksu"]') || fromJSON(format('["{0}"]', github.event.inputs.build_variant || 'ksu')) }}
    
    steps:
      # Setup
      - name: Setup workspace
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
          echo "REPO_NAME=$(echo '${{ github.repository }}' | cut -d'/' -f2)" >> $GITHUB_ENV
          echo "Cores: $(nproc --all)"
      
      # Cleanup
      - name: Free up disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      
      # Dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison flex libssl-dev make libelf-dev \
            ccache rsync zip unzip curl git build-essential \
            libncurses-dev gawk wget aria2 python3 python-is-python3
      
      # Telegram Start - HANYA JIKA BERHASIL
      - name: Telegram Build Started
        if: github.event.inputs.enable_telegram != 'false'
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            MESSAGE="<b>🚀 Build Started</b>%0A"
            MESSAGE="${MESSAGE}<b>📦 Repository:</b> <code>${{ env.REPO_NAME }}</code>%0A"
            MESSAGE="${MESSAGE}<b>📦 Variant:</b> <code>${{ matrix.variant }}</code>%0A"
            MESSAGE="${MESSAGE}<b>🔄 Trigger:</b> ${{ github.event_name }}%0A"
            MESSAGE="${MESSAGE}<b>🆔 Run:</b> #${{ github.run_number }}%0A"
            MESSAGE="${MESSAGE}<b>🌿 Branch:</b> <code>${{ github.ref_name }}</code>%0A"
            MESSAGE="${MESSAGE}<b>⏰ Started:</b> $(date +'%H:%M UTC')"
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null 2>&1 || true
          fi
      
      # Download Clang - PERBAIKAN STRUKTUR FOLDER
      - name: Download Clang Toolchain
        run: |
          set -e
          rm -rf clang clang.tar.gz
          
          echo "=== Downloading Clang ==="
          
          # URL alternatif yang lebih stabil
          CLANG_URL="https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          
          # Download dengan retry
          for i in {1..3}; do
            if wget --progress=bar:force -O clang.tar.gz "$CLANG_URL"; then
              echo "✅ Download successful (attempt $i)"
              break
            else
              echo "⚠️ Download failed (attempt $i), retrying..."
              sleep 2
            fi
          done
          
          if [ ! -f "clang.tar.gz" ]; then
            echo "❌ Failed to download clang after 3 attempts"
            exit 1
          fi
          
          # Extract
          echo "=== Extracting ==="
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang --strip-components=1
          rm clang.tar.gz
          
          # Perbaiki struktur folder
          echo "=== Fixing directory structure ==="
          
          # Cek jika ada folder bin di dalam clang
          if [ -d "clang/bin" ]; then
            echo "✅ Bin directory exists"
          else
            # Jika tidak ada, buat bin dan copy/symlink binary
            mkdir -p clang/bin
            
            # Cari binary clang
            if [ -f "clang/clang-20" ]; then
              ln -sf ../clang-20 clang/bin/clang
              ln -sf ../clang-20 clang/bin/clang++
              echo "✅ Created symlinks from clang-20"
            elif [ -f "clang/clang.real" ]; then
              ln -sf ../clang.real clang/bin/clang
              ln -sf ../clang.real clang/bin/clang++
              echo "✅ Created symlinks from clang.real"
            else
              echo "❌ Clang binary not found!"
              echo "Directory contents:"
              find clang -type f -name "*clang*" | head -20
              exit 1
            fi
          fi
          
          # Juga symlink untuk lld
          if [ -f "clang/ld.lld" ] || [ -f "clang/bin/ld.lld" ]; then
            if [ ! -f "clang/bin/ld.lld" ]; then
              ln -sf ../../ld.lld clang/bin/ld.lld 2>/dev/null || true
            fi
          fi
          
          # Verify
          echo "=== Verification ==="
          if [ -f "clang/bin/clang" ]; then
            echo "✅ Clang binary found: $(ls -la clang/bin/clang)"
            echo "✅ Version:"
            clang/bin/clang --version | head -1
          else
            echo "❌ Clang binary not in expected location!"
            echo "Looking for clang..."
            find clang -name "*clang*" -type f | grep -v ".so" | head -10
            exit 1
          fi
      
      # Telegram - Download Complete
      - name: Telegram Download Complete
        if: github.event.inputs.enable_telegram != 'false' && success()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            MESSAGE="<b>📥 Download Complete</b>%0A"
            MESSAGE="${MESSAGE}<b>✅ Clang:</b> Ready%0A"
            MESSAGE="${MESSAGE}<b>⏱️ Time:</b> $(date +'%H:%M UTC')"
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null 2>&1 || true
          fi
      
      # Initialize Kernel Source - PERBAIKAN: INSTALL REPO DULU
      - name: Initialize Kernel Source
        run: |
          echo "=== Installing repo tool ==="
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > repo
          chmod +x repo
          
          echo "=== Initializing kernel source ==="
          rm -rf .repo common build prebuilts
          
          ./repo init -u https://android.googlesource.com/kernel/manifest \
            -b ${{ env.KERNEL_BRANCH }} --depth=1
          
          echo "=== Syncing repository ==="
          ./repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
          
          cd common
          git checkout -f
          echo "✅ Kernel source ready"
          echo "Branch: $(git branch --show-current 2>/dev/null || echo 'detached')"
      
      # Disable ABI Checks
      - name: Disable ABI Checks
        working-directory: common
        run: |
          touch android/abi_gki_aarch64
          
          if [ -f "build.config.gki.aarch64" ]; then
            sed -i 's/^ABI_DEFINITION=/#ABI_DEFINITION=/g' build.config.gki.aarch64
            sed -i 's/^KMI_SYMBOL_LIST=/#KMI_SYMBOL_LIST=/g' build.config.gki.aarch64
            echo "SKIP_ABI_CHECKS=1" >> build.config.gki.aarch64
            echo "ABI_DEFINITION=" >> build.config.gki.aarch64
          fi
          
          echo "✅ ABI checks disabled"
      
      # Setup KSU (if variant)
      - name: Setup KernelSU
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          echo "=== Setting up KernelSU ==="
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s stable
          
          if [ -d "Wild_KSU" ]; then
            ln -sf Wild_KSU drivers/kernelsu
            echo "✅ KSU installed"
          else
            echo "❌ KSU installation failed!"
            exit 1
          fi
      
      # Apply SUSFS
      - name: Apply SUSFS
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          echo "=== Applying SUSFS ==="
          git clone -q --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          if [ -f "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" ]; then
            patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch 2>/dev/null || true
          fi
          
          [ -f "susfs4ksu/kernel_patches/fs/susfs.c" ] && cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          ls susfs4ksu/kernel_patches/include/linux/susfs*.h 2>/dev/null && \
            cp susfs4ksu/kernel_patches/include/linux/susfs*.h include/linux/
          
          rm -rf susfs4ksu
          echo "✅ SUSFS applied"
      
      # Setup Baseband Guard
      - name: Setup Baseband Guard
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          echo "=== Setting up Baseband Guard ==="
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard
          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          echo "✅ Baseband Guard setup"
      
      # Telegram - Configuration Complete
      - name: Telegram Config Complete
        if: github.event.inputs.enable_telegram != 'false' && success()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            MESSAGE="<b>⚙️ Configuration Complete</b>%0A"
            MESSAGE="${MESSAGE}<b>📦 Variant:</b> <code>${{ matrix.variant }}</code>%0A"
            MESSAGE="${MESSAGE}<b>✅ Steps:</b>"
            MESSAGE="${MESSAGE}${{ matrix.variant == 'ksu' && ' KSU+SUSFS+BBG' || ' Stock' }}%0A"
            MESSAGE="${MESSAGE}<b>⏱️ Time:</b> $(date +'%H:%M UTC')"
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null 2>&1 || true
          fi
      
      # Configure Kernel - GANTI METODE: gunakan scripts/config
      - name: Configure Kernel
        working-directory: common
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          
          echo "=== Creating base config ==="
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld O=out gki_defconfig
          
          echo "=== Applying custom configurations ==="
          
          # Use scripts/config untuk set config
          if [ -f "scripts/config" ]; then
            # Common optimizations
            ./scripts/config --file out/.config \
              -e CC_OPTIMIZE_FOR_PERFORMANCE \
              -e TCP_CONG_ADVANCED \
              -e TCP_CONG_WESTWOOD \
              -e DEFAULT_WESTWOOD \
              -e TCP_CONG_BBR \
              -e OVERLAY_FS \
              -e ZRAM \
              -e ZRAM_DEF_COMP_LZ4 \
              -e F2FS_FS \
              -e F2FS_FS_SECURITY \
              -e F2FS_FS_ENCRYPTION \
              -e SCHED_AUTOGROUP \
              -e COMPACTION \
              -e PAGE_COUNTER \
              -e MEMCG \
              -e MEMCG_SWAP \
              -e NET_SCHED \
              -e NET_SCH_FQ_CODEL \
              -e NET_NS \
              -d TCP_CONG_BIC \
              -d TCP_CONG_HTCP \
              -d DEFAULT_BBR \
              -d DEFAULT_CUBIC
            
            # Disable debug/tracing
            ./scripts/config --file out/.config \
              -d DEBUG_KERNEL \
              -d TRACING_SUPPORT \
              -d TRACING \
              -d FTRACE \
              -d TRACEPOINTS \
              -d FUNCTION_TRACER \
              -d TRACE_PRINTK \
              -d DEBUG_INFO \
              -d DEBUG_FS \
              -d DYNAMIC_DEBUG \
              -d DEBUG_PAGEALLOC \
              -d SLUB_DEBUG \
              -d DEBUG_OBJECTS \
              -d PROVE_LOCKING \
              -d STACKTRACE \
              -d RCU_TRACE \
              -d PRINTK_TIME \
              -d PRINTK_CALLER \
              -d PSI
            
            # Set values
            ./scripts/config --file out/.config \
              --set-str DEFAULT_TCP_CONG "westwood" \
              --set-str ZRAM_DEF_COMP "lz4" \
              --set-val ZRAM_MEMORY_TRACKING 0
            
            # KSU specific
            if [ "${{ matrix.variant }}" = "ksu" ]; then
              ./scripts/config --file out/.config \
                -e KSU \
                -e KPROBES \
                -e KPROBE_EVENTS \
                -e KSU_SUSFS \
                -e TMPFS_XATTR \
                -e TMPFS_POSIX_ACL \
                -e BBG
            fi
            
            # Run olddefconfig to resolve dependencies
            make ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld O=out olddefconfig
            
            echo "✅ Kernel configured with scripts/config"
          else
            echo "⚠️ scripts/config not found, using direct config method"
            # Fallback ke metode lama
            CONFIG="arch/arm64/configs/gki_defconfig"
            # ... [backup code dari sebelumnya]
          fi
      
      # Telegram - Build Starting
      - name: Telegram Build Starting
        if: github.event.inputs.enable_telegram != 'false' && success()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            MESSAGE="<b>🔨 Build Starting</b>%0A"
            MESSAGE="${MESSAGE}<b>📦 Variant:</b> <code>${{ matrix.variant }}</code>%0A"
            MESSAGE="${MESSAGE}<b>⚙️ Cores:</b> $(nproc --all)%0A"
            MESSAGE="${MESSAGE}<b>⏱️ Time:</b> $(date +'%H:%M UTC')%0A"
            MESSAGE="${MESSAGE}<b>⏳ ETA:</b> ~25-30 minutes..."
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null 2>&1 || true
          fi
      
      # Build Kernel - DENGAN VERIFIKASI CLANG
      - name: Build Kernel
        run: |
          set -e
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export SKIP_ABI_CHECKS=1
          export LLVM=1
          export LLVM_IAS=1
          
          echo "=== Verifying build environment ==="
          echo "Clang path: $(which clang || echo 'Not found')"
          echo "Clang version:"
          clang --version || { echo "❌ Clang not available"; exit 1; }
          echo "ld.lld: $(which ld.lld || echo 'Not found')"
          
          echo "=== Starting build ==="
          
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          SKIP_MRPROPER=1 \
          build/build.sh -j$(nproc --all) || {
            echo "❌ Build failed!"
            echo "=== Checking logs ==="
            [ -f "out/error.log" ] && tail -100 out/error.log || true
            [ -f "out/build.log" ] && tail -100 out/build.log || true
            exit 1
          }
          
          echo "✅ Build successful"
      
      # Verify Output - PERIKSA OUTPUT YANG BENAR
      - name: Verify Output
        run: |
          echo "=== Verifying output ==="
          
          # Check multiple possible locations
          if [ -f "out/android13-5.15/dist/Image" ]; then
            echo "✅ Kernel image found: out/android13-5.15/dist/Image"
            ls -lh out/android13-5.15/dist/Image
            cp out/android13-5.15/dist/Image kernel_Image
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ Kernel image found: out/arch/arm64/boot/Image.gz"
            ls -lh out/arch/arm64/boot/Image.gz
            cp out/arch/arm64/boot/Image.gz kernel_Image.gz
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            echo "✅ Kernel image found: out/arch/arm64/boot/Image"
            ls -lh out/arch/arm64/boot/Image
            cp out/arch/arm64/boot/Image kernel_Image
          else
            echo "❌ Kernel image not found!"
            echo "Searching for Image files..."
            find out -name "Image*" -type f | head -20
            exit 1
          fi
      
      # Prepare AnyKernel
      - name: Prepare AnyKernel
        run: |
          rm -rf AnyKernel3
          git clone --depth=1 ${{ env.ANYKERNEL_REPO }} AnyKernel3
          cd AnyKernel3
          rm -rf .git* *.md modules/
      
      # Package Kernel
      - name: Package Kernel
        run: |
          echo "=== Packaging kernel ==="
          
          # Copy kernel image
          if [ -f "kernel_Image" ]; then
            cp kernel_Image AnyKernel3/Image
            echo "✅ Using uncompressed Image"
          elif [ -f "kernel_Image.gz" ]; then
            cp kernel_Image.gz AnyKernel3/Image.gz
            echo "✅ Using compressed Image.gz"
          else
            echo "❌ No kernel image to package!"
            exit 1
          fi
          
          # Create zip name
          if [ "${{ matrix.variant }}" = "ksu" ]; then
            ZIPNAME="GKI-${{ env.DEVICE }}-A${{ env.ANDROID_VERSION }}-${BUILD_DATE}.zip"
          else
            ZIPNAME="GKI-${{ env.DEVICE }}-A${{ env.ANDROID_VERSION }}-noksu-${BUILD_DATE}.zip"
          fi
          
          cd AnyKernel3
          zip -r9 "../${ZIPNAME}" * -x ".gitignore" "README.md"
          
          echo "ZIPNAME=${ZIPNAME}" >> $GITHUB_ENV
          echo "✅ Package created: ${ZIPNAME}"
          ls -lh "../${ZIPNAME}"
      
      # Telegram - Build Success (HANYA JIKA SUKSES)
      - name: Telegram Build Success
        if: success() && github.event.inputs.enable_telegram != 'false'
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            SIZE=$(du -h "${{ env.ZIPNAME }}" | cut -f1 2>/dev/null || echo "N/A")
            
            MESSAGE="<b>✅ Build Successful!</b>%0A"
            MESSAGE="${MESSAGE}<b>📦 Variant:</b> <code>${{ matrix.variant }}</code>%0A"
            MESSAGE="${MESSAGE}<b>📁 File:</b> <code>${{ env.ZIPNAME }}</code>%0A"
            MESSAGE="${MESSAGE}<b>💾 Size:</b> $SIZE%0A"
            MESSAGE="${MESSAGE}<b>⏱️ Time:</b> $(date +'%H:%M UTC')%0A"
            MESSAGE="${MESSAGE}<b>⬇️ Next:</b> Creating release..."
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null 2>&1 || true
          fi
      
      # Upload Artifact
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GKI-${{ env.DEVICE }}-${{ matrix.variant }}-${{ github.run_number }}
          path: ${{ env.ZIPNAME }}
          retention-days: 7
      
      # Telegram - Build Failed (HANYA JIKA GAGAL)
      - name: Telegram Build Failed
        if: failure() && github.event.inputs.enable_telegram != 'false'
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            MESSAGE="<b>❌ Build Failed!</b>%0A"
            MESSAGE="${MESSAGE}<b>📦 Variant:</b> <code>${{ matrix.variant }}</code>%0A"
            MESSAGE="${MESSAGE}<b>🆔 Run:</b> #${{ github.run_number }}%0A"
            MESSAGE="${MESSAGE}<b>⏱️ Time:</b> $(date +'%H:%M UTC')%0A"
            MESSAGE="${MESSAGE}<b>🔗 Logs:</b> <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Logs</a>%0A"
            MESSAGE="${MESSAGE}<b>🌿 Branch:</b> <code>${{ github.ref_name }}</code>"
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null 2>&1 || true
          fi

  release:
    name: Create Release
    needs: build-kernel
    runs-on: ubuntu-22.04
    if: needs.build-kernel.result == 'success'
    
    steps:
      - name: Generate build info
        id: build_info
        run: |
          echo "tag_name=GKI-A${{ env.ANDROID_VERSION }}-$(date +'%Y%m%d')-build${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "release_name=GKI Kernel - Build #${{ github.run_number }} ($(date +'%Y-%m-%d'))" >> $GITHUB_OUTPUT
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release_files
          
          # Find and copy all zip files
          find artifacts -name "*.zip" -exec cp {} release_files/ \;
          
          echo "Release files:"
          ls -lh release_files/
          echo "Total files: $(ls -1 release_files/ | wc -l)"
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_info.outputs.tag_name }}
          name: ${{ steps.build_info.outputs.release_name }}
          body: |
            ## GKI Kernel for Redmi Note 13 4G/NFC
            **Android ${{ env.ANDROID_VERSION }} • Kernel 5.15 • Build #${{ github.run_number }}**
            
            ### Build Information:
            - **Build Date:** $(date +'%Y-%m-%d %H:%M UTC')
            - **Branch:** `${{ github.ref_name }}`
            - **Run:** [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ### Features:
            - TCP BBR + Westwood (default congestion control)
            - ZRAM with LZ4 compression
            - Debug/Tracing completely disabled for performance
            - F2FS optimizations
            - PSI disabled
            
            ### Installation:
            1. Boot to custom recovery (TWRP/OrangeFox)
            2. Flash the appropriate ZIP file
            3. Reboot system
            
            ### Notes:
            - Compatible with Android 13 GKI devices
            - Requires unlocked bootloader
            - Always backup before flashing
            
            ### Downloads:
            Flash via custom recovery.
          files: release_files/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Telegram Release Created
        if: github.event.inputs.enable_telegram != 'false'
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.build_info.outputs.tag_name }}"
            FILE_COUNT=$(ls -1 release_files/ 2>/dev/null | wc -l)
            
            MESSAGE="<b>🎉 Release Published!</b>%0A"
            MESSAGE="${MESSAGE}<b>🏷️ Tag:</b> <code>${{ steps.build_info.outputs.tag_name }}</code>%0A"
            MESSAGE="${MESSAGE}<b>📅 Date:</b> $(date +'%Y-%m-%d')%0A"
            MESSAGE="${MESSAGE}<b>📦 Files:</b> $FILE_COUNT variant(s)%0A"
            MESSAGE="${MESSAGE}<b>🔗 Download:</b> <a href='$RELEASE_URL'>Release Page</a>"
            
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="HTML" > /dev/null 2>&1 || true
          fi
