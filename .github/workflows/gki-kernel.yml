name: Build GKI Kernel (Wild-KSU)

on:
  workflow_dispatch:  # Hanya bisa dijalankan manual oleh pemilik repo
    inputs:
      build_variant:
        description: 'Build variant'
        required: true
        default: 'ksu'
        type: choice
        options:
          - ksu
          - noksu
          - both

permissions:
  contents: write

env:
  ANDROID_VERSION: android13
  KERNEL_VERSION: 5.15
  KERNEL_BRANCH: common-android13-5.15-lts
  CLANG_VERSION: r547379
  DEVICE: sapphiren
  ANYKERNEL_REPO: https://github.com/superuseryu/AnyKernel3
  CCACHE_DIR: ~/.ccache
  WORK_DIR: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        variant: ${{ github.event.inputs.build_variant == 'both' && fromJSON('["ksu", "noksu"]') || fromJSON(format('["{0}"]', github.event.inputs.build_variant)) }}
    
    # 🔐 PENGAMAN: Hanya izinkan dari branch tertentu
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace & dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison flex libssl-dev make libelf-dev \
            ccache zip unzip curl git build-essential \
            libncurses-dev gawk wget aria2 rsync

      - name: Initialize ccache
        run: |
          ccache -M 2G
          ccache -z

      - name: Setup AOSP kernel source
        run: |
          curl -o repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x repo
          
          ./repo init -u https://android.googlesource.com/kernel/manifest \
            -b ${KERNEL_BRANCH} --depth=1
          
          ./repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
          
          # Setup AOSP Clang
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          aria2c -x 16 -s 16 -o clang.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          tar -xzf clang.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm clang.tar.gz
          
          echo "✓ Kernel source ready"

      - name: Setup Wild KernelSU
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s stable
          ln -sf ../Wild_KSU drivers/kernelsu
          echo "✓ Wild-KSU installed"

      - name: Apply SUSFS (GKI Compatible)
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 susfs_src
          
          # Hanya terapkan patch kernel, JANGAN copy file .c/.h
          if [ -f "susfs_src/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" ]; then
            patch -p1 --forward < susfs_src/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch || echo "Patch applied with some hunks"
          fi
          
          rm -rf susfs_src
          echo "✅ SUSFS hooks applied"

      - name: Apply Baseband Guard
        if: matrix.variant == 'ksu'
        working-directory: common
        run: |
          git clone --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard
          
          echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' security/Kconfig
          echo "✅ BBG setup complete"

      - name: Configure kernel (Single Step)
        working-directory: common
        run: |
          export PATH="${{ env.WORK_DIR }}/prebuilts/clang/host/linux-x86/clang-r547379/bin:$PATH"
          
          # Buat config fragment
          FRAGMENT_FILE="arch/arm64/configs/custom.fragment"
          
          # Konfigurasi dasar untuk semua variant
          cat > "$FRAGMENT_FILE" << 'EOF'
          # Performance Optimizations
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          
          # TCP Congestion Control - FIX WESTWOOD
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_DEFAULT_TCP_CONG="westwood"
          CONFIG_DEFAULT_WESTWOOD=y
          # CONFIG_DEFAULT_CUBIC is not set
          # CONFIG_DEFAULT_BBR is not set
          
          # Filesystem
          CONFIG_OVERLAY_FS=y
          CONFIG_F2FS_FS=y
          CONFIG_F2FS_FS_SECURITY=y
          CONFIG_F2FS_FS_ENCRYPTION=y
          
          # ZRAM
          CONFIG_ZRAM=y
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          CONFIG_ZRAM_DEF_COMP="lz4"
          
          # Disable debug features
          # CONFIG_DEBUG_KERNEL is not set
          # CONFIG_TRACING_SUPPORT is not set
          # CONFIG_PSI is not set
          EOF
          
          # Tambahkan konfig KSU hanya untuk variant ksu
          if [ "${{ matrix.variant }}" == "ksu" ]; then
            cat >> "$FRAGMENT_FILE" << 'EOF'
            # KernelSU
            CONFIG_KSU=y
            CONFIG_KSU_SUSFS=y
            CONFIG_BBG=y
            EOF
          fi
          
          # Merge fragment dengan gki_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out/ \
            arch/arm64/configs/gki_defconfig \
            "$FRAGMENT_FILE"
          
          echo "✅ Kernel configured for ${{ matrix.variant }} variant"

      - name: Build kernel dengan AOSP Clang
        run: |
          export PATH="${{ env.WORK_DIR }}/prebuilts/clang/host/linux-x86/clang-r547379/bin:$PATH"
          export KBUILD_BUILD_USER=github-action
          export KBUILD_BUILD_HOST=github
          
          echo "=== Clang version ==="
          clang --version | head -1
          
          # Build dengan skrip AOSP
          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all) || {
            echo "❌ Build failed!"
            exit 1
          }
          
          echo "✅ Build successful"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 $ANYKERNEL_REPO ak3
          cp out/android13-5.15/dist/Image ak3/
          
          cd ak3
          VARIANT_SUFFIX=""
          [ "${{ matrix.variant }}" == "noksu" ] && VARIANT_SUFFIX="-noksu"
          
          ZIP_NAME="GKI-${DEVICE}-A13${VARIANT_SUFFIX}-$(date +%Y%m%d).zip"
          zip -q -r9 "../${ZIP_NAME}" * -x .git/\*
          
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "✅ Package created: ${ZIP_NAME}"

      - name: Upload artifact (1 day retention)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}-${{ github.run_number }}
          path: GKI-*.zip
          retention-days: 1  # ⚠️ Hanya disimpan 1 hari

  # 🔒 RELEASE HANYA JIKA BUILD BERHASIL
  release:
    needs: build
    runs-on: ubuntu-22.04
    if: success()  # ⚠️ HANYA jika semua job build sukses
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release
        run: |
          mkdir -p release_files
          
          # Cari semua file ZIP dari artifact
          find artifacts -name "*.zip" -exec cp {} release_files/ \;
          
          echo "Artifacts found:"
          ls -la release_files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "GKI Kernel Build #${{ github.run_number }}"
          body: |
            ## ⚠️ IMPORTANT NOTICE
            **This is an automated kernel build. Use at your own risk!**
            
            ### Build Information
            - **Build Date:** $(date '+%Y-%m-%d %H:%M UTC')
            - **Build Number:** #${{ github.run_number }}
            - **Kernel Version:** 5.15 GKI
            - **Android Version:** 13
            
            ### Variants Included
            ${{ github.event.inputs.build_variant == 'both' && '- KSU Variant (with Wild-KSU + SUSFS + BBG)' || '' }}
            ${{ github.event.inputs.build_variant == 'both' && '- NoKSU Variant (stock GKI)' || '' }}
            ${{ github.event.inputs.build_variant == 'ksu' && '- KSU Variant only' || '' }}
            ${{ github.event.inputs.build_variant == 'noksu' && '- NoKSU Variant only' || '' }}
            
            ### Features
            - ✅ TCP Westwood as default congestion control
            - ✅ AOSP Clang r547379 toolchain
            - ✅ MGLRU memory management
            - ✅ Performance optimizations
            - ✅ All debug features disabled
            
            ### Installation
            1. Backup your current kernel/boot partition
            2. Flash in custom recovery (TWRP/OrangeFox)
            3. Reboot
            
            ### Warnings
            - 🔴 **NO WARRANTY** - May brick your device
            - 🔴 **Backup first** - Always backup before flashing
            - 🔴 **Compatible devices only** - Redmi Note 13 4G/NFC
            
            ### Source
            Build logs and source: [${{ github.repository }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: release_files/*.zip
          draft: false
          prerelease: true  # ⚠️ Mark as pre-release for safety
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
