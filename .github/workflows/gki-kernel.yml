name: Build GKI Kernel (Android 13 - 5.15 with KSU)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag/version'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  ANDROID_VERSION: android13
  KERNEL_VERSION: 5.15
  KERNEL_BRANCH: common-android13-5.15-lts
  CLANG_VERSION: r547379
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3
  CCACHE_DIR: ~/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo apt-get autoremove -y

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev make libelf-dev \
            ccache rsync zip unzip curl git build-essential \
            libncurses-dev gawk wget diffutils file

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-gki-${{ env.KERNEL_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-gki-${{ env.KERNEL_BRANCH }}-
            ccache-gki-

      - name: Initialize ccache
        run: |
          mkdir -p ~/.ccache ~/.cache/ccache
          ccache -M 4G
          ccache -z

      - name: Setup Clang toolchain
        uses: actions/cache@v4
        id: clang-cache
        with:
          path: clang
          key: proton-clang-${{ env.CLANG_VERSION }}

      - name: Download Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xzf master.tar.gz -C clang --strip-components=1
          rm master.tar.gz

      - name: Initialize kernel source
        uses: actions/cache@v4
        id: kernel-cache
        with:
          path: |
            .repo
            common
            build
            prebuilts
          key: kernel-source-${{ env.KERNEL_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            kernel-source-${{ env.KERNEL_BRANCH }}-

      - name: Sync kernel repository
        run: |
          if [ "${{ steps.kernel-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Syncing full kernel source..."
            curl -s https://storage.googleapis.com/git-repo-downloads/repo > repo
            chmod +x repo
            ./repo init -u https://android.googlesource.com/kernel/manifest \
              -b ${KERNEL_BRANCH} --depth=1
            ./repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
          else
            echo "Using cached kernel source..."
            curl -s https://storage.googleapis.com/git-repo-downloads/repo > repo
            chmod +x repo
            ./repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync 2>/dev/null || true
          fi

      - name: Setup KernelSU
        working-directory: common
        run: |
          echo "Setting up KernelSU..."
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -
          
          # Verify KernelSU setup
          if [ -d "KernelSU" ]; then
            echo "✓ KernelSU setup completed"
          else
            echo "✗ KernelSU setup failed"
            exit 1
          fi

      - name: Clean git state
        working-directory: common
        run: |
          # Prevent -dirty suffix in kernel version
          touch .scmversion
          git config --global user.email "build@github.com"
          git config --global user.name "GitHub Actions"
          git add .scmversion
          git commit -m "Build: Clean git state" --no-verify 2>/dev/null || true

      - name: Configure kernel
        working-directory: common
        env:
          PATH: ${{ github.workspace }}/clang/bin:$PATH
        run: |
          echo "Configuring kernel..."
          
          # Start with GKI defconfig
          make O=out ARCH=arm64 CC=clang gki_defconfig
          
          # Enable KernelSU
          ./scripts/config --file out/.config -e KSU
          
          # Enable MGLRU
          ./scripts/config --file out/.config \
            -e LRU_GEN \
            -e LRU_GEN_ENABLED \
            -d LRU_GEN_STATS
          
          # Configure TCP Westwood as default
          ./scripts/config --file out/.config \
            -e TCP_CONG_ADVANCED \
            -e TCP_CONG_WESTWOOD \
            -d DEFAULT_CUBIC \
            -d DEFAULT_BBR \
            -e DEFAULT_WESTWOOD \
            --set-str DEFAULT_TCP_CONG "westwood"
          
          # Enable ZRAM with LZ4 compression
          ./scripts/config --file out/.config \
            -e ZRAM \
            -e ZRAM_DEF_COMP_LZ4 \
            --set-val ZRAM_DEF_COMP "lz4"
          
          # Disable debug features for performance
          ./scripts/config --file out/.config \
            -d DEBUG_KERNEL \
            -d DEBUG_INFO \
            -d TRACING_SUPPORT \
            -d PSI \
            -d SLUB_DEBUG \
            -d DEBUG_PAGEALLOC
          
          # Apply configuration
          make O=out ARCH=arm64 CC=clang olddefconfig
          
          # Final verification
          echo "=== Configuration Verification ==="
          grep "CONFIG_LOCALVERSION=" out/.config || echo "Using default LOCALVERSION"
          grep -q "CONFIG_DEFAULT_WESTWOOD=y" out/.config && echo "✓ TCP Westwood configured" || echo "✗ TCP Westwood not configured"
          grep -q "CONFIG_KSU=y" out/.config && echo "✓ KernelSU enabled" || echo "✗ KernelSU not enabled"

      - name: Build kernel
        env:
          PATH: ${{ github.workspace }}/clang/bin:$PATH
          CCACHE_COMPRESS: 1
          CCACHE_MAXSIZE: 4G
          USE_CCACHE: 1
          KBUILD_BUILD_USER: github
          KBUILD_BUILD_HOST: actions
        run: |
          echo "Building kernel..."
          
          # Build with GKI config
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          LTO=thin \
          SKIP_MRPROPER=1 \
          build/build.sh -j$(nproc --all)
          
          # Verify build output
          if [ ! -f "out/android13-5.15/dist/Image" ]; then
            echo "✗ Kernel Image not found!"
            exit 1
          fi
          
          echo "✓ Build successful"
          echo "Kernel size: $(du -h out/android13-5.15/dist/Image | cut -f1)"

      - name: Package kernel
        run: |
          echo "Packaging kernel..."
          
          # Clone AnyKernel3
          git clone -q --depth=1 $ANYKERNEL_REPO ak3
          
          # Copy kernel image
          cp out/android13-5.15/dist/Image ak3/
          
          # Copy additional files if they exist
          [ -f out/android13-5.15/dist/dtb ] && cp out/android13-5.15/dist/dtb ak3/
          [ -f out/android13-5.15/dist/dtbo.img ] && cp out/android13-5.15/dist/dtbo.img ak3/
          
          # Create flashable zip
          cd ak3
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          ZIP_NAME="GKI-Android13-5.15-KSU-${TIMESTAMP}.zip"
          zip -q -r9 ../${ZIP_NAME} * -x .git* README.md
          
          echo "✓ Package created: ${ZIP_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-Kernel
          path: GKI-*.zip
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: success()
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: GKI-Kernel
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || format('v{0}', github.run_number) }}
          name: GKI Kernel Android 13 (5.15) with KernelSU
          body: |
            ## Generic Kernel Image (GKI) for Android 13
            
            **Kernel Version:** 5.15.197 (stock GKI version)
            **Android Version:** 13 (T)
            **Architecture:** arm64
            
            ### Features
            - ✅ **KernelSU** integrated for root access management
            - ✅ **MGLRU** (Multi-Generational LRU) for improved memory management
            - ✅ **TCP Westwood** as default congestion control algorithm
            - ✅ **ZRAM** with LZ4 compression enabled
            - ✅ Debug features disabled for optimal performance
            - ✅ Maintains stock GKI compatibility and versioning
            
            ### Compatibility
            This kernel is built from the official Android Common Kernel (ACK) source and maintains GKI compatibility. It should work on:
            - Any Android 13 device with GKI support
            - Devices using kernel version 5.15
            - ARM64 architecture devices
            
            ### Installation
            1. Download the appropriate ZIP file
            2. Boot to custom recovery (TWRP/OrangeFox)
            3. Flash the ZIP file
            4. Reboot system
            
            ### Notes & Warnings
            - ⚠️ **Compatibility:** Android 13 GKI devices only
            - ⚠️ **Requirement:** Unlocked bootloader
            - 💾 **Backup:** Always backup your current boot partition before flashing
            - 📱 **Testing:** Test on your specific device before regular use
            - 🔧 **Support:** Community-supported build - no official support
            
            ### Kernel Information
            - **Base:** Android Common Kernel (android13-5.15-lts)
            - **Build Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')
            - **Build ID:** #${{ github.run_number }}
            - **Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            
            ### Technical Details
            - Maintains stock `uname -r` output (5.15.197-android13-...)
            - GKI Kernel Module Interface (KMI) compatibility preserved
            - Built with Proton Clang toolchain
            - All debugging infrastructure disabled for performance
            
            ### Source
            Built from: [Android Common Kernel](https://android.googlesource.com/kernel/common/+/refs/heads/android13-5.15-lts)
            
            ---
            
            *This is an unofficial community build. Use at your own risk.*
          files: artifacts/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
