name: "Check Source Updates"

# Weekly (and manual) upstream watch for the three things this kernel is glued
# together from: KernelSU-Next, SUSFS and DroidSpaces. When any of them moved, a
# verification build runs first — the pin file only moves if that build compiled.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'   # every Monday at 02:00 UTC

permissions:
  contents: write   # needed to commit sources/source-pins.json

jobs:
  check:
    name: "Check upstream versions"
    runs-on: ubuntu-latest
    outputs:
      has_update:          ${{ steps.versions.outputs.has_update }}
      needs_verify:        ${{ steps.versions.outputs.needs_verify }}
      ksun_tag:            ${{ steps.versions.outputs.ksun_tag }}
      susfs_version:       ${{ steps.versions.outputs.susfs_version }}
      susfs_module_tag:    ${{ steps.versions.outputs.susfs_module_tag }}
      droidspaces_tag:     ${{ steps.versions.outputs.droidspaces_tag }}
      gki_sub:             ${{ steps.versions.outputs.gki_sub }}
      update_detail:       ${{ steps.versions.outputs.update_detail }}
      check_failed:        ${{ steps.versions.outputs.check_failed }}
      check_failed_detail: ${{ steps.versions.outputs.check_failed_detail }}

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: "Fetch and compare upstream versions"
        id: versions
        run: bash scripts/check-sources.sh

  # Compile gate. It builds exactly what a normal run would build (KSU and SUSFS
  # float on their branches), with only the candidate DroidSpaces release tag
  # overridden — that is the one input whose patch URL is pinned, so it is the
  # one that can break on a reshuffle upstream.
  verify:
    name: "Verify candidate builds"
    needs: [check]
    if: needs.check.outputs.needs_verify == 'true'
    uses: ./.github/workflows/build.yml
    with:
      build_type:          stable
      droidspaces_tag_pin: ${{ needs.check.outputs.droidspaces_tag }}
      skip_release:        true
    secrets: inherit

  pins:
    name: "Apply verified pins"
    needs: [check, verify]
    if: always() && needs.check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    outputs:
      held_back: ${{ steps.apply.outputs.held_back }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: "Write source-pins.json"
        id: apply
        env:
          NEW_KSUN:     ${{ needs.check.outputs.ksun_tag }}
          NEW_SUSFS:    ${{ needs.check.outputs.susfs_version }}
          NEW_SUSFS_MOD: ${{ needs.check.outputs.susfs_module_tag }}
          NEW_DS:       ${{ needs.check.outputs.droidspaces_tag }}
          NEW_GKI:      ${{ needs.check.outputs.gki_sub }}
          GATE:         ${{ needs.verify.result }}
        run: |
          OLD_KSUN=$(jq -r .ksun_tag          sources/source-pins.json)
          OLD_SUSFS=$(jq -r .susfs_version     sources/source-pins.json)
          OLD_DS=$(jq -r .droidspaces_tag      sources/source-pins.json)

          HELD_BACK=()

          # "success" = the gate compiled. "skipped" = nothing that is gated moved
          # this week, so there was nothing to check — safe either way. Anything
          # else means the candidate broke the build: keep the last known-good
          # versions instead of bumping to something that does not compile.
          if [ "$GATE" = "success" ] || [ "$GATE" = "skipped" ]; then
            FINAL_KSUN="$NEW_KSUN"
            FINAL_SUSFS="$NEW_SUSFS"
            FINAL_DS="$NEW_DS"
          else
            FINAL_KSUN="$OLD_KSUN"
            FINAL_SUSFS="$OLD_SUSFS"
            FINAL_DS="$OLD_DS"
            HELD_BACK+=("verify build ${GATE}: kept KSU-Next ${OLD_KSUN}, SUSFS ${OLD_SUSFS}, DroidSpaces ${OLD_DS}")
          fi

          # Only the version fields are rewritten — repo/branch names stay as the
          # file has them, so editing those by hand is not undone by a scheduled run.
          # The GKI sublevel and the SUSFS userspace module tag don't feed the
          # KSU/SUSFS integration, so they stay ungated.
          jq --arg gki      "$NEW_GKI" \
             --arg ksun     "$FINAL_KSUN" \
             --arg susfs    "$FINAL_SUSFS" \
             --arg susfsmod "$NEW_SUSFS_MOD" \
             --arg ds       "$FINAL_DS" \
             '. + {
                gki_sublevel:   $gki,
                ksun_tag:       $ksun,
                susfs_version:  $susfs,
                susfs_module_tag: $susfsmod,
                droidspaces_tag:  $ds
              }' sources/source-pins.json > /tmp/pins.json
          mv /tmp/pins.json sources/source-pins.json

          # An empty array must not print a blank line — notify.sh treats a
          # non-empty held_back as "something was refused" and lists it.
          if [ "${#HELD_BACK[@]}" -gt 0 ]; then
            {
              echo "held_back<<EOF"
              printf '%s\n' "${HELD_BACK[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet -- sources/source-pins.json; then
            echo "[INFO] No effective change after gating — nothing to commit"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources/source-pins.json
          git commit -m "chore: update source-pins.json [skip ci]"
          git push

  notify:
    name: "Telegram report"
    needs: [check, pins]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: "Telegram"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID:  ${{ secrets.TELEGRAM_TOPIC_ID }}
          RUN_URL:           "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          HAS_UPDATE:        ${{ needs.check.outputs.has_update }}
          CHECK_KSUN_TAG:    ${{ needs.check.outputs.ksun_tag }}
          CHECK_SUSFS_VER:   ${{ needs.check.outputs.susfs_version }}
          CHECK_SUSFS_TAG:   ${{ needs.check.outputs.susfs_module_tag }}
          CHECK_DROIDSPACES: ${{ needs.check.outputs.droidspaces_tag }}
          CHECK_GKI_SUB:     ${{ needs.check.outputs.gki_sub }}
          UPDATE_DETAIL:     ${{ needs.check.outputs.update_detail }}
          CHECK_FAILED:      ${{ needs.check.outputs.check_failed }}
          CHECK_FAILED_DETAIL: ${{ needs.check.outputs.check_failed_detail }}
          HELD_BACK:         ${{ needs.pins.outputs.held_back }}
        run: bash scripts/notify.sh check
