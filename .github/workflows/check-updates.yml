name: "Check Source Updates"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'   # every Monday at 02:00 UTC

permissions:
  contents: write   # needed to commit source-pins.json update

jobs:
  check:
    name: "Check upstream versions"
    runs-on: ubuntu-latest
    outputs:
      has_update:    ${{ steps.versions.outputs.has_update }}
      ksun_tag:      ${{ steps.versions.outputs.ksun_tag }}
      sksu_tag:      ${{ steps.versions.outputs.sksu_tag }}
      susfs_tag:     ${{ steps.versions.outputs.susfs_tag }}
      ksun_commit:   ${{ steps.versions.outputs.ksun_commit }}
      sksu_commit:   ${{ steps.versions.outputs.sksu_commit }}
      susfs_commit:  ${{ steps.versions.outputs.susfs_commit }}
      gki_sub:       ${{ steps.versions.outputs.gki_sub }}
      ksun_changed:  ${{ steps.versions.outputs.ksun_changed }}
      sksu_changed:  ${{ steps.versions.outputs.sksu_changed }}
      susfs_changed: ${{ steps.versions.outputs.susfs_changed }}
      update_detail: ${{ steps.versions.outputs.update_detail }}
      check_failed:  ${{ steps.versions.outputs.check_failed }}

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: "Fetch and compare upstream versions"
        id: versions
        run: bash scripts/check-sources.sh

  # Build-gate: only runs when its commit actually moved. Uses GKI-KSU-Next/GKI-SukiSU-Ultra
  # as the cheapest representative variant — goal is "does this candidate
  # compile", not a full 6-way matrix. build_type: stable so testing/ patches
  # don't add noise to the signal.
  verify-ksun:
    name: "Verify KSU-Next candidate"
    needs: check
    if: needs.check.outputs.ksun_changed == 'true'
    uses: ./.github/workflows/build-kernel.yml
    with:
      variant_name:  "Verify-KSU-Next"
      source_type:   gki
      ksu_type:      ksun
      zip_prefix:    VERIFY_KSU-Next
      artifact_name: verify-ksun
      defconfig:     gki_defconfig
      build_type:    stable
      ksun_tag_pin:  ${{ needs.check.outputs.ksun_commit }}
      susfs_commit_pin: ${{ needs.check.outputs.susfs_commit }}
    secrets: inherit

  verify-sksu:
    name: "Verify SukiSU-Ultra candidate"
    needs: check
    if: needs.check.outputs.sksu_changed == 'true'
    uses: ./.github/workflows/build-kernel.yml
    with:
      variant_name:  "Verify-SukiSU-Ultra"
      source_type:   gki
      ksu_type:      sksu
      zip_prefix:    VERIFY_SukiSU-Ultra
      artifact_name: verify-sksu
      defconfig:     gki_defconfig
      build_type:    stable
      sksu_tag_pin:  ${{ needs.check.outputs.sksu_commit }}
      susfs_commit_pin: ${{ needs.check.outputs.susfs_commit }}
    secrets: inherit

  apply-pins:
    name: "Apply verified pins"
    needs: [check, verify-ksun, verify-sksu]
    if: always() && needs.check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    outputs:
      held_back: ${{ steps.apply.outputs.held_back }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: "Write source-pins.json (skip fields whose gate failed)"
        id: apply
        env:
          NEW_KSUN_TAG:    ${{ needs.check.outputs.ksun_tag }}
          NEW_SKSU_TAG:    ${{ needs.check.outputs.sksu_tag }}
          NEW_SUSFS_TAG:   ${{ needs.check.outputs.susfs_tag }}
          NEW_KSUN_COMMIT: ${{ needs.check.outputs.ksun_commit }}
          NEW_SKSU_COMMIT: ${{ needs.check.outputs.sksu_commit }}
          NEW_SUSFS_COMMIT: ${{ needs.check.outputs.susfs_commit }}
          NEW_GKI:         ${{ needs.check.outputs.gki_sub }}
          KSUN_GATE:       ${{ needs.verify-ksun.result }}
          SKSU_GATE:       ${{ needs.verify-sksu.result }}
        run: |
          OLD_KSUN_TAG=$(jq -r '.ksun_tag // ""' sources/source-pins.json)
          OLD_SKSU_TAG=$(jq -r '.sksu_tag // ""' sources/source-pins.json)
          OLD_KSUN_COMMIT=$(jq -r '.ksun_commit // ""' sources/source-pins.json)
          OLD_SKSU_COMMIT=$(jq -r '.sksu_commit // ""' sources/source-pins.json)

          HELD_BACK=()

          # "success" = gate ran and passed. "skipped" = commit did not change
          # this run, so new==old anyway - safe either way. Anything else
          # (failure/cancelled) means the candidate broke the build - keep
          # the last known-good commit and tag instead of bumping to a broken one.
          if [ "$KSUN_GATE" = "success" ] || [ "$KSUN_GATE" = "skipped" ]; then
            FINAL_KSUN_COMMIT="$NEW_KSUN_COMMIT"
            FINAL_KSUN_TAG="$NEW_KSUN_TAG"
          else
            FINAL_KSUN_COMMIT="$OLD_KSUN_COMMIT"
            FINAL_KSUN_TAG="$OLD_KSUN_TAG"
            HELD_BACK+=("KSU-Next: verify build failed, kept ${OLD_KSUN_COMMIT}")
          fi

          if [ "$SKSU_GATE" = "success" ] || [ "$SKSU_GATE" = "skipped" ]; then
            FINAL_SKSU_COMMIT="$NEW_SKSU_COMMIT"
            FINAL_SKSU_TAG="$NEW_SKSU_TAG"
          else
            FINAL_SKSU_COMMIT="$OLD_SKSU_COMMIT"
            FINAL_SKSU_TAG="$OLD_SKSU_TAG"
            HELD_BACK+=("SukiSU-Ultra: verify build failed, kept ${OLD_SKSU_COMMIT}")
          fi

          # SUSFS and GKI stay ungated - take the freshly-detected values.
          FINAL_SUSFS_COMMIT="$NEW_SUSFS_COMMIT"
          FINAL_SUSFS_TAG="$NEW_SUSFS_TAG"

          jq -n \
            --arg gki   "$NEW_GKI" \
            --arg ksun_tag "$FINAL_KSUN_TAG" \
            --arg ksun_commit "$FINAL_KSUN_COMMIT" \
            --arg sksu_tag "$FINAL_SKSU_TAG" \
            --arg sksu_commit "$FINAL_SKSU_COMMIT" \
            --arg susfs_tag "$FINAL_SUSFS_TAG" \
            --arg susfs_commit "$FINAL_SUSFS_COMMIT" \
            '{
              gki_sublevel: $gki,
              ksun_tag:     $ksun_tag,
              ksun_commit:  $ksun_commit,
              sksu_tag:     $sksu_tag,
              sksu_commit:  $sksu_commit,
              susfs_tag:    $susfs_tag,
              susfs_commit: $susfs_commit
            }' > sources/source-pins.json

          HELD_BACK_DETAIL=$(printf '%s\n' "${HELD_BACK[@]}")
          {
            echo "held_back<<EOF"
            echo "$HELD_BACK_DETAIL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if git diff --quiet -- sources/source-pins.json; then
            echo "[INFO] No effective change after gating — nothing to commit"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources/source-pins.json
          git commit -m "chore: update source-pins.json [skip ci]"
          git push

  notify:
    name: "Telegram report"
    needs: [check, apply-pins]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: "Telegram"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID:  ${{ secrets.TELEGRAM_TOPIC_ID }}
          RUN_URL:         "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          HAS_UPDATE:      ${{ needs.check.outputs.has_update }}
          CHECK_KSUN_TAG:  ${{ needs.check.outputs.ksun_tag }}
          CHECK_SKSU_TAG:  ${{ needs.check.outputs.sksu_tag }}
          CHECK_SUSFS_TAG: ${{ needs.check.outputs.susfs_tag }}
          CHECK_GKI_SUB:   ${{ needs.check.outputs.gki_sub }}
          UPDATE_DETAIL:   ${{ needs.check.outputs.update_detail }}
          CHECK_FAILED:    ${{ needs.check.outputs.check_failed }}
          HELD_BACK:       ${{ needs.apply-pins.outputs.held_back }}
        run: bash scripts/notify.sh check
