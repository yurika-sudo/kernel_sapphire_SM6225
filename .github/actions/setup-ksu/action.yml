name: setup-ksu
description: clone + patch KSU variant and SUSFS

inputs:
  ksu_type:
    required: true
  kernel_dir:
    required: true
  work_dir:
    required: true

runs:
  using: composite
  steps:
    - name: Wild-KSU + SUSFS
      if: inputs.ksu_type == 'wild'
      shell: bash
      working-directory: ${{ inputs.kernel_dir }}
      run: |
        set -e
        rm -rf ./KernelSU ./drivers/kernelsu ./Wild_KSU
        curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s canary
        [ -d "Wild_KSU" ] || { echo "Wild_KSU not found"; exit 1; }

        cd Wild_KSU
        git fetch --tags 2>/dev/null || true
        KSU_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "unknown")
        echo "WILD_KSU_TAG=$KSU_TAG" >> $GITHUB_ENV
        echo "$KSU_TAG" > ${{ inputs.work_dir }}/wild_ksu_tag.txt
        cd ..

        # d8358055 — pre-static_key, pairs clean w/ Wild canary
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
        cd susfs4ksu && git checkout d8358055 && cd ..

        SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
        [ -f "$SUSFS_PATCH" ] && patch -p1 --forward < "$SUSFS_PATCH" || true
        mkdir -p fs include/linux
        cp -f susfs4ksu/kernel_patches/fs/* fs/
        cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/

        KSU_C="Wild_KSU/kernel/ksu.c"
        if ! grep -q "susfs_init" "$KSU_C" 2>/dev/null; then
          grep -q "#include <linux/susfs.h>" "$KSU_C" || \
            sed -i '/#include <linux\/fs\.h>/a #include <linux/susfs.h>' "$KSU_C"
          grep -q "susfs_init()" "$KSU_C" || \
            sed -i '/ksu_core_init();/a \\tsusfs_init();' "$KSU_C" || \
            sed -i '/int __init ksu_init(/,/^}/{ /return 0;/i \\tsusfs_init(); }' "$KSU_C"
        fi

        [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ] && \
          ln -sf ../Wild_KSU drivers/kernelsu
        grep -q "obj-.*kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
        grep -q "kernelsu/Kconfig" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        rm -rf susfs4ksu

    - name: SukiSU + SUSFS + KPM
      if: inputs.ksu_type == 'suki'
      shell: bash
      working-directory: ${{ inputs.kernel_dir }}
      run: |
        set -e
        rm -rf ./KernelSU ./drivers/kernelsu
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
        [ -d "KernelSU" ] || { echo "KernelSU not found"; exit 1; }

        cd KernelSU
        # d43e250 — pre-adb_root, no PT_REGS_PARM errors on 5.15
        git fetch --depth=100 2>/dev/null || true
        git checkout d43e250
        git fetch --tags 2>/dev/null || true
        SUKI_TAG=$(git describe --tags --abbrev=0 2>/dev/null || \
          curl -sf "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest" \
          | jq -r '.tag_name' 2>/dev/null || echo "unknown")
        echo "SUKI_TAG=$SUKI_TAG" >> $GITHUB_ENV
        echo "$SUKI_TAG" > ${{ inputs.work_dir }}/suki_ksu_tag.txt
        cd ..

        # d835805 — proven pair w/ d43e250 SukiSU
        git clone https://github.com/ShirkNeko/susfs4ksu.git -b gki-android13-5.15
        cd susfs4ksu && git checkout d835805 && cd ..

        SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
        [ -f "$SUSFS_PATCH" ] && patch -p1 --fuzz=3 < "$SUSFS_PATCH" || true
        mkdir -p fs include/linux
        cp -f susfs4ksu/kernel_patches/fs/* fs/
        cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/

        KSU_C="KernelSU/kernel/ksu.c"
        if [ -f "$KSU_C" ] && ! grep -q "susfs_init" "$KSU_C" 2>/dev/null; then
          grep -q "#include <linux/susfs.h>" "$KSU_C" || \
            sed -i '/#include <linux\/fs\.h>/a #include <linux\/susfs.h>/' "$KSU_C" || true
          grep -q "susfs_init()" "$KSU_C" || \
            sed -i '/ksu_core_init();/a \tsusfs_init();' "$KSU_C" || \
            sed -i '/int __init ksu_init(/,/^}/{ /return 0;/i \tsusfs_init(); }' "$KSU_C" || true
          echo "[OK] susfs_init injected"
        fi

        [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ] && \
          ln -sf ../KernelSU drivers/kernelsu
        grep -q "obj-.*kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
        grep -q "kernelsu/Kconfig" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        rm -rf susfs4ksu
        
