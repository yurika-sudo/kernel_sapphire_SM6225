name: setup-ksu
description: clone + patch KSU variant and SUSFS

inputs:
  ksu_type:
    required: true
  kernel_dir:
    required: true
  work_dir:
    required: true

runs:
  using: composite
  steps:
    - name: KSUN + SUSFS
      if: inputs.ksu_type == 'ksun'
      shell: bash
      working-directory: ${{ inputs.kernel_dir }}
      run: |
        set -e
        rm -rf ./KernelSU-Next ./drivers/kernelsu
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" \
          | bash -s 4c9737aed458843e920de95b0bcad56cf790663b
        [ -d "KernelSU-Next" ] || { echo "KernelSU-Next not found"; exit 1; }

        cd KernelSU-Next
        git fetch --tags 2>/dev/null || true
        KSUN_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "unknown")
        echo "KSUN_TAG=$KSUN_TAG" >> $GITHUB_ENV
        echo "$KSUN_TAG" > ${{ inputs.work_dir }}/ksun_tag.txt
        echo "KSUN: $(git log -1 --format='%h %s')"
        cd ..

        # simonpunk SUSFS — upstream HEAD, no pin
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
        echo "SUSFS: $(git -C susfs4ksu log -1 --format='%h %s')"

        # Apply bridge patch to KSUN (specific to 4c9737a)
        BRIDGE="${{ inputs.work_dir }}/kernel_patches-main/wild/ksun-4c9737a-susfs-v2.1.0-a14-6.1-ef16cbce.patch"
        [ -f "$BRIDGE" ] || { echo "Bridge patch not found at $BRIDGE"; exit 1; }
        cd KernelSU-Next
        patch -p1 < "../$BRIDGE"
        echo "[OK] Bridge patch applied"
        cd ..

        # Apply SUSFS kernel-side patches
        SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
        [ -f "$SUSFS_PATCH" ] && patch -p1 --forward < "$SUSFS_PATCH" || true
        mkdir -p fs include/linux
        cp -f susfs4ksu/kernel_patches/fs/* fs/
        cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/

        [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ] && \
          ln -sf ../KernelSU-Next drivers/kernelsu
        grep -q "obj-.*kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
        grep -q "kernelsu/Kconfig" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        rm -rf susfs4ksu

    - name: SukiSU + SUSFS + KPM
      if: inputs.ksu_type == 'suki'
      shell: bash
      working-directory: ${{ inputs.kernel_dir }}
      run: |
        set -e
        rm -rf ./KernelSU ./drivers/kernelsu
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        [ -d "KernelSU" ] || { echo "KernelSU not found"; exit 1; }

        cd KernelSU
        git fetch --tags 2>/dev/null || true
        SUKI_TAG=$(git describe --tags --abbrev=0 2>/dev/null || \
          curl -sf "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest" \
          | jq -r '.tag_name' 2>/dev/null || echo "unknown")
        echo "SUKI_TAG=$SUKI_TAG" >> $GITHUB_ENV
        echo "$SUKI_TAG" > ${{ inputs.work_dir }}/suki_ksu_tag.txt
        echo "SukiSU: $(git log -1 --format='%h %s')"
        cd ..

        # ShirkNeko SUSFS — upstream HEAD, no pin
        git clone https://github.com/ShirkNeko/susfs4ksu.git -b gki-android13-5.15
        echo "SUSFS: $(git -C susfs4ksu log -1 --format='%h %s')"

        # Apply SUSFS integration patch to SukiSU
        KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
        [ -f "$KSU_PATCH" ] || { echo "10_enable_susfs patch not found"; exit 1; }
        cd KernelSU
        patch -p1 --fuzz=3 < "../$KSU_PATCH"
        echo "[OK] 10_enable_susfs applied"
        cd ..

        # Apply SUSFS kernel-side patches
        SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
        [ -f "$SUSFS_PATCH" ] && patch -p1 --fuzz=3 < "$SUSFS_PATCH" || true
        mkdir -p fs include/linux
        cp -f susfs4ksu/kernel_patches/fs/* fs/
        cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/

        [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ] && \
          ln -sf ../KernelSU drivers/kernelsu
        grep -q "obj-.*kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
        grep -q "kernelsu/Kconfig" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        rm -rf susfs4ksu
