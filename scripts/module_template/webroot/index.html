<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seiran Core</title>
<style>
  body { background:#0d0d0d; color:#e0e0e0; font-family:monospace; padding:20px; margin:0; }
  h2 { color:#fff; margin-bottom:4px; }
  .sub { color:#888; font-size:12px; margin-bottom:24px; }
  .card { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; padding:16px; margin-bottom:16px; }
  .status-row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; border-bottom:1px solid #222; }
  .status-row:last-child { border-bottom:none; }
  .ok { color:#4caf50; }
  .off { color:#666; }
  .warn { color:#ff9800; }
  button { width:100%; padding:14px; border:none; border-radius:10px; font-size:15px; font-family:monospace; cursor:pointer; margin-top:8px; }
  #btn-activate { background:#1e88e5; color:#fff; }
  #btn-deactivate { background:#333; color:#aaa; }
  #btn-activate:disabled, #btn-deactivate:disabled { opacity:0.4; cursor:not-allowed; }
  #log { background:#111; border:1px solid #222; border-radius:8px; padding:12px; font-size:11px; color:#aaa; white-space:pre-wrap; min-height:80px; margin-top:16px; }
  .spinner { display:inline-block; animation:spin 1s linear infinite; }
  @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
</style>
</head>
<body>
<h2>Seiran Core</h2>
<div class="sub">ath9k · AR9271 · TL-WN722N</div>

<div class="card" id="status-card">
  <div class="status-row"><span>dongle (0cf3:9271)</span><span id="s-dongle" class="off">checking...</span></div>
  <div class="status-row"><span>wlan (Qualcomm)</span><span id="s-wlan" class="off">checking...</span></div>
  <div class="status-row"><span>cfg80211</span><span id="s-cfg" class="off">checking...</span></div>
  <div class="status-row"><span>mac80211</span><span id="s-mac" class="off">checking...</span></div>
  <div class="status-row"><span>ath9k_htc</span><span id="s-ath" class="off">checking...</span></div>
  <div class="status-row"><span>wlan1 interface</span><span id="s-wlan1" class="off">checking...</span></div>
</div>

<button id="btn-activate" onclick="activate()">⚡ Activate Dongle</button>
<button id="btn-deactivate" onclick="deactivate()">✕ Deactivate</button>

<div id="log"></div>

<script>
const MODDIR = "/data/adb/modules/seiran_core/module";
const IW = "/data/data/com.termux/files/usr/bin/iw";

function log(msg) {
  const el = document.getElementById("log");
  el.textContent += msg + "\n";
  el.scrollTop = el.scrollHeight;
}

function setStatus(id, text, cls) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = cls;
}

async function run(cmd) {
  const r = await ksu.exec(cmd, [], 10000);
  return r;
}

async function refreshStatus() {
  const dongle = await run("lsusb 2>/dev/null | grep -c 0cf3:9271 || echo 0");
  setStatus("s-dongle",
    dongle.stdout.trim() === "1" ? "connected" : "not connected",
    dongle.stdout.trim() === "1" ? "ok" : "off");

  const wlan = await run("lsmod | grep -c '^wlan ' || echo 0");
  setStatus("s-wlan",
    wlan.stdout.trim() === "1" ? "loaded" : "unloaded",
    wlan.stdout.trim() === "1" ? "warn" : "off");

  const cfg = await run("lsmod | grep -c '^cfg80211 ' || echo 0");
  setStatus("s-cfg",
    cfg.stdout.trim() === "1" ? "loaded" : "not loaded",
    cfg.stdout.trim() === "1" ? "ok" : "off");

  const mac = await run("lsmod | grep -c '^mac80211 ' || echo 0");
  setStatus("s-mac",
    mac.stdout.trim() === "1" ? "loaded" : "not loaded",
    mac.stdout.trim() === "1" ? "ok" : "off");

  const ath = await run("lsmod | grep -c '^ath9k_htc ' || echo 0");
  setStatus("s-ath",
    ath.stdout.trim() === "1" ? "loaded" : "not loaded",
    ath.stdout.trim() === "1" ? "ok" : "off");

  const wlan1 = await run("ip link show wlan1 2>/dev/null | grep -c wlan1 || echo 0");
  setStatus("s-wlan1",
    wlan1.stdout.trim() === "1" ? "up" : "absent",
    wlan1.stdout.trim() === "1" ? "ok" : "off");
}

async function activate() {
  document.getElementById("btn-activate").disabled = true;
  document.getElementById("btn-deactivate").disabled = true;
  document.getElementById("log").textContent = "";

  log("⚠ WiFi and Bluetooth must be OFF before proceeding.");
  log("Checking dongle...");

  const dongle = await run("lsusb 2>/dev/null | grep -c 0cf3:9271 || echo 0");
  if (dongle.stdout.trim() !== "1") {
    log("✕ Dongle not detected. Plug in TL-WN722N first.");
    document.getElementById("btn-activate").disabled = false;
    document.getElementById("btn-deactivate").disabled = false;
    return;
  }
  log("✓ Dongle detected.");

  log("Unloading wlan...");
  await run("rmmod wlan 2>/dev/null; sleep 1");
  await run("rmmod cfg80211 2>/dev/null; sleep 1");

  log("Loading cfg80211 + mac80211...");
  const r1 = await run("insmod " + MODDIR + "/cfg80211.ko 2>&1");
  if (r1.errno !== 0 && !r1.stderr.includes("File exists")) {
    log("✕ cfg80211 failed: " + r1.stderr); finish(); return;
  }
  const r2 = await run("insmod " + MODDIR + "/mac80211.ko 2>&1");
  if (r2.errno !== 0 && !r2.stderr.includes("File exists")) {
    log("✕ mac80211 failed: " + r2.stderr); finish(); return;
  }

  log("Loading ath chain...");
  await run("insmod " + MODDIR + "/ath.ko 2>/dev/null");
  await run("insmod " + MODDIR + "/ath9k_hw.ko 2>/dev/null");
  await run("insmod " + MODDIR + "/ath9k_common.ko 2>/dev/null");
  await run("insmod " + MODDIR + "/ath9k_htc.ko 2>/dev/null");

  log("Waiting for phy...");
  let phy = "";
  for (let i = 0; i < 10; i++) {
    await new Promise(r => setTimeout(r, 800));
    const p = await run("ls /sys/class/ieee80211/ 2>/dev/null | tail -1");
    if (p.stdout.trim()) { phy = p.stdout.trim(); break; }
  }

  if (!phy) {
    log("✕ No phy registered. Check dmesg."); finish(); return;
  }
  log("✓ phy: " + phy);

  log("Creating wlan1 interface...");
  await run(IW + " phy " + phy + " interface add wlan1 type managed 2>/dev/null");
  await run("ip link set wlan1 up 2>/dev/null");

  const check = await run("ip link show wlan1 2>/dev/null | grep -c wlan1 || echo 0");
  if (check.stdout.trim() === "1") {
    log("✓ wlan1 is up. Ready.");
  } else {
    log("✕ wlan1 not found after add.");
  }

  finish();
}

async function deactivate() {
  document.getElementById("btn-activate").disabled = true;
  document.getElementById("btn-deactivate").disabled = true;
  document.getElementById("log").textContent = "";

  log("Bringing down wlan1...");
  await run("ip link set wlan1 down 2>/dev/null");
  await run(IW + " dev wlan1 del 2>/dev/null");

  log("Unloading ath chain...");
  await run("rmmod ath9k_htc 2>/dev/null; sleep 1");
  await run("rmmod ath9k_common 2>/dev/null");
  await run("rmmod ath9k_hw 2>/dev/null");
  await run("rmmod ath 2>/dev/null");
  await run("rmmod mac80211 2>/dev/null");

  log("Done. Reboot to restore Qualcomm WiFi.");
  finish();
}

function finish() {
  document.getElementById("btn-activate").disabled = false;
  document.getElementById("btn-deactivate").disabled = false;
  refreshStatus();
}

refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
